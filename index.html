<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晞予美甲線上預約</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "NT$    $    NT$    $\n$    NT$    $    NT$\nNT$    $    NT$    $\n$NT$    $    NT$    $";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root { color-scheme: light; }

    input[type="checkbox"], input[type="radio"], input[type="date"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: opacity(0.6) sepia(100%) hue-rotate(330deg);
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #ebdcd3;
      margin-bottom: 20px;
    }
    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #d4c7b8;
    }
    .user-name {
      font-weight: bold;
      font-size: 16px;
      color: #5c5049;
    }
    .user-status {
      font-size: 12px;
      color: #8c7c75;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .section.disabled-step {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(40%);
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label { font-size: 15.5px; color: #524741; cursor: pointer; }

    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus, input[type="date"]:focus {
      border-color: #7a6b63;
      box-shadow: 0 0 4px rgba(122, 107, 99, 0.25);
    }

    @keyframes selectFlash {
      0% { border-color: #7a6b63; box-shadow: 0 0 0 3px rgba(122, 107, 99, 0.4); background-color: #ffffff; }
      50% { border-color: #a8988e; box-shadow: 0 0 0 5px rgba(122, 107, 99, 0.6); background-color: #eae1d7; }
      100% { border-color: #cfc5bb; box-shadow: none; background-color: #ffffff; }
    }

    .flash-highlight {
      animation: selectFlash 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 8px;
    }
    
    select option:disabled { color: #c0b5ac; background-color: #f5f2ed; }

    .datetime-container { display: flex; flex-direction: column; gap: 10px; }
    .time-picker-group { display: flex; gap: 8px; align-items: center; }
    .time-picker-group select { flex: 1; text-align: center; }

    .tone-palette-group { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; padding: 6px 4px; }
    .tone-option { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 10px; border-radius: 20px; transition: all 0.25s ease; user-select: none; white-space: nowrap; }
    .tone-option:hover { background-color: rgba(240, 236, 227, 0.6); }
    .color-dot { width: 18px; height: 18px; border-radius: 50%; box-sizing: border-box; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; flex-shrink: 0; background-color: #e8e0d5; border: 1.5px solid #d4c7b8; }
    .tone-label { font-size: 15px; color: #8c7c75; font-weight: 500; white-space: nowrap; transition: color 0.25s ease, font-weight 0.25s ease; }
    .tone-option.active .color-dot { background-color: #7a6b63; border-color: #5c5049; transform: scale(1.15); box-shadow: 0 0 0 2.5px #faf8f5, 0 0 0 4.5px #7a6b63; }
    .tone-option.active .tone-label { color: #3d3028; font-weight: 700; }

    .addon-item-box { border: 1.5px dashed #c2b5aa; background-color: #fcfaf7; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.25s ease; }
    .addon-item-box:hover { border-color: #827167; background-color: #f5efe8; }
    .addon-item-box.active { border-style: solid; border-color: #7a6b63; background-color: #f2ebe4; box-shadow: 0 2px 8px rgba(122, 107, 99, 0.12); }
    .addon-header { display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold; color: #5c5049; }
    .addon-badge { font-size: 13px; background-color: #e5ded7; color: #6e6057; padding: 3px 10px; border-radius: 20px; transition: all 0.2s ease; }
    .addon-item-box.active .addon-badge { background-color: #7a6b63; color: #ffffff; }

    .removal-card-group { display: flex; gap: 12px; margin-top: 10px; }
    .removal-card { flex: 1; border: 1.5px dashed #c2b5aa; background-color: #fcfaf7; border-radius: 12px; padding: 16px 10px; text-align: center; cursor: pointer; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); user-select: none; display: flex; align-items: center; justify-content: center; }
    .removal-card:hover { border-color: #827167; background-color: #f5efe8; }
    .removal-card.active { border-style: solid; border-color: #bdaca2; background-color: #f2ebe4; transform: scale(1.03); box-shadow: 0 4px 12px rgba(122, 107, 99, 0.15); }
    .removal-card-title { font-size: 16.5px; font-weight: bold; color: #4e423b; margin: 0; }

    .draw-btn { background-color: #e4dcd3; color: #4a423d; border: 1px solid #c9bebc; padding: 5px 14px; border-radius: 16px; font-size: 13.5px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .draw-btn:hover { background-color: #d7ccc3; transform: translateY(-1px); }

    .hidden { display: none !important; }

    .checkbox-grid { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 8px 10px; padding: 10px; background-color: #ffffff; border-radius: 12px; border: 1px solid #ebdcd3; }

    .chip-item { display: inline-flex; align-items: center; justify-content: center; padding: 8px 10px; border-radius: 20px; background-color: transparent; border: none; color: #524741; font-size: 14.5px; font-weight: 500; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); user-select: none; text-align: center; white-space: nowrap; }
    .chip-item input[type="checkbox"], .chip-item input[type="radio"] { display: none; }
    .chip-item::before { content: ""; display: inline-block; width: 0; opacity: 0; transition: all 0.2s ease; margin-right: 0; }
    .chip-item:hover { background-color: #f5efe8; border-radius: 20px; }
    .chip-item:has(input:checked) { background-color: #7a6b63; border-color: #5c5049; color: #ffffff; font-weight: 600; box-shadow: 0 2px 6px rgba(122, 107, 99, 0.25); }
    .chip-item:has(input:checked)::before { content: "✓"; width: 14px; opacity: 1; margin-right: 4px; font-weight: bold; }
    
    .total-box { background-color: #ebdcd3; color: #4e423b; padding: 14px; border-radius: 12px; text-align: center; font-size: 19px; font-weight: bold; margin-top: 10px; margin-bottom: 18px; letter-spacing: 0.5px; }
    .submit-btn { width: 100%; background-color: #7a6b63; color: #ffffff; border: none; padding: 12px; font-size: 17.5px; font-weight: bold; border-radius: 22px; cursor: pointer; box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2); transition: background 0.2s; letter-spacing: 1px; }
    .submit-btn:hover { background-color: #5c5049; }
    .submit-btn:disabled { background-color: #aaa; cursor: not-allowed; }
    .sub-input { margin-top: 8px; }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="card">
  <!-- LINE 顧客資訊區塊 -->
  <div class="user-profile">
    <img id="avatar" class="user-avatar" src="https://via.placeholder.com/44" alt="頭像">
    <div>
      <div id="displayName" class="user-name">載入中...</div>
      <div class="user-status">LINE 帳號已驗證</div>
    </div>
  </div>

  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <!-- Step 1. 預約日期與時間 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="date" id="bookingDate" onchange="validateDateTime()">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour" onchange="validateDateTime()">
            <option value="00">00 時</option><option value="01">01 時</option><option value="02">02 時</option>
            <option value="03">03 時</option><option value="04">04 時</option><option value="05">05 時</option>
            <option value="06">06 時</option><option value="07">07 時</option><option value="08">08 時</option>
            <option value="09">09 時</option><option value="10">10 時</option><option value="11">11 時</option>
            <option value="12">12 時</option><option value="13">13 時</option><option value="14">14 時</option>
            <option value="15">15 時</option><option value="16">16 時</option><option value="17">17 時</option>
            <option value="18">18 時</option><option value="19">19 時</option><option value="20">20 時</option>
            <option value="21">21 時</option><option value="22">22 時</option><option value="23">23 時</option>
          </select>
          <select id="bookingMinute" onchange="validateDateTime()">
            <option value="00">00 分</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="45">45 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2. 單色款式 -->
  <div class="section">
    <div class="section-title">
      Step 2. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🫯 幫我抽色系</button>
    </div>
    <select id="mainColor" onchange="onMainColorChange()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="紅色">紅色</option>
      <option value="粉色">粉色</option>
      <option value="橘色">橘色</option>
      <option value="黃色">黃色</option>
      <option value="紅咖色">紅咖色</option>
      <option value="深咖/可可色">深咖/可可色</option>
      <option value="淺咖色">淺咖色</option>
      <option value="綠色">綠色</option>
      <option value="藍色">藍色</option>
      <option value="紫色">紫色</option>
      <option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option>
      <option value="灰色">灰色</option>
      <option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- Step 3. 加購項目 -->
  <div class="section disabled-step" id="step3Section">
    <div style="font-weight: bold; color: #5c5049; margin-bottom: 12px; font-size: 16.5px;">
      Step 3. 加購項目
    </div>

    <!-- 跳色 -->
    <div id="boxJumpColor" class="addon-item-box" onclick="toggleOption('jumpColorSection', event)">
      <div class="addon-header">
        <span>🎨 跳色</span>
        <span id="badgeJumpColor" class="addon-badge">50 元 ➕</span>
      </div>
      <div id="jumpColorSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div style="font-size: 13.5px; font-weight: bold; color: #5c5049;">選擇色系：</div>
          <button class="draw-btn" onclick="drawSmartJumpColor(event)">🫯 隨機配色</button>
        </div>
        <div>
          <select id="jumpColor" onchange="onSelectionChange()">
            <option value="">--請選擇跳色色系--</option>
            <option value="紅色">紅色</option>
            <option value="粉色">粉色</option>
            <option value="橘色">橘色</option>
            <option value="黃色">黃色</option>
            <option value="紅咖色">紅咖色</option>
            <option value="深咖/可可色">深咖/可可色</option>
            <option value="淺咖色">淺咖色</option>
            <option value="綠色">綠色</option>
            <option value="藍色">藍色</option>
            <option value="紫色">紫色</option>
            <option value="黑色">黑色</option>
            <option value="銀色/白色">銀色/白色</option>
            <option value="灰色">灰色</option>
            <option value="金色/香檳色">金色/香檳色</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 款式造型 -->
    <div id="boxStyle" class="addon-item-box" onclick="toggleOption('styleSection', event)">
      <div class="addon-header">
        <span>✨ 款式造型</span>
        <span id="badgeStyle" class="addon-badge">50元起 ➕</span>
      </div>
      <div id="styleSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
          <button class="draw-btn" onclick="drawStyle(event)">🫯 幫我抽款式</button>
        </div>

        <div class="removal-card-group" style="margin-top: 0; margin-bottom: 12px; gap: 8px;">
          <div id="typePartialCard" class="removal-card" onclick="setStyleType('partial')" style="padding: 10px; font-size: 15px;">
            <div class="removal-card-title" style="font-size: 15px;">局部造型</div>
          </div>
          <div id="typeFullCard" class="removal-card" onclick="setStyleType('full')" style="padding: 10px; font-size: 15px;">
            <div class="removal-card-title" style="font-size: 15px;">十指造型</div>
          </div>
        </div>
        <input type="radio" name="styleType" value="partial" id="radioPartial" style="display:none;">
        <input type="radio" name="styleType" value="full" id="radioFull" style="display:none;">
        
        <!-- 局部造型選項 -->
        <div id="partialStyleGroup" class="hidden">
          <div style="font-size: 12px; color: #8c7c75; margin-bottom: 4px; font-weight: 500;">(至多5指造型+5指以上單色/跳色)</div>
          <div class="checkbox-grid" style="margin-bottom: 12px;">
            <label class="chip-item"><input type="checkbox" name="style" id="catEyeCb" value="貓眼" onchange="checkLimit(this)">貓眼</label>
            <label class="chip-item"><input type="checkbox" name="style" value="立體不規則造型" onchange="checkLimit(this)">立體不規則造型</label>
            <label class="chip-item"><input type="checkbox" name="style" value="法式" onchange="checkLimit(this)">法式</label>
            <label class="chip-item"><input type="checkbox" name="style" value="鏡面銀" onchange="checkLimit(this)">鏡面銀</label>
            <label class="chip-item"><input type="checkbox" name="style" value="漸層" onchange="checkLimit(this)">漸層</label>
            <label class="chip-item"><input type="checkbox" name="style" value="小飾品/貼紙" onchange="checkLimit(this)">小飾品/貼紙</label>
            <label class="chip-item"><input type="checkbox" name="style" value="格紋" onchange="checkLimit(this)">格紋</label>
            <label class="chip-item"><input type="checkbox" name="style" value="暈染" onchange="checkLimit(this)">暈染</label>
            <label class="chip-item"><input type="checkbox" name="style" value="海莉款" onchange="checkLimit(this)">海莉款</label>
            <label class="chip-item"><input type="checkbox" name="style" id="customStyleCb" value="指定圖案" onchange="checkLimit(this)">指定圖案</label>
          </div>
        </div>

        <!-- 十指造型選項 -->
        <div id="fullStyleGroup" class="hidden">
          <div style="font-size: 12px; color: transparent; margin-bottom: 4px;">(佔位)</div>
          <div class="checkbox-grid" style="margin-bottom: 12px;">
            <label class="chip-item"><input type="checkbox" name="fullStyle" id="fullCatEyeCb" value="貓眼" onchange="checkFullLimit(this)">貓眼</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="立體不規則造型" onchange="checkFullLimit(this)">立體不規則造型</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="法式" onchange="checkFullLimit(this)">法式</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="鏡面銀" onchange="checkFullLimit(this)">鏡面銀</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="漸層" onchange="checkFullLimit(this)">漸層</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="小飾品/貼紙" onchange="checkFullLimit(this)">小飾品/貼紙</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="格紋" onchange="checkFullLimit(this)">格紋</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="暈染" onchange="checkFullLimit(this)">暈染</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="海莉款" onchange="checkFullLimit(this)">海莉款</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" id="fullCustomStyleCb" value="指定圖案" onchange="checkFullLimit(this)">指定圖案</label>
          </div>
        </div>

        <div id="catEyeDetailDiv" class="sub-input hidden">
          <label style="font-size: 13px; font-weight: bold; color: #5c5049;">貓眼類型：</label>
          <select id="catEyeType" style="background-color: #ffffff; font-weight: bold;">
            <option value="指定單色貓眼">指定單色貓眼</option>
            <option value="雙色貓眼">雙色貓眼</option>
          </select>
        </div>

        <div id="customInputDiv" class="sub-input hidden">
          <input type="text" id="customPattern" placeholder="請填寫指定圖案細節 (必填)">
        </div>
      </div>
    </div>
  </div>

  <!-- Step 4. 色調 -->
  <div class="section disabled-step" id="step4Section">
    <div class="section-title">Step 4. 色調</div>
    <div class="tone-palette-group">
      <div class="tone-option active" onclick="selectToneDot(this, '隨機')">
        <span class="color-dot"></span>
        <span class="tone-label">隨機</span>
      </div>
      <div class="tone-option" onclick="selectToneDot(this, '個性暗色調')">
        <span class="color-dot"></span>
        <span class="tone-label">個性暗色調</span>
      </div>
      <div class="tone-option" onclick="selectToneDot(this, '清透亮色調')">
        <span class="color-dot"></span>
        <span class="tone-label">清透亮色調</span>
      </div>
    </div>
    <input type="hidden" id="selectedTone" value="隨機">
  </div>

  <!-- Step 5. 卸甲服務 -->
  <div class="section">
    <div class="section-title">Step 5. 卸甲服務</div>
    <div class="removal-card-group">
      <div id="removalYesCard" class="removal-card" onclick="setRemoval(true)">
        <div class="removal-card-title">需要卸甲</div>
      </div>
      <div id="removalNoCard" class="removal-card active" onclick="setRemoval(false)">
        <div class="removal-card-title">不需要</div>
      </div>
    </div>
  </div>

  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">0</span> 元
  </div>

  <button id="submitBtn" class="submit-btn" onclick="sendBooking()">送出預約單 (開啟 LINE)</button>
</div>

<script>
  // 基礎設定
  const LIFF_ID = '2011884932-heTsoGVG';
  const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec';

  let userProfile = {};
  let showJumpColor = false, showStyle = false;
  let needRemoval = false;

  const ALL_COLORS = [
    "紅色", "粉色", "橘色", "黃色", "紅咖色", 
    "深咖/可可色", "淺咖色", "綠色", "藍色", "紫色", 
    "黑色", "銀色/白色", "灰色", "金色/香檳色"
  ];

  // 初始化與 LIFF 綁定
  window.onload = function() {
    initDatePicker();
    liff.init({ liffId: LIFF_ID }).then(() => {
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        liff.getProfile().then(profile => {
          userProfile = profile;
          document.getElementById('displayName').innerText = profile.displayName;
          document.getElementById('avatar').src = profile.pictureUrl || 'https://via.placeholder.com/44';
        });
      }
    }).catch(err => console.error("LIFF Init Error:", err));
  };

  // 防複製設定
  document.addEventListener('keydown', function(e) {
    if (e.keyCode === 123 || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 67)) || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74))) {
      e.preventDefault(); return false;
    }
  });

  // 取得裝置當前時間（直接使用 new Date() 避免 iOS Safari Invalid Date 錯誤）
  function getTaipeiDate() {
    return new Date();
  }

  function formatDateToYYYYMMDD(dateObj) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function initDatePicker() {
    const taipeiNow = getTaipeiDate();
    const todayStr = formatDateToYYYYMMDD(taipeiNow);
    const dateInput = document.getElementById("bookingDate");
    
    dateInput.min = todayStr;
    if (!dateInput.value || dateInput.value < todayStr) {
      dateInput.value = todayStr;
    }
    validateDateTime();
  }

  function validateDateTime() {
    const dateInput = document.getElementById("bookingDate");
    const hourSelect = document.getElementById("bookingHour");
    const minuteSelect = document.getElementById("bookingMinute");
    const selectedDateStr = dateInput.value;

    if (!selectedDateStr) return;

    const taipeiNow = getTaipeiDate();
    const todayStr = formatDateToYYYYMMDD(taipeiNow);
    const currentHour = taipeiNow.getHours();
    const currentMinute = taipeiNow.getMinutes();

    const isToday = (selectedDateStr === todayStr);

    let firstValidHour = null;
    Array.from(hourSelect.options).forEach(opt => {
      const h = parseInt(opt.value, 10);
      if (isToday && h < currentHour) {
        opt.disabled = true;
      } else {
        opt.disabled = false;
        if (firstValidHour === null) firstValidHour = opt.value;
      }
    });

    if (hourSelect.selectedOptions[0] && hourSelect.selectedOptions[0].disabled) {
      if (firstValidHour !== null) hourSelect.value = firstValidHour;
    }

    const selectedHour = parseInt(hourSelect.value, 10);
    let firstValidMinute = null;
    Array.from(minuteSelect.options).forEach(opt => {
      const m = parseInt(opt.value, 10);
      if (isToday && selectedHour === currentHour && m <= currentMinute) {
        opt.disabled = true;
      } else {
        opt.disabled = false;
        if (firstValidMinute === null) firstValidMinute = opt.value;
      }
    });

    if (minuteSelect.selectedOptions[0] && minuteSelect.selectedOptions[0].disabled) {
      if (firstValidMinute !== null) {
        minuteSelect.value = firstValidMinute;
      } else {
        const nextHourIndex = hourSelect.selectedIndex + 1;
        if (nextHourIndex < hourSelect.options.length) {
          hourSelect.selectedIndex = nextHourIndex;
          validateDateTime();
        }
      }
    }
  }

  function onMainColorChange() {
    const mainColorVal = document.getElementById('mainColor').value;
    const step3 = document.getElementById('step3Section');
    const step4 = document.getElementById('step4Section');

    if (mainColorVal !== "") {
      step3.classList.remove('disabled-step');
      step4.classList.remove('disabled-step');
    } else {
      step3.classList.add('disabled-step');
      step4.classList.add('disabled-step');

      showJumpColor = false;
      showStyle = false;
      document.getElementById('jumpColorSection').classList.add('hidden');
      document.getElementById('styleSection').classList.add('hidden');
      document.getElementById('boxJumpColor').classList.remove('active');
      document.getElementById('boxStyle').classList.remove('active');
      document.getElementById('badgeJumpColor').innerText = '50 元 ➕';
      document.getElementById('badgeStyle').innerText = '50元起 ➕';
      document.getElementById('jumpColor').value = "";
      
      document.getElementById('radioPartial').checked = false;
      document.getElementById('radioFull').checked = false;
      document.getElementById('typePartialCard').classList.remove('active');
      document.getElementById('typeFullCard').classList.remove('active');
      document.getElementById('partialStyleGroup').classList.add('hidden');
      document.getElementById('fullStyleGroup').classList.add('hidden');

      document.querySelectorAll('input[name="style"]').forEach(cb => cb.checked = false);
      document.querySelectorAll('input[name="fullStyle"]').forEach(cb => cb.checked = false);
      document.getElementById('customPattern').value = "";
    }
    onSelectionChange();
  }

  function selectToneDot(element, value) {
    const options = document.querySelectorAll('.tone-option');
    options.forEach(opt => opt.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('selectedTone').value = value;
  }

  function setRemoval(status) {
    needRemoval = status;
    const yesCard = document.getElementById('removalYesCard');
    const noCard = document.getElementById('removalNoCard');

    if (needRemoval) {
      yesCard.classList.add('active');
      noCard.classList.remove('active');
    } else {
      noCard.classList.add('active');
      yesCard.classList.remove('active');
    }
    onSelectionChange();
  }

  function toggleOption(id, event) {
    if (event) event.stopPropagation();
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') { 
      showJumpColor = !showJumpColor; 
      el.classList.toggle('hidden', !showJumpColor); 
      document.getElementById('boxJumpColor').classList.toggle('active', showJumpColor);
      document.getElementById('badgeJumpColor').innerText = showJumpColor ? '已加購 ✔' : '50 元 ➕';
    }
    else if (id === 'styleSection') { 
      showStyle = !showStyle; 
      el.classList.toggle('hidden', !showStyle); 
      document.getElementById('boxStyle').classList.toggle('active', showStyle);
      document.getElementById('badgeStyle').innerText = showStyle ? '已加購 ✔' : '50元起 ➕';

      if (showStyle) {
        document.getElementById('radioPartial').checked = false;
        document.getElementById('radioFull').checked = false;
        document.getElementById('typePartialCard').classList.remove('active');
        document.getElementById('typeFullCard').classList.remove('active');
        document.getElementById('partialStyleGroup').classList.add('hidden');
        document.getElementById('fullStyleGroup').classList.add('hidden');
        document.querySelectorAll('input[name="style"]').forEach(cb => cb.checked = false);
        document.querySelectorAll('input[name="fullStyle"]').forEach(cb => cb.checked = false);
        document.getElementById('customPattern').value = "";
      }
    }
    onSelectionChange();
  }

  // 設定造型類型 (局部 vs 十指)
  function setStyleType(type) {
    const partialCard = document.getElementById('typePartialCard');
    const fullCard = document.getElementById('typeFullCard');
    const radioPartial = document.getElementById('radioPartial');
    const radioFull = document.getElementById('radioFull');
    const partialGroup = document.getElementById('partialStyleGroup');
    const fullGroup = document.getElementById('fullStyleGroup');

    if (type === 'partial') {
      radioPartial.checked = true;
      radioFull.checked = false;
      partialCard.classList.add('active');
      fullCard.classList.remove('active');
      partialGroup.classList.remove('hidden');
      fullGroup.classList.add('hidden');
      document.querySelectorAll('input[name="fullStyle"]').forEach(cb => cb.checked = false);
    } else {
      radioFull.checked = true;
      radioPartial.checked = false;
      fullCard.classList.add('active');
      partialCard.classList.remove('active');
      fullGroup.classList.remove('hidden');
      partialGroup.classList.add('hidden');
      document.querySelectorAll('input[name="style"]').forEach(cb => cb.checked = false);
    }
    checkSubInputs();
    onSelectionChange();
  }

  // 隨機抽主要色系
  function drawMainColor() {
    const select = document.getElementById('mainColor');
    const randomIndex = Math.floor(Math.random() * ALL_COLORS.length);
    select.value = ALL_COLORS[randomIndex];
    select.classList.remove('flash-highlight');
    void select.offsetWidth;
    select.classList.add('flash-highlight');
    onMainColorChange();
  }

  // 隨機配色 (跳色)
  function drawSmartJumpColor(event) {
    if (event) event.stopPropagation();
    const mainVal = document.getElementById('mainColor').value;
    let availableColors = ALL_COLORS.filter(c => c !== mainVal);
    const select = document.getElementById('jumpColor');
    const randomIndex = Math.floor(Math.random() * availableColors.length);
    select.value = availableColors[randomIndex];
    select.classList.remove('flash-highlight');
    void select.offsetWidth;
    select.classList.add('flash-highlight');
    onSelectionChange();
  }

  // 隨機抽造型
  function drawStyle(event) {
    if (event) event.stopPropagation();
    const isFull = Math.random() < 0.5;
    setStyleType(isFull ? 'full' : 'partial');

    const checkboxes = document.querySelectorAll(isFull ? 'input[name="fullStyle"]' : 'input[name="style"]');
    checkboxes.forEach(cb => cb.checked = false);

    const count = isFull ? Math.floor(Math.random() * 2) + 1 : Math.floor(Math.random() * 3) + 1;
    const shuffled = Array.from(checkboxes).sort(() => 0.5 - Math.random());
    for (let i = 0; i < count; i++) {
      shuffled[i].checked = true;
    }
    checkSubInputs();
    onSelectionChange();
  }

  // 數量限制機制
  function checkLimit(element) {
    const checked = document.querySelectorAll('input[name="style"]:checked');
    if (checked.length > 3) {
      alert("局部造型最多只能選擇 3 項喔！");
      element.checked = false;
    }
    checkSubInputs();
    onSelectionChange();
  }

  function checkFullLimit(element) {
    const checked = document.querySelectorAll('input[name="fullStyle"]:checked');
    if (checked.length > 2) {
      alert("十指造型最多只能選擇 2 項喔！");
      element.checked = false;
    }
    checkSubInputs();
    onSelectionChange();
  }

  // 檢查子選項 (貓眼細節/指定圖案輸入框)
  function checkSubInputs() {
    const isPartial = document.getElementById('radioPartial').checked;
    const isFull = document.getElementById('radioFull').checked;

    let catEyeChecked = false;
    let customChecked = false;

    if (isPartial) {
      catEyeChecked = document.getElementById('catEyeCb').checked;
      customChecked = document.getElementById('customStyleCb').checked;
    } else if (isFull) {
      catEyeChecked = document.getElementById('fullCatEyeCb').checked;
      customChecked = document.getElementById('fullCustomStyleCb').checked;
    }

    document.getElementById('catEyeDetailDiv').classList.toggle('hidden', !catEyeChecked);
    document.getElementById('customInputDiv').classList.toggle('hidden', !customChecked);
  }

  // 計價與試算邏輯
  function onSelectionChange() {
    let total = 0;
    const mainColor = document.getElementById('mainColor').value;

    if (mainColor !== "") {
      total += 499; // 單色基礎價
    }

    if (showJumpColor && document.getElementById('jumpColor').value !== "") {
      total += 50;
    }

    if (showStyle) {
      const isPartial = document.getElementById('radioPartial').checked;
      const isFull = document.getElementById('radioFull').checked;

      if (isPartial) {
        const styleCount = document.querySelectorAll('input[name="style"]:checked').length;
        if (styleCount > 0) total += 150 + (styleCount - 1) * 50;
      } else if (isFull) {
        const fullStyleCount = document.querySelectorAll('input[name="fullStyle"]:checked').length;
        if (fullStyleCount > 0) total += 300 + (fullStyleCount - 1) * 100;
      }
    }

    if (needRemoval) {
      total += 200;
    }

    document.getElementById('totalPrice').innerText = total;
  }

  // 送出預約單
  function sendBooking() {
    const date = document.getElementById('bookingDate').value;
    const hour = document.getElementById('bookingHour').value;
    const minute = document.getElementById('bookingMinute').value;
    const mainColor = document.getElementById('mainColor').value;

    if (!date) { alert("請選擇預約日期！"); return; }
    if (!mainColor) { alert("請選擇單色款式色系！"); return; }

    const isPartial = document.getElementById('radioPartial').checked;
    const isFull = document.getElementById('radioFull').checked;

    if (showStyle && !isPartial && !isFull) {
      alert("您勾選了加購『款式造型』，請選擇【局部造型】或【十指造型】！");
      return;
    }

    let selectedStyles = [];
    if (showStyle) {
      if (isPartial) {
        document.querySelectorAll('input[name="style"]:checked').forEach(cb => {
          if (cb.value === '貓眼') {
            selectedStyles.push(`貓眼(${document.getElementById('catEyeType').value})`);
          } else {
            selectedStyles.push(cb.value);
          }
        });
      } else if (isFull) {
        document.querySelectorAll('input[name="fullStyle"]:checked').forEach(cb => {
          if (cb.value === '貓眼') {
            selectedStyles.push(`十指貓眼(${document.getElementById('catEyeType').value})`);
          } else {
            selectedStyles.push(`十指${cb.value}`);
          }
        });
      }

      if ((document.getElementById('customStyleCb').checked || document.getElementById('fullCustomStyleCb').checked)) {
        const customText = document.getElementById('customPattern').value.trim();
        if (!customText) {
          alert("請填寫指定圖案細節！");
          return;
        }
      }
    }

    const jumpColorVal = showJumpColor ? document.getElementById('jumpColor').value : '';
    const customPatternVal = document.getElementById('customPattern').value.trim();
    const toneVal = document.getElementById('selectedTone').value;
    const totalPriceVal = document.getElementById('totalPrice').innerText;

    // 準備傳送至 Google 試算表 (GAS)
    const payload = {
      userId: userProfile.userId || '',
      displayName: userProfile.displayName || '未知顧客',
      bookingDate: date,
      bookingTime: `${hour}:${minute}`,
      mainColor: mainColor,
      jumpColor: jumpColorVal,
      styleType: isPartial ? '局部造型' : (isFull ? '十指造型' : '無'),
      styles: selectedStyles.join(', '),
      customPattern: customPatternVal,
      tone: toneVal,
      needRemoval: needRemoval ? '需要' : '不需要',
      totalPrice: totalPriceVal
    };

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = "預約處理中...";
    submitBtn.disabled = true;

    // 背景存入 Google 試算表 (使用正確的 headers 語法)
    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
      console.log("GAS Response:", data);
      openLineChat(payload);
    })
    .catch(err => {
      console.error("GAS Error:", err);
      // 就算試算表網路延遲或 CORS 阻擋，依然協助開啟 LINE Message 讓流程完成
      openLineChat(payload);
    });
  }

  // 組合 LINE 官方帳號對話訊息並送出
  function openLineChat(data) {
    let msg = `🌸 【晞予美甲】線上預約單 🌸\n`;
    msg += `----------------------------\n`;
    msg += `👤 預約姓名：${data.displayName}\n`;
    msg += `📅 預約時間：${data.bookingDate} ${data.bookingTime}\n`;
    msg += `🎨 主色系：${data.mainColor}\n`;
    if (data.jumpColor) msg += `➕ 跳色：${data.jumpColor}\n`;
    if (data.styles) msg += `✨ 造型類型：${data.styleType} (${data.styles})\n`;
    if (data.customPattern) msg += `✏️ 指定圖案：${data.customPattern}\n`;
    msg += `🌗 色調風格：${data.tone}\n`;
    msg += `💅 卸甲服務：${data.needRemoval}\n`;
    msg += `----------------------------\n`;
    msg += `💰 預計總金額：NT$ ${data.totalPrice} 元\n\n`;
    msg += `請點擊發送將此預約訊息傳送給美甲師！`;

    // 開啟 LINE Message，自動帶入文字給用戶傳送
    if (liff.isInClient()) {
      liff.sendMessages([{
        type: 'text',
        text: msg
      }]).then(() => {
        liff.closeWindow();
      }).catch((err) => {
        console.error('Send message failed:', err);
        fallbackLineUrl(msg);
      });
    } else {
      fallbackLineUrl(msg);
    }
  }

  function fallbackLineUrl(msg) {
    const lineOaId = '@038xsnpl'; // 您的 LINE 官方帳號 ID
    const encodedMsg = encodeURIComponent(msg);
    window.location.href = `https://line.me/R/oaMessage/${lineOaId}/?${encodedMsg}`;
  }
</script>
</body>
