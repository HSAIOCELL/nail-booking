<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晞予美甲線上預約</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "NT$    $    NT$    $\n$    NT$    $    NT$\nNT$    $    NT$    $\n$NT$    $    NT$    $";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root { color-scheme: light; }

    input[type="checkbox"], input[type="radio"], input[type="date"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }

    .title-header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    /* 顧客資訊區塊：秒開顯示 */
    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #ebdcd3;
      margin-bottom: 22px;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #d4c7b8;
    }
    .user-name {
      font-weight: bold;
      font-size: 15.5px;
      color: #5c5049;
    }
    .user-status {
      font-size: 11.5px;
      color: #8c7c75;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
    }
    label { font-size: 15.5px; color: #524741; cursor: pointer; }

    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
    }

    .submit-btn { 
      width: 100%; 
      background-color: #7a6b63; 
      color: #ffffff; 
      border: none; 
      padding: 12px; 
      font-size: 17.5px; 
      font-weight: bold; 
      border-radius: 22px; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2); 
      margin-top: 15px;
    }
    .submit-btn:hover { background-color: #5c5049; }
  </style>
</head>
<body>

<div class="card">
  <div class="title-header">
    <h2>晞予美甲線上預約</h2>
  </div>

  <!-- 顧客身分顯示區 -->
  <div class="user-profile">
    <img id="avatar" class="user-avatar" src="https://via.placeholder.com/40" alt="頭像">
    <div>
      <div id="displayName" class="user-name">預約貴賓</div>
      <div class="user-status" id="loginStatusText">歡迎預約美甲服務</div>
    </div>
  </div>

  <!-- Step 1. 預約日期 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <input type="date" id="bookingDate">
  </div>

  <button class="submit-btn" onclick="submitBooking()">確認送出預約</button>
</div>

<script>
  // 1. 網頁一打開，畫面所有元件是直接解鎖且可互動的（絕不封鎖）
  
  // 2. 在背景非同步初始化 LIFF，抓取使用者身分
  document.addEventListener("DOMContentLoaded", function() {
    // 您的 LIFF ID 請填入這裡
    const myLiffId = "YOUR_LIFF_ID"; 

    if (typeof liff !== "undefined") {
      liff.init({ liffId: myLiffId })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              // 成功抓到 LINE 名字與頭像，立刻更新畫面
              document.getElementById("displayName").innerText = profile.displayName;
              document.getElementById("avatar").src = profile.pictureUrl;
              document.getElementById("loginStatusText").innerText = "已連動 LINE 帳號";
            }).catch(err => {
              console.log("取得個人資料失敗", err);
            });
          } else {
            // 如果沒登入，自動引導登入或維持訪客狀態，不影響填寫
            // liff.login(); // 依需求決定是否強制跳轉登入
          }
        })
        .catch(err => {
          console.log("LIFF 初始化失敗（可能在外部瀏覽器開啟）", err);
        });
    }
  });

  function submitBooking() {
    const name = document.getElementById("displayName").innerText;
    const date = document.getElementById("bookingDate").value;
    
    if(!date) {
      alert("請先選擇預約日期！");
      return;
    }
    
    alert(`感謝 ${name}！您的預約日期 ${date} 已送出！`);
  }
</script>

</body>
</html>
