<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上預約系統</title>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 奶茶色系主視覺主題 (Milk Tea Theme) */
    :root {
      --primary-color: #A38570;
      --secondary-color: #C8B3A2;
      --bg-color: #F8F5F2;
      --card-bg: #FFFFFF;
      --text-main: #4A3E3D;
      --text-muted: #8C7B70;
      --border-color: #E2D7CD;
      --accent-color: #8C6A56;
      --shadow: 0 4px 15px rgba(163, 133, 112, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 20px 15px 40px 15px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* 使用者個人資訊卡片 */
    .user-profile {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .user-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--secondary-color);
      border: 2px solid var(--primary-color);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .user-status {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 主要內容區塊 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background-color: #FAF8F5;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(163, 133, 112, 0.15);
    }

    /* 按鈕樣式 */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background-color: var(--primary-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 10px rgba(163, 133, 112, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
      background-color: var(--accent-color);
    }

    .btn:disabled {
      background-color: var(--secondary-color);
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* 彈窗/對話框 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(74, 62, 61, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .modal-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .modal-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* 載入動畫遮罩 */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(248, 245, 242, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 全頁載入中遮罩 -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div style="color: var(--primary-color); font-weight: 500;">初始化系統中...</div>
  </div>

  <div class="container">
    <!-- 使用者個人資訊 Header -->
    <div class="user-profile">
      <img id="user-avatar" class="user-avatar" src="https://via.placeholder.com/50" alt="大頭照">
      <div class="user-info">
        <span id="user-name" class="user-name">載入中...</span>
        <span class="user-status">LINE 帳號已驗證</span>
      </div>
    </div>

    <!-- 預約表單區塊 -->
    <div class="card">
      <div class="card-title">🗓️ 選擇預約內容</div>
      
      <form id="booking-form">
        <div class="form-group">
          <label for="booking-date">預約日期與時間</label>
          <input type="datetime-local" id="booking-date" required>
        </div>

        <div class="form-group">
          <label for="total-price">預計總金額 (NT$)</label>
          <input type="number" id="total-price" placeholder="請輸入金額" required min="0">
        </div>

        <button type="submit" id="submit-btn" class="btn">確認送出預約</button>
      </form>
    </div>
  </div>

  <!-- 預約成功彈窗 -->
  <div id="success-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-icon">✨</div>
      <div class="modal-title">預約已送出！</div>
      <div class="modal-text">我們已收到您的預約申請，將會盡快為您確認。</div>
      <button id="modal-close-btn" class="btn">返回 LINE 官方帳號</button>
    </div>
  </div>

  <script>
    // 專屬整合變數設定
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
    const LIFF_ID = "2011884932-heTsoGVG";
    const OFFICIAL_ACCOUNT_CHANNEL_ID = "2011296886";

    let profileData = {
      displayName: "",
      pictureUrl: ""
    };

    // 初始化 LIFF
    async function initLiff() {
      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 取得使用者 profile
        const profile = await liff.getProfile();
        profileData.displayName = profile.displayName || "未知顧客";
        profileData.pictureUrl = profile.pictureUrl || "";

        // 更新介面
        document.getElementById("user-name").textContent = profileData.displayName;
        if (profileData.pictureUrl) {
          document.getElementById("user-avatar").src = profileData.pictureUrl;
        }

        // 關閉載入中遮罩
        document.getElementById("loading").style.display = "none";
      } catch (err) {
        console.error("LIFF 初始化失敗", err);
        alert("LINE 身份驗證失敗，請重新載入頁面。");
      }
    }

    // 處理表單送出事件
    document.getElementById("booking-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const bookingTime = document.getElementById("booking-date").value;
      const totalPrice = document.getElementById("total-price").value;

      if (!bookingTime || !totalPrice) {
        alert("請完整填寫預約日期與預計金額！");
        return;
      }

      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "資料傳送中...";

      // 組裝 5 大欄位對應資料
      const payload = {
        displayName: profileData.displayName,
        bookingTime: bookingTime.replace("T", " "),
        totalPrice: totalPrice,
        pictureUrl: profileData.pictureUrl
      };

      try {
        const response = await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.result === "success") {
          // 顯示成功彈窗
          document.getElementById("success-modal").classList.add("active");
        } else {
          alert("預約失敗：" + (result.message || "請稍後重試"));
          submitBtn.disabled = false;
          submitBtn.textContent = "確認送出預約";
        }
      } catch (err) {
        console.error("傳送至 GAS 失敗", err);
        alert("網路傳送錯誤，請重新試試！");
        submitBtn.disabled = false;
        submitBtn.textContent = "確認送出預約";
      }
    });

    // 彈窗關閉按鈕：自動跳轉回 LINE 官方帳號
    document.getElementById("modal-close-btn").addEventListener("click", function () {
      if (liff.isInClient()) {
        liff.closeWindow();
      } else {
        window.location.href = `https://line.me/R/ti/p/${OFFICIAL_ACCOUNT_CHANNEL_ID}`;
      }
    });

    // 頁面載入後自動執行 LIFF 初始化
    window.onload = initLiff;
  </script>
</body>
</html>
