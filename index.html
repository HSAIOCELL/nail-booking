<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>晞予美甲線上預約</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "NT$    $    NT$    $\n$    NT$    $    NT$\nNT$    $    NT$    $\n$NT$    $    NT$    $";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root { color-scheme: light; }

    input[type="checkbox"], input[type="radio"], input[type="date"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: opacity(0.6) sepia(100%) hue-rotate(330deg);
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }

    .title-header {
      text-align: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #ebdcd3;
      margin-bottom: 22px;
    }
    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #d4c7b8;
    }
    .user-name {
      font-weight: bold;
      font-size: 15.5px;
      color: #5c5049;
    }
    .user-status {
      font-size: 11.5px;
      color: #8c7c75;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
    }

    .datetime-container { display: flex; flex-direction: column; gap: 10px; }
    .time-picker-group { display: flex; gap: 8px; align-items: center; }
    .time-picker-group select { flex: 1; text-align: center; }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .selectable-box {
      border: 1px solid #cfc5bb;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      font-size: 15px;
    }
    .selectable-box.selected {
      border-color: #7a6b63;
      background-color: #f3eee6;
      font-weight: bold;
      color: #5c5049;
    }

    .tone-group {
      display: flex;
      gap: 12px;
      justify-content: space-between;
    }
    .tone-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14.5px;
      cursor: pointer;
    }

    .total-box { 
      background-color: #ebdcd3; 
      color: #4e423b; 
      padding: 14px; 
      border-radius: 12px; 
      text-align: center; 
      font-size: 19px; 
      font-weight: bold; 
      margin-top: 15px; 
      margin-bottom: 18px; 
      letter-spacing: 0.5px; 
    }
    
    .submit-btn { 
      width: 100%; 
      background-color: #7a6b63; 
      color: #ffffff; 
      border: none; 
      padding: 12px; 
      font-size: 17.5px; 
      font-weight: bold; 
      border-radius: 22px; 
      cursor: pointer; 
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2); 
      letter-spacing: 1px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background-color: #5c5049; }
    .submit-btn:disabled { background-color: #aaa; cursor: not-allowed; }

    .random-btn {
      font-size: 12.5px;
      background: #ebdcd3;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      color: #5c5049;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title-header">
    <h2>晞予美甲線上預約</h2>
  </div>

  <!-- 顧客身分顯示區 -->
  <div class="user-profile">
    <img id="avatar" class="user-avatar" src="https://via.placeholder.com/40" alt="頭像">
    <div>
      <div id="displayName" class="user-name">預約貴賓</div>
      <div class="user-status" id="loginStatusText">LINE 帳號連動中...</div>
    </div>
  </div>

  <!-- Step 1. 預約日期與時間 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="date" id="bookingDate">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour">
            <option value="10">10 時</option><option value="11">11 時</option><option value="12">12 時</option>
            <option value="13">13 時</option><option value="14">14 時</option><option value="15">15 時</option>
            <option value="16">16 時</option><option value="17">17 時</option><option value="18">18 時</option>
            <option value="19">19 時</option><option value="20">20 時</option>
          </select>
          <select id="bookingMinute">
            <option value="00">00 分</option>
            <option value="30">30 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2. 單色款式 -->
  <div class="section">
    <div class="section-title">
      Step 2. 單色款式
      <button class="random-btn" onclick="randomColorStyle()">✨ 幫我抽色系</button>
    </div>
    <select id="colorStyle" onchange="calculateTotal()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="經典裸色系">經典裸色系 (NT$ 800)</option>
      <option value="質感莫蘭迪">質感莫蘭迪 (NT$ 900)</option>
      <option value="氣質小香風">氣質小香風 (NT$ 1000)</option>
    </select>
  </div>

  <!-- Step 3. 加購項目 -->
  <div class="section">
    <div class="section-title">Step 3. 加購項目</div>
    <div class="option-grid">
      <div class="selectable-box" id="addonJump" onclick="toggleAddon('Jump', 50)">
        <span>跳色</span>
        <span style="font-size: 13px; color: #8c7c75;">50 元 +</span>
      </div>
      <div class="selectable-box" id="addonArt" onclick="toggleAddon('Art', 50)">
        <span>款式造型</span>
        <span style="font-size: 13px; color: #8c7c75;">50元起 +</span>
      </div>
    </div>
  </div>

  <!-- Step 4. 色調 -->
  <div class="section">
    <div class="section-title">Step 4. 色調</div>
    <div class="tone-group">
      <label class="tone-item"><input type="radio" name="tone" value="隨機" checked> 隨機</label>
      <label class="tone-item"><input type="radio" name="tone" value="個性暗色調"> 個性暗色調</label>
      <label class="tone-item"><input type="radio" name="tone" value="清透亮色調"> 清透亮色調</label>
    </div>
  </div>

  <!-- Step 5. 卸甲服務 -->
  <div class="section">
    <div class="section-title">Step 5. 卸甲服務</div>
    <div class="option-grid">
      <div class="selectable-box selected" id="removalNo" onclick="selectRemoval(0)">
        <span>不需要卸甲</span>
        <span>NT$ 0</span>
      </div>
      <div class="selectable-box" id="removalYes" onclick="selectRemoval(300)">
        <span>需要卸甲</span>
        <span>+NT$ 300</span>
      </div>
    </div>
  </div>

  <!-- 金額顯示 -->
  <div class="total-box">
    預計總金額：NT$ <span id="totalPriceText">800</span> 元
  </div>

  <button id="submitBtn" class="submit-btn" onclick="submitBooking()">送出預約單 (開啟 LINE)</button>
</div>

<script>
  // 請填入您的 Google Apps Script 部署網址與 LIFF ID
  const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";
  const MY_LIFF_ID = "YOUR_LIFF_ID_HERE";
  const LINE_OFFICIAL_ACCOUNT_ID = "@344gjuzg"; 

  let selectedAddons = {
    Jump: false,
    Art: false
  };
  let removalPrice = 0;

  document.addEventListener("DOMContentLoaded", function() {
    calculateTotal();
    if (typeof liff !== "undefined") {
      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              document.getElementById("displayName").innerText = profile.displayName;
              document.getElementById("avatar").src = profile.pictureUrl;
              document.getElementById("loginStatusText").innerText = "已成功連動 LINE";
            }).catch(err => console.log("取得個人資料失敗", err));
          }
        })
        .catch(err => console.log("LIFF 初始化失敗", err));
    }
  });

  function toggleAddon(type, price) {
    selectedAddons[type] = !selectedAddons[type];
    const el = document.getElementById(type === 'Jump' ? 'addonJump' : 'addonArt');
    if (selectedAddons[type]) {
      el.classList.add('selected');
    } else {
      el.classList.remove('selected');
    }
    calculateTotal();
  }

  function selectRemoval(price) {
    removalPrice = price;
    if (price === 0) {
      document.getElementById('removalNo').classList.add('selected');
      document.getElementById('removalYes').classList.remove('selected');
    } else {
      document.getElementById('removalYes').classList.add('selected');
      document.getElementById('removalNo').classList.remove('selected');
    }
    calculateTotal();
  }

  function randomColorStyle() {
    const select = document.getElementById("colorStyle");
    const options = select.options;
    const randomIndex = Math.floor(Math.random() * (options.length - 1)) + 1;
    select.selectedIndex = randomIndex;
    calculateTotal();
  }

  function calculateTotal() {
    let basePrice = 800; // 預設底價
    const styleVal = document.getElementById("colorStyle").value;
    if (styleVal.includes("莫蘭迪")) basePrice = 900;
    if (styleVal.includes("小香風")) basePrice = 1000;

    let addonTotal = 0;
    if (selectedAddons.Jump) addonTotal += 50;
    if (selectedAddons.Art) addonTotal += 50;

    const total = basePrice + addonTotal + removalPrice;
    document.getElementById("totalPriceText").innerText = total;
  }

  function submitBooking() {
    const name = document.getElementById("displayName").innerText;
    const date = document.getElementById("bookingDate").value;
    const hour = document.getElementById("bookingHour").value;
    const minute = document.getElementById("bookingMinute").value;
    const time = `${hour}:${minute}`;
    const styleVal = document.getElementById("colorStyle").value || "未選擇";
    const toneVal = document.querySelector('input[name="tone"]:checked').value;
    const totalPrice = parseInt(document.getElementById("totalPriceText").innerText);
    const removalStr = removalPrice > 0 ? "需要卸甲 (+300元)" : "不需要卸甲";

    if (!date) {
      alert("請先選擇預約日期！");
      return;
    }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "預約送出中...";

    // 1. Google 試算表 Payload
    const payload = {
      displayName: name,
      bookingDate: date,
      bookingTime: time,
      colorStyle: styleVal,
      totalPrice: totalPrice,
      status: "已預約"
    };

    // 2. 同步寫入 Google 試算表
    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(error => console.error("GAS Error:", error));

    // 3. 組合 LINE 訊息並導向 LINE 官方帳號
    let detailsText = `【晞予美甲線上預約】\n`;
    detailsText += `👤 預約貴賓：${name}\n`;
    detailsText += `📅 預約時間：${date} ${time}\n`;
    detailsText += `🎨 主色系/款式：${styleVal}\n`;
    detailsText += `✨ 色調風格：${toneVal}\n`;
    detailsText += `🎨 加購跳色：${selectedAddons.Jump ? '有 (+50元)' : '無'}\n`;
    detailsText += `✨ 加購造型：${selectedAddons.Art ? '有 (+50元)' : '無'}\n`;
    detailsText += `💅 卸甲服務：${removalStr}\n`;
    detailsText += `💰 預計總金額：NT$ ${totalPrice} 元`;

    const encodedMessage = encodeURIComponent(detailsText);
    const lineUrl = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?${encodedMessage}`;

    setTimeout(() => {
      alert("預約資料已送出！即將為您開啟 LINE 傳送預約單。");
      window.location.href = lineUrl;
    }, 500);
  }
</script>

</body>
</html>
