<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>

  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    #frontendReminder {
      display: none;
      background: #fffae6;
      border: 1px solid #ffe58f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      color: #d48806;
      font-size: 14px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-size: 15.5px;
      color: #524741;
      cursor: pointer;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
      appearance: none;
      -webkit-appearance: none;
    }

    .flatpickr-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff !important;
      color: #4a423d;
      cursor: pointer;
    }

    .flatpickr-calendar {
      background: #faf8f5 !important;
      border: 1px solid #e2dad1 !important;
      box-shadow: 0 10px 25px rgba(120, 108, 100, 0.15) !important;
      border-radius: 14px !important;
    }

    /* 可預約日標籤：白班=黃色 / 夜班=莫蘭迪藍灰色 */
    .flatpickr-day.available-day-yellow {
      background-color: #fdf6e2 !important;
      color: #a37512 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #f2d896 !important;
    }
    .flatpickr-day.available-day-blue {
      background-color: #e5ece9 !important;
      color: #4c6b61 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #b8c9c4 !important;
    }
    .flatpickr-day.available-day-yellow.selected, .flatpickr-day.available-day-blue.selected {
      background-color: #7a6b63 !important;
      color: #ffffff !important;
      border-color: #5c5049 !important;
    }

    .flatpickr-day.flatpickr-disabled, .flatpickr-day.flatpickr-disabled:hover {
      color: #d1c7bd !important;
      background: transparent !important;
      text-decoration: line-through;
      opacity: 0.4;
    }

    .datetime-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-picker-group select {
      flex: 1;
      text-align: center;
    }

    /* 色調 */
    .tone-palette-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 6px 4px;
    }
    .tone-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 20px;
      transition: all 0.25s ease;
      user-select: none;
      white-space: nowrap;
    }
    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #e8e0d5; 
      border: 1.5px solid #d4c7b8;
    }
    .tone-option.active .color-dot {
      background-color: #7a6b63;
      border-color: #5c5049;
      transform: scale(1.15);
    }
    .tone-option.active .tone-label {
      color: #3d3028;
      font-weight: 700;
    }

    /* 加購卡片 */
    .addon-item-box {
      border: 1.5px dashed #c2b5aa;
      background-color: #fcfaf7;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .addon-item-box.active {
      border-style: solid;
      border-color: #7a6b63;
      background-color: #f2ebe4;
    }
    .addon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: #5c5049;
    }
    .addon-badge {
      font-size: 13px;
      background-color: #e5ded7;
      color: #6e6057;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .addon-item-box.active .addon-badge {
      background-color: #7a6b63;
      color: #ffffff;
    }

    .removal-card-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .removal-card {
      flex: 1;
      border: 1.5px dashed #c2b5aa;
      background-color: #fcfaf7;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .removal-card.active {
      border-style: solid;
      border-color: #7a6b63;
      background-color: #f2ebe4;
    }
    .removal-card-title {
      font-size: 15.5px;
      font-weight: bold;
      color: #4e423b;
      margin: 0;
    }

    .draw-btn {
      background-color: #e4dcd3;
      color: #4a423d;
      border: 1px solid #c9bebc;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden { display: none !important; }

    .total-box {
      background-color: #ebdcd3;
      color: #4e423b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 18px;
    }
    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2);
    }
    .submit-btn:hover { background-color: #5c5049; }
  </style>
</head>
<body>

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <div id="frontendReminder">
    ⚠️ 提醒：目前正值 15 號至 20 號期間，請留意下兩個月的最新班表與預約動態！
  </div>

  <!-- 預約暱稱 -->
  <div class="section">
    <div class="section-title">預約暱稱</div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="customerName" placeholder="請輸入您的預約暱稱" style="flex: 1;">
      <button type="button" class="draw-btn" onclick="loginWithLine()" style="white-space: nowrap; background: #06c755; color: #fff; border: none;">連動 LINE 暱稱</button>
    </div>
  </div>

  <!-- Step 1: 日期與時間 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="text" id="bookingDate" placeholder="請選擇預約日期">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour" onchange="validateTime()">
            <option value="10">10 時</option><option value="12">12 時</option>
            <option value="14">14 時</option><option value="16">16 時</option>
            <option value="18">18 時</option><option value="20">20 時</option>
          </select>
          <select id="bookingMinute" onchange="validateTime()">
            <option value="00">00 分</option>
            <option value="30">30 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2: 單色款式 -->
  <div class="section">
    <div class="section-title">
      Step 2. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🫯 幫我抽色系</button>
    </div>
    <select id="mainColor" onchange="onSelectionChange()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="紅色">紅色</option><option value="粉色">粉色</option><option value="橘色">橘色</option>
      <option value="黃色">黃色</option><option value="紅咖色">紅咖色</option><option value="深咖/可可色">深咖/可可色</option>
      <option value="淺咖色">淺咖色</option><option value="綠色">綠色</option><option value="藍色">藍色</option>
      <option value="紫色">紫色</option><option value="黑色">黑色</option><option value="銀色/白色">銀色/白色</option>
      <option value="灰色">灰色</option><option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- Step 3: 加購項目 -->
  <div class="section">
    <div style="font-weight: bold; color: #5c5049; margin-bottom: 12px; font-size: 16.5px;">Step 3. 加購項目</div>

    <!-- 跳色 -->
    <div id="boxJumpColor" class="addon-item-box" onclick="toggleOption('jumpColorSection', event)">
      <div class="addon-header">
        <span>🎨 跳色</span>
        <span id="badgeJumpColor" class="addon-badge">50 元 ➕</span>
      </div>
      <div id="jumpColorSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <select id="jumpColor" onchange="onSelectionChange()">
          <option value="">--請選擇跳色色系--</option>
          <option value="紅色">紅色</option><option value="粉色">粉色</option><option value="橘色">橘色</option>
          <option value="黃色">黃色</option><option value="紅咖色">紅咖色</option><option value="深咖/可可色">深咖/可可色</option>
          <option value="淺咖色">淺咖色</option><option value="綠色">綠色</option><option value="藍色">藍色</option>
          <option value="紫色">紫色</option><option value="黑色">黑色</option><option value="銀色/白色">銀色/白色</option>
          <option value="灰色">灰色</option><option value="金色/香檳色">金色/香檳色</option>
        </select>
      </div>
    </div>

    <!-- 款式造型 -->
    <div id="boxStyle" class="addon-item-box" onclick="toggleOption('styleSection', event)">
      <div class="addon-header">
        <span>✨ 款式造型</span>
        <span id="badgeStyle" class="addon-badge">50元起 ➕</span>
      </div>
      <div id="styleSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div class="removal-card-group" style="gap: 8px;">
          <div id="typePartialCard" class="removal-card" onclick="setStyleType('partial')"><div class="removal-card-title" style="font-size: 14.5px;">局部造型 (+50)</div></div>
          <div id="typeFullCard" class="removal-card" onclick="setStyleType('full')"><div class="removal-card-title" style="font-size: 14.5px;">十指造型 (+100)</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 4: 色調 -->
  <div class="section">
    <div class="section-title">Step 4. 色調</div>
    <div class="tone-palette-group">
      <div class="tone-option active" onclick="selectToneDot(this, '隨機')"><span class="color-dot"></span><span class="tone-label">隨機</span></div>
      <div class="tone-option" onclick="selectToneDot(this, '個性暗色調')"><span class="color-dot"></span><span class="tone-label">個性暗色調</span></div>
      <div class="tone-option" onclick="selectToneDot(this, '清透亮色調')"><span class="color-dot"></span><span class="tone-label">清透亮色調</span></div>
    </div>
    <input type="hidden" id="selectedTone" value="隨機">
  </div>

  <!-- Step 5: 卸甲服務 -->
  <div class="section">
    <div class="section-title">Step 5. 卸甲服務</div>
    <div class="removal-card-group">
      <div id="removalYesCard" class="removal-card" onclick="setRemoval(true)"><div class="removal-card-title">需要卸甲 (+150)</div></div>
      <div id="removalNoCard" class="removal-card active" onclick="setRemoval(false)"><div class="removal-card-title">不需要</div></div>
    </div>
  </div>

  <!-- 總金額 -->
  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">0</span> 元
  </div>

  <button class="submit-btn" onclick="sendBooking()">送出預約單 (開啟 LINE)</button>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LINE_OFFICIAL_ACCOUNT_ID = "@344gjuzg"; 
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";

  let backendShiftGroup = "B";
  let backendShiftType = "夜班"; 
  let backendSchedules = {};

  let showJumpColor = false, showStyle = false, needRemoval = false;
  let selectedStyleType = "";

  document.addEventListener('DOMContentLoaded', () => {
    checkFrontendReminder();
    initLiffLogin();
    fetchBackendConfigAndInit();
  });

  function checkFrontendReminder() {
    const todayDay = new Date().getDate();
    if (todayDay >= 15 && todayDay <= 20) {
      document.getElementById('frontendReminder').style.display = "block";
    }
  }

  async function fetchBackendConfigAndInit() {
    try {
      const res = await fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if (data.shiftGroup) backendShiftGroup = data.shiftGroup;
      if (data.shiftType) backendShiftType = data.shiftType;
      if (data.schedules) backendSchedules = data.schedules;
    } catch (e) {
      console.error("無法取得後端排班設定", e);
    }
    initFlatpickr();
  }

  function getShiftCycleInfo(dateObj) {
    const anchorDate = new Date("2026-10-23T00:00:00");
    const targetDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
    const diffDays = Math.round((targetDate - anchorDate) / (1000 * 60 * 60 * 24));
    let cycleDay = ((diffDays % 4) + 4) % 4;
    
    if (backendShiftGroup === "A") {
      cycleDay = (cycleDay + 2) % 4;
    }
    
    return {
      isWorkDay: (cycleDay === 0 || cycleDay === 1)
    };
  }

  function formatDateToYYYYMMDD(dateObj) {
    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
  }

  function initFlatpickr() {
    const taipeiNow = new Date();
    const maxDate = new Date(taipeiNow.getFullYear(), taipeiNow.getMonth() + 2, 0);

    const availableClassName = (backendShiftType === "日班") ? "available-day-yellow" : "available-day-blue";

    flatpickr("#bookingDate", {
      locale: "zh",
      dateFormat: "Y-m-d",
      minDate: taipeiNow,
      maxDate: maxDate,
      disable: [
        function(date) {
          const dateStr = formatDateToYYYYMMDD(date);
          if (backendSchedules[dateStr]) {
            const status = backendSchedules[dateStr].status;
            if (status === "開放") return false;
            if (status === "關閉") return true;
          }
          const shiftInfo = getShiftCycleInfo(date);
          return shiftInfo.isWorkDay;
        }
      ],
      onDayCreate: function(dObj, dStr, fp, dayElement) {
        const dateStr = formatDateToYYYYMMDD(dayElement.dateObj);
        let isAvailable = false;

        if (backendSchedules[dateStr]) {
          if (backendSchedules[dateStr].status === "開放") isAvailable = true;
        } else {
          const shiftInfo = getShiftCycleInfo(dayElement.dateObj);
          if (!shiftInfo.isWorkDay) isAvailable = true;
        }

        if (isAvailable && dayElement.dateObj >= taipeiNow) {
          dayElement.classList.add(availableClassName);
        }
      },
      onChange: function() { validateTime(); }
    });
    validateTime();
  }

  function validateTime() {
    const dateInputVal = document.getElementById("bookingDate").value;
    const hourSelect = document.getElementById("bookingHour");
    if (!dateInputVal) return;

    const scheduleInfo = backendSchedules[dateInputVal];
    let allowedHours = null;
    if (scheduleInfo && scheduleInfo.slots) {
      allowedHours = scheduleInfo.slots.split(',').map(s => s.trim().split(':')[0]);
    }

    Array.from(hourSelect.options).forEach(opt => {
      opt.disabled = allowedHours ? !allowedHours.includes(opt.value) : false;
    });
  }

  async function initLiffLogin() {
    const nameInput = document.getElementById('customerName');
    if (typeof liff === 'undefined') return;
    try {
      await liff.init({ liffId: "2011884932-heTsoGVG" });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        nameInput.value = profile.displayName;
        nameInput.readOnly = true;
        nameInput.style.background = "#f5f2ed";
      }
    } catch (err) { console.log(err); }
  }

  function loginWithLine() {
    if (typeof liff !== 'undefined') {
      if (!liff.isLoggedIn()) {
        liff.login();
      }
    }
  }

  function selectToneDot(element, value) {
    document.querySelectorAll('.tone-option').forEach(opt => opt.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('selectedTone').value = value;
  }

  function setRemoval(status) {
    needRemoval = status;
    document.getElementById('removalYesCard').classList.toggle('active', needRemoval);
    document.getElementById('removalNoCard').classList.toggle('active', !needRemoval);
    onSelectionChange();
  }

  function toggleOption(id, event) {
    if (event) event.stopPropagation();
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') { 
      showJumpColor = !showJumpColor; 
      el.classList.toggle('hidden', !showJumpColor); 
      document.getElementById('boxJumpColor').classList.toggle('active', showJumpColor);
    } else if (id === 'styleSection') { 
      showStyle = !showStyle; 
      el.classList.toggle('hidden', !showStyle); 
      document.getElementById('boxStyle').classList.toggle('active', showStyle);
    }
    onSelectionChange();
  }

  function setStyleType(type) {
    if (event) event.stopPropagation();
    selectedStyleType = (selectedStyleType === type) ? "" : type;
    document.getElementById('typePartialCard').classList.toggle('active', selectedStyleType === 'partial');
    document.getElementById('typeFullCard').classList.toggle('active', selectedStyleType === 'full');
    onSelectionChange();
  }

  function drawMainColor() {
    const select = document.getElementById('mainColor');
    select.selectedIndex = Math.floor(Math.random() * (select.options.length - 1)) + 1;
    onSelectionChange();
  }

  function onSelectionChange() {
    let total = 0;
    const mainColor = document.getElementById('mainColor').value;
    
    if (mainColor !== "") total += 700;
    if (showJumpColor && document.getElementById('jumpColor').value !== "") total += 50;
    if (showStyle && selectedStyleType === 'partial') total += 50;
    if (showStyle && selectedStyleType === 'full') total += 100;
    if (needRemoval) total += 150;

    document.getElementById('totalPrice').innerText = total;
  }

  function sendBooking() {
    const customerName = document.getElementById('customerName').value.trim();
    const bookingDate = document.getElementById('bookingDate').value;
    if (!customerName || !bookingDate) return alert("請填寫您的預約暱稱並選擇預約日期！");

    const bookingTime = `${document.getElementById('bookingHour').value}:${document.getElementById('bookingMinute').value}`;
    const totalPrice = document.getElementById('totalPrice').innerText;
    const toneVal = document.getElementById('selectedTone').value;
    const mainColorVal = document.getElementById('mainColor').value;
    const jumpColorVal = document.getElementById('jumpColor').value;
    
    let itemsArr = [];
    if (needRemoval) itemsArr.push("需要卸甲");
    if (mainColorVal) itemsArr.push(`單色款式: ${mainColorVal}`);
    if (showJumpColor && jumpColorVal) itemsArr.push(`跳色: ${jumpColorVal}`);
    if (showStyle && selectedStyleType) itemsArr.push(`款式造型: ${selectedStyleType === 'partial' ? '局部造型' : '十指造型'}`);
    if (toneVal) itemsArr.push(`色調: ${toneVal}`);

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({
        customerName: customerName,
        date: bookingDate,
        time: bookingTime,
        items: itemsArr.join(' / '),
        totalPrice: parseInt(totalPrice, 10),
        cost: 0
      })
    }).then(() => {
      let details = `【美甲服務預約單】\n• 預約暱稱：${customerName}\n• 預約時間：${bookingDate} ${bookingTime}\n• 項目細節：${itemsArr.join(' / ')}\n• 預計總金額：NT$ ${totalPrice} 元`;
      window.location.href = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?${encodeURIComponent(details)}`;
    });
  }
</script>
