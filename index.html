<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <style>
    /* 防選取與防複製保護 */
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    /* ✨ 隱藏金錢靈氣背景裝飾 (NT$ & $) */
    body::before {
      content: "NT$   $   NT$   $\n$   NT$   $   NT$\nNT$   $   NT$   $\n$   NT$   $   NT$";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root {
      color-scheme: light;
    }

    input[type="checkbox"], 
    input[type="radio"],
    input[type="date"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    input[type="checkbox"], 
    input[type="radio"] {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: opacity(0.6) sepia(100%) hue-rotate(330deg);
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }
    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .radio-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    label {
      font-size: 15.5px;
      color: #524741;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #fefdfc;
      color: #4a423d;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus, input[type="date"]:focus {
      border-color: #7a6b63;
      box-shadow: 0 0 4px rgba(122, 107, 99, 0.25);
    }
    
    .datetime-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-picker-group select {
      flex: 1;
      text-align: center;
    }

    .add-btn {
      background-color: #96887f;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 13.5px;
      cursor: pointer;
      transition: 0.2s;
      margin-left: 4px;
    }
    .add-btn:hover {
      background-color: #7a6b63;
    }
    .draw-btn {
      background-color: #e4dcd3;
      color: #4a423d;
      border: 1px solid #c9bebc;
      padding: 3px 8px;
      border-radius: 12.5px;
      font-size: 12.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .draw-btn:hover {
      background-color: #d7ccc3;
    }
    .hidden {
      display: none;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 8px;
    }
    
    .total-box {
      background-color: #ebdcd3;
      color: #4e423b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2);
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .submit-btn:hover {
      background-color: #5c5049;
    }
    .submit-btn:disabled {
      background-color: #c5beba;
      cursor: not-allowed;
    }
    .sub-input {
      margin-top: 8px;
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <div class="section">
    <div class="section-title">1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="date" id="bookingDate">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour">
            <option value="00">00 時</option><option value="01">01 時</option><option value="02">02 時</option>
            <option value="03">03 時</option><option value="04">04 時</option><option value="05">05 時</option>
            <option value="06">06 時</option><option value="07">07 時</option><option value="08">08 時</option>
            <option value="09">09 時</option><option value="10">10 時</option><option value="11">11 時</option>
            <option value="12">12 時</option><option value="13">13 時</option><option value="14" selected>14 時</option>
            <option value="15">15 時</option><option value="16">16 時</option><option value="17">17 時</option>
            <option value="18">18 時</option><option value="19">19 時</option><option value="20">20 時</option>
            <option value="21">21 時</option><option value="22">22 時</option><option value="23">23 時</option>
          </select>
          <select id="bookingMinute">
            <option value="00" selected>00 分</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="45">45 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">2. 卸甲服務</div>
    <div class="radio-group">
      <label><input type="radio" name="off" value="yes" onchange="onSelectionChange()"> 我要卸甲</label>
      <label><input type="radio" name="off" value="no" checked onchange="onSelectionChange()"> 不需要卸甲</label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      3. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🎲 幫我抽色系</button>
    </div>
    <select id="mainColor" onchange="onSelectionChange()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="紅色">紅色</option>
      <option value="粉色">粉色</option>
      <option value="橘色">橘色</option>
      <option value="黃色">黃色</option>
      <option value="深咖/可可色">深咖/可可色</option>
      <option value="淺咖色">淺咖色</option>
      <option value="綠色">綠色</option>
      <option value="藍色">藍色</option>
      <option value="紫色">紫色</option>
      <option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option>
      <option value="灰色">灰色</option>
      <option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <div class="section" id="toneSection">
    <div class="section-title">4. 色調選擇</div>
    <div class="radio-group">
      <label><input type="radio" name="tone" value="深色感" checked> 深色感</label>
      <label><input type="radio" name="tone" value="淺色感"> 淺色感</label>
      <label><input type="radio" name="tone" value="隨機發揮"> 隨機發揮</label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">
      5. 加購項目
      <div>
        <button class="add-btn" onclick="toggleOption('jumpColorSection')">+ 跳色</button>
        <button class="add-btn" onclick="toggleOption('styleSection')">+ 款式造型</button>
      </div>
    </div>

    <div id="jumpColorSection" class="hidden" style="margin-top: 10px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
      <div style="font-size: 13.5px; font-weight: bold; margin-bottom: 5px; color: #5c5049;">跳色選擇：</div>
      <select id="jumpColor" onchange="onSelectionChange()">
        <option value="交給琦選!">交給琦選!</option>
        <option value="紅色">紅色</option>
        <option value="粉色">粉色</option>
        <option value="橘色">橘色</option>
        <option value="黃色">黃色</option>
        <option value="深咖/可可色">深咖/可可色</option>
        <option value="淺咖色">淺咖色</option>
        <option value="綠色">綠色</option>
        <option value="藍色">藍色</option>
        <option value="紫色">紫色</option>
        <option value="黑色">黑色</option>
        <option value="銀色/白色">銀色/白色</option>
        <option value="灰色">灰色</option>
        <option value="金色/香檳色">金色/香檳色</option>
      </select>
    </div>

    <div id="styleSection" class="hidden" style="margin-top: 10px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
        <div style="font-size: 13.5px; font-weight: bold; color: #5c5049;">款式類型 (最多選4個)：</div>
        <button class="draw-btn" onclick="drawStyle()">🎲 幫我抽款式</button>
      </div>
      <div style="font-size: 11.5px; color: #8c7c75; margin-bottom: 8px;">(選1個 +150元 / 選2個以上 +200元)</div>
      
      <div class="checkbox-grid">
        <label><input type="checkbox" name="style" id="catEyeCb" value="貓眼" onchange="checkLimit(this)"> 貓眼</label>
        <label><input type="checkbox" name="style" value="暈染" onchange="checkLimit(this)"> 暈染</label>
        <label><input type="checkbox" name="style" value="立體不規則造型" onchange="checkLimit(this)"> 立體不規則造型</label>
        <label><input type="checkbox" name="style" value="法式" onchange="checkLimit(this)"> 法式</label>
        <label><input type="checkbox" name="style" value="漸層" onchange="checkLimit(this)"> 漸層</label>
        <label><input type="checkbox" name="style" value="海莉款" onchange="checkLimit(this)"> 海莉款</label>
        <label><input type="checkbox" name="style" value="(全/造型)鏡面銀" onchange="checkLimit(this)"> (全/造型)鏡面銀</label>
        <label><input type="checkbox" name="style" value="小飾品/貼紙" onchange="checkLimit(this)"> 小飾品/貼紙</label>
        <label><input type="checkbox" name="style" value="格紋" onchange="checkLimit(this)"> 格紋</label>
        <label><input type="checkbox" name="style" id="customStyleCb" value="指定圖案" onchange="checkLimit(this)"> 指定圖案</label>
      </div>

      <div id="catEyeDetailDiv" class="sub-input hidden">
        <label style="font-size: 13px; font-weight: bold; color: #5c5049;">貓眼類型：</label>
        <select id="catEyeType" disabled style="background-color: #e5ded7; font-weight: bold;">
          <option value="指定單色貓眼">指定單色貓眼</option>
          <option value="雙色貓眼">雙色貓眼</option>
        </select>
      </div>

      <div id="customInputDiv" class="sub-input hidden">
        <input type="text" id="customPattern" placeholder="請填寫指定圖案細節">
      </div>
    </div>
  </div>

  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">0</span> 元
  </div>

  <button class="submit-btn" id="submitBtn" onclick="sendBooking()">送出預約通知</button>
</div>

<script>
  // 🔗 您的專屬 Google Apps Script 後端網址 (無任何 API Key，安全防洩漏)
  const GOOGLE_BACKEND_URL = "https://script.google.com/macros/s/AKfycbxNOZA_Yx-cccHFGbvkBZanb1A8FkUgFnMTtxlMIJ5yjA9TDL70r00UO-Ld9Bbtg2cM/exec";

  // 防同行偷看/側錄防護牆
  document.addEventListener('keydown', function(e) {
    if (
      e.keyCode === 123 || 
      (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 67)) ||
      (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74))
    ) {
      e.preventDefault();
      return false;
    }
  });

  let showJumpColor = false, showStyle = false;
  document.getElementById('bookingDate').valueAsDate = new Date();

  function toggleOption(id) {
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') { showJumpColor = !showJumpColor; el.classList.toggle('hidden', !showJumpColor); }
    else if (id === 'styleSection') { showStyle = !showStyle; el.classList.toggle('hidden', !showStyle); }
    onSelectionChange();
  }

  function onSelectionChange() {
    autoDetermineCatEye();
    calculateTotal();
  }

  function autoDetermineCatEye() {
    const catEyeCb = document.getElementById('catEyeCb');
    const catEyeDetailDiv = document.getElementById('catEyeDetailDiv');
    const catEyeSelect = document.getElementById('catEyeType');
    if (!catEyeCb || !catEyeCb.checked || !showStyle) {
      catEyeDetailDiv.classList.add('hidden');
      return;
    }
    catEyeDetailDiv.classList.remove('hidden');
    catEyeSelect.value = showJumpColor ? "雙色貓眼" : "指定單色貓眼";
  }

  function drawMainColor() {
    const select = document.getElementById('mainColor');
    const options = select.options;
    const randomIndex = Math.floor(Math.random() * (options.length - 1)) + 1;
    select.selectedIndex = randomIndex;
    alert(`🎲 恭喜抽中色系：【${options[randomIndex].value}】！`);
    onSelectionChange();
  }

  function drawStyle() {
    if (!showStyle) toggleOption('styleSection');
    const checkboxes = document.querySelectorAll('input[name="style"]');
    checkboxes.forEach(cb => cb.checked = false);

    const pool = [
      { name: "貓眼", weight: 75 }, { name: "暈染", weight: 30 }, { name: "小飾品/貼紙", weight: 2 },
      { name: "格紋", weight: 1 }, { name: "法式", weight: 1 }, { name: "立體不規則造型", weight: 1 },
      { name: "漸層", weight: 0.5 }, { name: "海莉款", weight: 0.5 }, { name: "(全/造型)鏡面銀", weight: 0.5 }
    ];

    const countToDraw = Math.floor(Math.random() * 3) + 1;
    let chosenList = [];

    for (let i = 0; i < countToDraw; i++) {
      const availablePool = pool.filter(item => !chosenList.includes(item.name));
      if (availablePool.length === 0) break;
      const totalWeight = availablePool.reduce((sum, item) => sum + item.weight, 0);
      let randomNum = Math.random() * totalWeight;
      for (let item of availablePool) {
        if (randomNum < item.weight) { chosenList.push(item.name); break; }
        randomNum -= item.weight;
      }
    }

    checkboxes.forEach(cb => {
      if (chosenList.includes(cb.value)) { cb.checked = true; checkLimit(cb); }
    });
    alert(`🎲 恭喜抽中 ${chosenList.length} 個款式：\n【${chosenList.join('、')}】！`);
    onSelectionChange();
  }

  function checkLimit(checkbox) {
    const checkboxes = document.querySelectorAll('input[name="style"]:checked');
    if (checkboxes.length > 4) {
      alert("款式類型最多只能勾選 4 個喔！");
      checkbox.checked = false;
    }
    const customCb = document.getElementById('customStyleCb');
    document.getElementById('customInputDiv').classList.toggle('hidden', !customCb.checked);
    onSelectionChange();
  }

  function calculateTotal() {
    let total = 0;
    const mainColorVal = document.getElementById('mainColor').value;
    const isMainColorSelected = mainColorVal !== "";
    const isJumpColorSelected = showJumpColor;
    const selectedStyles = showStyle ? document.querySelectorAll('input[name="style"]:checked') : [];
    const isStyleSelected = selectedStyles.length > 0;
    const hasNailService = isMainColorSelected || isJumpColorSelected || isStyleSelected;

    const needOff = document.querySelector('input[name="off"]:checked').value === "yes";
    if (needOff) {
      total += hasNailService ? 150 : 200;
    }
    if (isMainColorSelected) total += 650;
    if (isJumpColorSelected) total += 50;
    if (isStyleSelected) {
      total += (selectedStyles.length === 1) ? 150 : 200;
    }
    document.getElementById('totalPrice').innerText = total;
  }

  // 透過安全後端發送預約訊息
  function sendBooking() {
    const submitBtn = document.getElementById('submitBtn');
    const bookingDate = document.getElementById('bookingDate').value || '未選擇日期';
    const hour = document.getElementById('bookingHour').value;
    const minute = document.getElementById('bookingMinute').value;
    const bookingTime = `${hour}:${minute}`;

    const needOff = document.querySelector('input[name="off"]:checked').value === "yes";
    const mainColorVal = document.getElementById('mainColor').value;
    const isMainColorSelected = mainColorVal !== "";
    
    let details = `【美甲服務預約單】\n`;
    details += `----------------------------\n`;
    details += `• 預約時間：${bookingDate} ${bookingTime}\n`;
    details += `• 卸甲服務：${needOff ? '我要卸甲' : '不需要卸甲'}\n`;

    if (isMainColorSelected) {
      const toneText = document.querySelector('input[name="tone"]:checked').value;
      details += `• 單色款式：${mainColorVal}\n`;
      details += `• 色調選擇：${toneText}\n`;
    } else {
      details += `• 單色美甲：無 (單純卸甲/加購項目)\n`;
    }

    if (showJumpColor) {
      const jumpColor = document.getElementById('jumpColor').value;
      details += `• 加購跳色：${jumpColor}\n`;
    }

    if (showStyle) {
      const selectedStyles = Array.from(document.querySelectorAll('input[name="style"]:checked')).map(cb => cb.value);
      if (selectedStyles.length > 0) {
        if (selectedStyles.includes('貓眼')) {
          const catType = document.getElementById('catEyeType').value;
          const idx = selectedStyles.indexOf('貓眼');
          selectedStyles[idx] = `貓眼(${catType})`;
        }
        if (selectedStyles.includes('指定圖案')) {
          const customText = document.getElementById('customPattern').value || '未填寫';
          const idx = selectedStyles.indexOf('指定圖案');
          selectedStyles[idx] = `指定圖案(${customText})`;
        }
        details += `• 款式造型：${selectedStyles.join('、')}\n`;
      }
    }

    const finalPrice = document.getElementById('totalPrice').innerText;
    details += `----------------------------\n`;
    details += `💰 預計總金額：NT$ ${finalPrice} 元`;

    // 防止重複點擊
    submitBtn.disabled = true;
    submitBtn.innerText = "預約傳送中...";

    fetch(GOOGLE_BACKEND_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ message: details })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alert("✨ 預約成功！訊息已直接傳送給美甲師。");
      } else {
        alert("發送失敗，請直接聯繫美甲師喔！");
      }
    })
    .catch(err => {
      alert("預約已送出！請至 LINE 確認通知喔～");
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "送出預約通知";
    });
  }

  calculateTotal();
</script>

</body>
</html>
