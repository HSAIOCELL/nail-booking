<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美甲預約系統</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fcf9f8;
            color: #333;
            max-width: 500px;
            margin: 40px auto;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            color: #d48383;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fff;
        }
        .price-box {
            background-color: #f7ebee;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #b35959;
            margin-bottom: 24px;
        }
        button {
            width: 100%;
            background-color: #d48383;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #bd6e6e;
        }
    </style>
</head>
<body>

    <h2>✨ 美甲專屬預約系統 ✨</h2>

    <div class="form-group">
        <label for="clientName">客人口袋名稱 / 電話</label>
        <input type="text" id="clientName" placeholder="例如：王小明 / 0912-345678">
    </div>

    <div class="form-group">
        <label for="selectedDate">選擇預約日期</label>
        <input type="date" id="selectedDate">
    </div>

    <div class="form-group">
        <label for="selectedTimeSlot">選擇預約時段</label>
        <select id="selectedTimeSlot">
            <option value="10:00 - 13:00">10:00 - 13:00</option>
            <option value="13:30 - 16:30">13:30 - 16:30</option>
            <option value="17:00 - 20:00">17:00 - 20:00</option>
        </select>
    </div>

    <div class="form-group">
        <label for="selectedTone">選擇色調風格</label>
        <select id="selectedTone" onchange="updatePrice()">
            <option value="簡約單色 (NT$ 1,000)" data-price="1000">簡約單色 - NT$ 1,000</option>
            <option value="氣質貓眼 (NT$ 1,200)" data-price="1200">氣質貓眼 - NT$ 1,200</option>
            <option value="精緻造型 (NT$ 1,500)" data-price="1500">精緻造型 - NT$ 1,500</option>
        </select>
    </div>

    <div class="price-box">
        預計總金額：NT$ <span id="totalPrice">1000</span> 元
    </div>

    <button id="submitBtn" onclick="submitBooking()">確認預約並傳送到 LINE</button>

    <script>
      // 內建您剛剛部署好的 Google 試算表後台 API 網址
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
      
      // 請把下方引號內的 @您的LINE官方帳號ID 換成您真實的 LINE ID 或維持預設
      const LINE_OFFICIAL_ACCOUNT_ID = "@您的LINE官方帳號ID"; 

      let bookedDatesList = [];

      // 頁面載入時自動抓取已被預約的日期
      window.onload = async function() {
        try {
          let response = await fetch(GOOGLE_SCRIPT_URL);
          bookedDatesList = await response.json();
        } catch (error) {
          console.log("讀取已預約日期失敗", error);
        }
      };

      // 根據選單項目自動連動更新金額
      function updatePrice() {
        const select = document.getElementById('selectedTone');
        const price = select.options[select.selectedIndex].getAttribute('data-price');
        document.getElementById('totalPrice').innerText = price;
      }

      // 點擊預約按鈕觸發
      async function submitBooking() {
        const selectedDate = document.getElementById('selectedDate').value;
        const timeSlot = document.getElementById('selectedTimeSlot').value;
        const clientName = document.getElementById('clientName').value;
        const totalPrice = document.getElementById('totalPrice').innerText;
        const tone = document.getElementById('selectedTone').value;

        if (!clientName) {
          alert('請填寫您的姓名或電話！');
          return;
        }
        if (!selectedDate) {
          alert('請先選擇預約日期！');
          return;
        }

        // 顯示讀取中提示
        const btn = document.getElementById('submitBtn');
        btn.innerText = '正在寫入系統並跳轉 LINE...';

        // 1. 自動背景寫入 Google 試算表 (預約紀錄分頁)
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              date: selectedDate,
              timeSlot: timeSlot,
              clientName: clientName,
              totalPrice: totalPrice
            })
          });
        } catch (e) {
          console.log("資料同步至試算表異常", e);
        }

        // 2. 組合 LINE 預約明細並導向 LINE
        let details = `• 預約大名：${clientName}\n`;
        details += `• 預約日期：${selectedDate}\n`;
        details += `• 預約時段：${timeSlot}\n`;
        details += `• 色調風格：${tone}\n`;
        details += `----------------------------\n`;
        details += `預計總金額：NT$ ${totalPrice} 元`;

        const encodedMessage = encodeURIComponent(details);
        const lineUrl = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?${encodedMessage}`;
        
        // 延遲一秒確保資料送出後跳轉
        setTimeout(() => {
          window.location.href = lineUrl;
        }, 800);
      }
    </script>
</body>
</html>
