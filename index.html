<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>款式造型選擇欄位</title>
  <style>
    /* 容器：保持置中與微調後的緊湊間距 */
    .color-tone-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 10px 0;
    }

    /* 基本選項：無底色、無邊框，增加通透空間感 */
    .tone-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 14px;
      color: #4b5563;
      background-color: transparent; /* 無底色 */
      border: none;                  /* 無框框 */
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    /* 懸停效果：極微弱的背景提示 */
    .tone-option:hover {
      background-color: rgba(0, 0, 0, 0.03);
    }

    /* 已選擇項目：極淡柔和底色、無框框、保留勾勾 */
    .tone-option.active {
      background-color: #f0f3ff; /* 極淡紫色系（淡紫 #f0f3ff / 淡綠 #f0fdf4 / 淡灰 #f4f4f5） */
      color: #4f46e5;            /* 文字與勾勾顏色調深以維持對比 */
      font-weight: 500;
      border: none;              /* 確定無框框 */
    }

    /* SVG 勾勾圖示樣式 */
    .check-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="color-tone-container">
    <button class="tone-option">自然色調</button>
    
    <!-- 已選擇的項目 -->
    <button class="tone-option active">
      <svg class="check-icon" viewBox="0 0 24 24">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      清透亮色調
    </button>
    
    <button class="tone-option">暖柔色調</button>
  </div>

</body>
</html>
