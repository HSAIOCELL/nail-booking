<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "NT$    $    NT$    $\n$    NT$    $    NT$\nNT$    $    NT$    $\n$NT$    $    NT$    $";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }

    .section.disabled-step {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(40%);
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
    }

    label { font-size: 15.5px; color: #524741; cursor: pointer; }
    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
    }

    .datetime-container { display: flex; flex-direction: column; gap: 10px; }
    .time-picker-group { display: flex; gap: 8px; align-items: center; }
    .time-picker-group select { flex: 1; text-align: center; }

    /* 班表狀態提示訊息框 */
    #shiftNotice {
      font-size: 13px;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #fdf6ec;
      color: #b8860b;
      border: 1px solid #faedcd;
      display: none;
    }

    .total-box {
      background-color: #ebdcd3;
      color: #4e423b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 18px;
    }
    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2);
    }
    .submit-btn:hover { background-color: #5c5049; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <!-- 客戶姓名 (自動抓取 LINE 暱稱) -->
  <div class="section">
    <div class="section-title">您的稱呼 (已自動帶入 LINE 暱稱)</div>
    <input type="text" id="customerName" placeholder="載入中..." readonly style="background: #f5f2ed; font-weight: bold;">
  </div>

  <!-- Step 1. 預約日期與時間 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="date" id="bookingDate" onchange="validateDateTime()">
      </div>
      <div id="shiftNotice"></div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour" onchange="validateDateTime()">
            <option value="00">00 時</option><option value="01">01 時</option><option value="02">02 時</option>
            <option value="03">03 時</option><option value="04">04 時</option><option value="05">05 時</option>
            <option value="06">06 時</option><option value="07">07 時</option><option value="08">08 時</option>
            <option value="09">09 時</option><option value="10">10 時</option><option value="11">11 時</option>
            <option value="12">12 時</option><option value="13">13 時</option><option value="14">14 時</option>
            <option value="15">15 時</option><option value="16">16 時</option><option value="17">17 時</option>
            <option value="18">18 時</option><option value="19">19 時</option><option value="20">20 時</option>
            <option value="21">21 時</option><option value="22">22 時</option><option value="23">23 時</option>
          </select>
          <select id="bookingMinute" onchange="validateDateTime()">
            <option value="00">00 分</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="45">45 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2. 單色款式 -->
  <div class="section">
    <div class="section-title">Step 2. 單色款式</div>
    <select id="mainColor" onchange="onMainColorChange()">
      <option value="">-- 請選擇色系 --</option>
      <option value="紅色">紅色</option><option value="粉色">粉色</option><option value="橘色">橘色</option>
      <option value="黃色">黃色</option><option value="綠色">綠色</option><option value="藍色">藍色</option>
    </select>
  </div>

  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">800</span> 元
  </div>

  <button class="submit-btn" onclick="sendBooking()">送出預約單</button>
</div>

<!-- 引入 LINE LIFF SDK 以自動抓取 LINE 使用者暱稱 -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
  let bookedTimes = [];

  document.addEventListener('DOMContentLoaded', () => {
    initDatePicker();
    fetchBookedSlots();
    initLiffLogin(); // 初始化 LINE 抓取暱稱
  });

  // 1. 自動初始化 LIFF 抓取 LINE 暱稱
  async function initLiffLogin() {
    const nameInput = document.getElementById('customerName');
    try {
      // 請將下方 "YOUR_LIFF_ID" 換成你在 LINE Developers 申請的 LIFF ID (若暫時沒有可先保留)
      await liff.init({ liffId: "YOUR_LIFF_ID" });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        nameInput.value = profile.displayName; // 自動填入 LINE 暱稱
      } else {
        // 如果未登入，引導登入或允許手動輸入
        nameInput.removeAttribute('readonly');
        nameInput.placeholder = "請輸入您的稱呼";
      }
    } catch (err) {
      console.log("LIFF 初始化失敗或在一般瀏覽器中開啟", err);
      nameInput.removeAttribute('readonly');
      nameInput.value = "LINE 貴賓 (請修改)";
      nameInput.placeholder = "請輸入您的稱呼";
    }
  }

  // 2. 做二休二與日夜班班表排班邏輯 (以 10/23 夜班第一天為基準)
  function getShiftStatus(dateStr) {
    const anchorDate = new Date("2026-10-23"); // 基準日：夜班第一天
    const targetDate = new Date(dateStr);
    const diffDays = Math.floor((targetDate - anchorDate) / (1000 * 60 * 60 * 24));
    
    const cycleDay = ((diffDays % 4) + 4) % 4;
    const isWorkDay = (cycleDay === 0 || cycleDay === 1); // 做二休二

    if (isWorkDay) {
      return { type: "上班", desc: "🔒 當日為上班日，不開放預約" };
    } else {
      // 假設休假期間：如果是夜班循環的休假(這裡用簡易區分，或可根據實際情況調整)
      // 白班休假則需避開 00:00-06:00
      return { type: "休假_白班", desc: "⚠️ 當日為白班休假，已自動關閉 00:00 - 06:00 時段" };
    }
  }

  async function fetchBookedSlots() {
    try {
      const res = await fetch(SCRIPT_URL);
      bookedTimes = await res.json();
      validateDateTime();
    } catch (err) {
      console.error("無法取得預約資料", err);
    }
  }

  function initDatePicker() {
    const todayStr = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById("bookingDate");
    dateInput.min = todayStr;
    dateInput.value = todayStr;
  }

  // 3. 結合班表限制與已被預約時段過濾
  function validateDateTime() {
    const dateInput = document.getElementById("bookingDate").value;
    const hourSelect = document.getElementById("bookingHour");
    const noticeBox = document.getElementById("shiftNotice");
    if (!dateInput) return;

    // 取得當天班表狀態
    const shiftInfo = getShiftStatus(dateInput);
    noticeBox.style.display = "block";
    noticeBox.innerText = shiftInfo.desc;

    // 取得當天已被預約的清單
    let occupiedHours = [];
    if (Array.isArray(bookedTimes)) {
      bookedTimes.forEach(row => {
        if (row[2] === dateInput && row[6] !== "已取消") {
          occupiedHours.push(row[3]);
        }
      });
    }

    Array.from(hourSelect.options).forEach(opt => {
      const hStr = opt.value;
      const hInt = parseInt(hStr, 10);
      let isDisabled = false;

      // 規則 A：如果是上班日，全面禁止預約
      if (shiftInfo.type === "上班") {
        isDisabled = true;
      } 
      // 規則 B：如果是白班休假，關閉 00:00 - 06:00
      else if (shiftInfo.type === "休假_白班" && hInt >= 0 && hInt < 6) {
        isDisabled = true;
      }

      // 規則 C：已被其他人預約則防撞期
      if (occupiedHours.includes(hStr) || occupiedHours.includes(hStr + ":00")) {
        isDisabled = true;
        opt.text = `${hStr} 時 (已被預約)`;
      } else {
        if (!opt.text.includes("已被預約")) {
          opt.text = `${hStr} 時`;
        }
      }

      opt.disabled = isDisabled;
    });
  }

  function onMainColorChange() {
    // 價格計算
    const price = document.getElementById('mainColor').value ? 800 : 0;
    document.getElementById('totalPrice').innerText = price;
  }

  function sendBooking() {
    const customerName = document.getElementById('customerName').value;
    const bookingDate = document.getElementById('bookingDate').value;
    const hour = document.getElementById('bookingHour').value;
    const minute = document.getElementById('bookingMinute').value;

    if (!customerName) {
      alert("請填寫您的稱呼！");
      return;
    }

    const payload = {
      customerName: customerName,
      date: bookingDate,
      time: `${hour}:${minute}`,
      items: "單色光療",
      totalPrice: 800
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        alert(`預約成功！編號 #${res.bookingId}`);
        location.reload();
      } else {
        alert("預約失敗：" + res.message);
      }
    });
  }
</script>
</body>
</html>
