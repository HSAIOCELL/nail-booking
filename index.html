<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲線上預約系統</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; color: #444; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #d4a373; margin-bottom: 25px; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #666; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; background: #faf9f6; }
    input:focus, select:focus { outline: none; border-color: #d4a373; background: #fff; }

    /* 美化時段選取按鈕區塊 */
    .time-slot-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 5px; }
    .time-slot-btn { padding: 10px; border: 1px solid #d4a373; background: #fff; color: #d4a373; border-radius: 8px; cursor: pointer; text-align: center; font-size: 14px; transition: all 0.2s; }
    .time-slot-btn:hover { background: #faedcd; }
    .time-slot-btn.selected { background: #d4a373; color: #fff; font-weight: bold; }
    .time-slot-btn.disabled { background: #f0f0f0; border-color: #ddd; color: #aaa; cursor: not-allowed; }

    .btn-submit { width: 100%; background: #d4a373; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .btn-submit:hover { background: #bc6c25; }
    .notice { font-size: 12px; color: #888; text-align: center; margin-top: 15px; }
  </style>
</head>
<body>

<div class="container">
  <h2>✨ 美甲線上預約 ✨</h2>
  
  <form id="bookingForm" onsubmit="submitBooking(event)">
    <div class="form-group">
      <label for="customerName">您的姓名</label>
      <input type="text" id="customerName" required placeholder="請輸入您的稱呼">
    </div>

    <div class="form-group">
      <label for="date">預約日期</label>
      <input type="date" id="date" required onchange="generateTimeSlots()">
    </div>

    <div class="form-group">
      <label>選擇預約時段 (依班表與已預約狀況自動過濾)</label>
      <!-- 美化的時段點選方塊 -->
      <div id="timeSlotsGrid" class="time-slot-container">
        <span style="grid-column: span 3; text-align: center; color: #888; font-size: 13px;">請先選擇上方預約日期</span>
      </div>
      <input type="hidden" id="selectedTime" required>
    </div>

    <div class="form-group">
      <label for="items">預約項目</label>
      <select id="items" required>
        <option value="單色光療">單色光療 - NT$ 800</option>
        <option value="造型光療">造型光療 - NT$ 1200起</option>
        <option value="美甲卸甲">美甲卸甲 - NT$ 300</option>
      </select>
    </div>

    <div class="form-group">
      <label for="totalPrice">預估金額 (NT$)</label>
      <input type="number" id="totalPrice" value="800" required>
    </div>

    <button type="submit" class="btn-submit">確認送出預約</button>
  </form>
  
  <div class="notice">💡 貼心提醒：若逢白班休假將自動關閉 00:00-06:00 時段，已遭預約之時段將無法點選。</div>
</div>

<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
  let bookedTimes = []; // 存放已被預約的時間

  // 聯絡後端取得已被預約的清單
  async function fetchBookedSlots(selectedDate) {
    try {
      const res = await fetch(scriptUrl);
      const data = await res.json();
      bookedTimes = [];
      data.forEach(row => {
        // row[2] 是日期, row[3] 是時間, row[6] 是狀態
        if (row[2] === selectedDate && row[6] !== "已取消") {
          bookedTimes.push(row[3]);
        }
      });
    } catch (err) {
      console.error("無法取得已預約時段", err);
    }
  }

  // 產生美化過後的時段按鈕，並依據規則過濾
  async function generateTimeSlots() {
    const dateInput = document.getElementById('date').value;
    const grid = document.getElementById('timeSlotsGrid');
    document.getElementById('selectedTime').value = ""; // 清空選擇

    if (!dateInput) return;

    grid.innerHTML = `<span style="grid-column: span 3; text-align: center; color: #888; font-size: 13px;">載入中...</span>`;
    await fetchBookedSlots(dateInput);

    // 示範時段：您可以依據營業時間自行增減
    const allSlots = ["10:00", "13:00", "15:30", "18:00", "20:00", "02:00(深夜)"];
    
    // 簡單規則判斷：如果是白班休假（可以依需要帶入妳的排班判定），這裡示範基礎防撞期與過濾
    grid.innerHTML = "";
    
    allSlots.forEach(time => {
      const btn = document.createElement('div');
      btn.className = 'time-slot-btn';
      btn.innerText = time;

      // 檢查是否已被預約
      if (bookedTimes.includes(time)) {
        btn.classList.add('disabled');
        btn.innerText += " (已被預約)";
      } else {
        btn.onclick = function() {
          // 移除其他按鈕的 selected 狀態
          document.querySelectorAll('.time-slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('selectedTime').value = time;
        };
      }
      grid.appendChild(btn);
    });
  }

  // 提交預約
  function submitBooking(e) {
    e.preventDefault();
    const customerName = document.getElementById('customerName').value;
    const date = document.getElementById('date').value;
    const time = document.getElementById('selectedTime').value;
    const items = document.getElementById('items').value;
    const totalPrice = Number(document.getElementById('totalPrice').value);

    if (!time) {
      alert("請選擇一個預約時段！");
      return;
    }

    const payload = {
      customerName: customerName,
      date: date,
      time: time,
      items: items,
      totalPrice: totalPrice
    };

    const submitBtn = document.querySelector('.btn-submit');
    submitBtn.innerText = "預約提交中...";
    submitBtn.disabled = true;

    fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        alert(`預約成功！您的預約編號為 #${res.bookingId}`);
        location.reload();
      } else {
        alert("預約失敗：" + res.message);
        submitBtn.innerText = "確認送出預約";
        submitBtn.disabled = false;
      }
    })
    .catch(err => {
      console.error(err);
      alert("發生連線錯誤！");
      submitBtn.innerText = "確認送出預約";
      submitBtn.disabled = false;
    });
  }
</script>

</body>
</html>
