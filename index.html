<!-- Step 4. 色調（正圓美甲色卡選單） -->
<div class="section" id="toneSection">
  <div class="section-title">Step 4. 色調</div>
  <div class="tone-palette-group">
    <!-- 選項 1：不挑選 -->
    <div class="tone-option active" onclick="selectToneDot(this, '不挑選')">
      <span class="color-dot dot-neutral"></span>
      <span class="tone-label">不挑選</span>
    </div>

    <!-- 選項 2：個性暗色調 -->
    <div class="tone-option" onclick="selectToneDot(this, '個性暗色調')">
      <span class="color-dot dot-dark"></span>
      <span class="tone-label">個性暗色調</span>
    </div>

    <!-- 選項 3：清透亮色調 -->
    <div class="tone-option" onclick="selectToneDot(this, '清透亮色調')">
      <span class="color-dot dot-light"></span>
      <span class="tone-label">清透亮色調</span>
    </div>
  </div>

  <!-- 隱藏 input，記錄值傳遞給 LINE 預約單 -->
  <input type="hidden" id="selectedTone" value="不挑選">
</div>
