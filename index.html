<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    body {
      background-color: #efece6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
    }
    .card {
      background: #fdfbf7;
      max-width: 450px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(140, 124, 117, 0.15);
      padding: 24px;
      border: 1px solid #d8d0c5;
    }
    h2 {
      text-align: center;
      color: #5c504a;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      border-bottom: 1px dashed #a3958d;
      padding-bottom: 10px;
      letter-spacing: 1px;
    }
    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e5decb;
    }
    .section-title {
      font-weight: bold;
      color: #6e6058;
      margin-bottom: 10px;
      font-size: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .radio-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    label {
      font-size: 16px;
      color: #5c504a;
      cursor: pointer;
    }
    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #c8beba;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #f7f4ee;
      color: #4a423d;
    }
    select:focus, input[type="text"]:focus, input[type="date"]:focus {
      border-color: #8c7c75;
      box-shadow: 0 0 5px rgba(140, 124, 117, 0.3);
    }
    .calendar-container {
      width: 100%;
      height: 300px;
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #c8beba;
    }
    .calendar-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .add-btn {
      background-color: #a3958d;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      margin-left: 5px;
    }
    .add-btn:hover {
      background-color: #8c7c75;
    }
    .draw-btn {
      background-color: #d8c2b5;
      color: #4a423d;
      border: 1px solid #b8a295;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .draw-btn:hover {
      background-color: #c8b2a5;
    }
    .hidden {
      display: none;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .total-box {
      background-color: #e8d8ce;
      color: #5c504a;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .submit-btn {
      width: 100%;
      background-color: #8c7c75;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(140, 124, 117, 0.3);
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .submit-btn:hover {
      background-color: #6e6058;
    }
    .sub-input {
      margin-top: 8px;
    }
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>美甲服務預約選單</h2>

  <!-- 1. 當月可預約空檔 -->
  <div class="section">
    <div class="section-title">
      1. 當月可預約空檔
      <button class="draw-btn" onclick="toggleCalendar()">📅 顯示/隱藏 行事曆</button>
    </div>
    <div id="calendarWrapper" class="calendar-container">
      <iframe src="https://calendar.google.com/calendar/embed?src=zh-tw.taiwan%23holiday%40group.v.calendar.google.com&ctz=Asia%2FTaipei"></iframe>
    </div>

    <!-- 預約日期與時間選擇 -->
    <div class="time-grid" style="margin-top: 10px;">
      <div>
        <label style="font-size: 14px; font-weight: bold;">預約日期：</label>
        <input type="date" id="bookingDate">
      </div>
      <div>
        <label style="font-size: 14px; font-weight: bold;">預約時間：</label>
        <select id="bookingTime">
          <option value="10:00">10:00 (整點)</option>
          <option value="10:15">10:15 (15分)</option>
          <option value="10:30">10:30 (30分)</option>
          <option value="11:00">11:00 (整點)</option>
          <option value="11:15">11:15 (15分)</option>
          <option value="11:30">11:30 (30分)</option>
          <option value="12:00">12:00 (整點)</option>
          <option value="12:15">12:15 (15分)</option>
          <option value="12:30">12:30 (30分)</option>
          <option value="13:00">13:00 (整點)</option>
          <option value="13:15">13:15 (15分)</option>
          <option value="13:30">13:30 (30分)</option>
          <option value="14:00" selected>14:00 (整點)</option>
          <option value="14:15">14:15 (15分)</option>
          <option value="14:30">14:30 (30分)</option>
          <option value="15:00">15:00 (整點)</option>
          <option value="15:15">15:15 (15分)</option>
          <option value="15:30">15:30 (30分)</option>
          <option value="16:00">16:00 (整點)</option>
          <option value="16:15">16:15 (15分)</option>
          <option value="16:30">16:30 (30分)</option>
          <option value="17:00">17:00 (整點)</option>
          <option value="17:15">17:15 (15分)</option>
          <option value="17:30">17:30 (30分)</option>
          <option value="18:00">18:00 (整點)</option>
          <option value="18:15">18:15 (15分)</option>
          <option value="18:30">18:30 (30分)</option>
          <option value="19:00">19:00 (整點)</option>
          <option value="19:15">19:15 (15分)</option>
          <option value="19:30">19:30 (30分)</option>
          <option value="20:00">20:00 (整點)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 2. 卸甲服務 -->
  <div class="section">
    <div class="section-title">2. 卸甲服務</div>
    <div class="radio-group">
      <label><input type="radio" name="off" value="150" onchange="calculateTotal()"> 我要卸甲! (+150)</label>
      <label><input type="radio" name="off" value="0" checked onchange="calculateTotal()"> 不需要卸甲~</label>
    </div>
  </div>

  <!-- 3. 單色款式 -->
  <div class="section">
    <div class="section-title">
      3. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🎲 幫我抽色系</button>
    </div>
    <div style="margin-bottom: 5px;">
      <label><input type="checkbox" id="enableMainColor" checked onchange="toggleMainColor()"> 施作單色美甲 (700元)</label>
    </div>
    <select id="mainColor" onchange="calculateTotal()">
      <option value="紅色">紅色</option>
      <option value="粉色">粉色</option>
      <option value="橘色">橘色</option>
      <option value="黃色">黃色</option>
      <option value="深咖/可可色">深咖/可可色</option>
      <option value="淺咖色">淺咖色</option>
      <option value="綠色">綠色</option>
      <option value="藍色">藍色</option>
      <option value="紫色">紫色</option>
      <option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option>
      <option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- 4. 色調選擇 -->
  <div class="section" id="toneSection">
    <div class="section-title">4. 色調選擇</div>
    <div class="radio-group">
      <label><input type="radio" name="tone" value="深色感" checked> 深色感</label>
      <label><input type="radio" name="tone" value="淺色感"> 淺色感</label>
      <label><input type="radio" name="tone" value="隨機發揮"> 隨機發揮</label>
    </div>
  </div>

  <!-- 5. 加購項目 -->
  <div class="section">
    <div class="section-title">
      5. 加購項目
      <div>
        <button class="add-btn" onclick="toggleOption('jumpColorSection')">+ 跳色</button>
        <button class="add-btn" onclick="toggleOption('styleSection')">+ 款式造型</button>
      </div>
    </div>

    <!-- 跳色選單 -->
    <div id="jumpColorSection" class="hidden" style="margin-top: 10px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #6e6058;">跳色選擇：</div>
      <select id="jumpColor" onchange="calculateTotal()">
        <option value="交給琦選!">交給琦選!</option>
        <option value="紅色">紅色</option>
        <option value="粉色">粉色</option>
        <option value="橘色">橘色</option>
        <option value="黃色">黃色</option>
        <option value="深咖/可可色">深咖/可可色</option>
        <option value="淺咖色">淺咖色</option>
        <option value="綠色">綠色</option>
        <option value="藍色">藍色</option>
        <option value="紫色">紫色</option>
        <option value="黑色">黑色</option>
        <option value="銀色/白色">銀色/白色</option>
        <option value="金色/香檳色">金色/香檳色</option>
      </select>
    </div>

    <!-- 款式勾選區 -->
    <div id="styleSection" class="hidden" style="margin-top: 10px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
        <div style="font-size: 14px; font-weight: bold; color: #6e6058;">款式類型 (最多選4個)：</div>
        <button class="draw-btn" onclick="drawStyle()">🎲 幫我抽款式</button>
      </div>
      <div style="font-size: 12px; color: #8c7c75; margin-bottom: 8px;">(選1個 +150元 / 選2個以上 +200元)</div>
      
      <div class="checkbox-grid">
        <label><input type="checkbox" name="style" id="catEyeCb" value="貓眼" onchange="checkLimit(this)"> 貓眼</label>
        <label><input type="checkbox" name="style" value="暈染" onchange="checkLimit(this)"> 暈染</label>
        <label><input type="checkbox" name="style" value="立體不規則造型" onchange="checkLimit(this)"> 立體不規則造型</label>
        <label><input type="checkbox" name="style" value="法式" onchange="checkLimit(this)"> 法式</label>
        <label><input type="checkbox" name="style" value="漸層" onchange="checkLimit(this)"> 漸層</label>
        <label><input type="checkbox" name="style" value="海莉款" onchange="checkLimit(this)"> 海莉款</label>
        <label><input type="checkbox" name="style" value="(全/造型)鏡面銀" onchange="checkLimit(this)"> (全/造型)鏡面銀</label>
        <label><input type="checkbox" name="style" value="小飾品/貼紙" onchange="checkLimit(this)"> 小飾品/貼紙</label>
        <label><input type="checkbox" name="style" value="格紋" onchange="checkLimit(this)"> 格紋</label>
        <label><input type="checkbox" name="style" id="customStyleCb" value="指定圖案" onchange="checkLimit(this)"> 指定圖案</label>
      </div>

      <!-- 貓眼細項選擇 -->
      <div id="catEyeDetailDiv" class="sub-input hidden">
        <label style="font-size: 13px; font-weight: bold; color: #6e6058;">貓眼類型：</label>
        <select id="catEyeType">
          <option value="依單色色系為主">依單色色系為主</option>
          <option value="雙色貓眼">雙色貓眼</option>
          <option value="指定單色貓眼">指定單色貓眼</option>
        </select>
      </div>

      <!-- 指定圖案備註 -->
      <div id="customInputDiv" class="sub-input hidden">
        <input type="text" id="customPattern" placeholder="請填寫指定圖案細節">
      </div>
    </div>
  </div>

  <!-- 金額顯示 -->
  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">700</span> 元
  </div>

  <button class="submit-btn" onclick="sendToLine()">送出預約至 LINE</button>
</div>

<script>
  let showJumpColor = false;
  let showStyle = false;

  // 自動預設今天日期
  document.getElementById('bookingDate').valueAsDate = new Date();

  function toggleCalendar() {
    const cal = document.getElementById('calendarWrapper');
    cal.classList.toggle('hidden');
  }

  function toggleMainColor() {
    const isChecked = document.getElementById('enableMainColor').checked;
    document.getElementById('mainColor').disabled = !isChecked;
    document.getElementById('toneSection').style.opacity = isChecked ? '1' : '0.5';
    calculateTotal();
  }

  function toggleOption(id) {
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') {
      showJumpColor = !showJumpColor;
      el.classList.toggle('hidden', !showJumpColor);
    } else if (id === 'styleSection') {
      showStyle = !showStyle;
      el.classList.toggle('hidden', !showStyle);
    }
    calculateTotal();
  }

  // 🎲 隨機抽單色色系
  function drawMainColor() {
    if (!document.getElementById('enableMainColor').checked) {
      document.getElementById('enableMainColor').checked = true;
      toggleMainColor();
    }
    const select = document.getElementById('mainColor');
    const options = select.options;
    const randomIndex = Math.floor(Math.random() * options.length);
    select.selectedIndex = randomIndex;
    alert(`🎲 恭喜抽中色系：【${options[randomIndex].value}】！`);
    calculateTotal();
  }

  // 🎲 隨機抽選 1 ~ 3 個款式造型
  function drawStyle() {
    if (!showStyle) {
      toggleOption('styleSection');
    }

    const checkboxes = document.querySelectorAll('input[name="style"]');
    checkboxes.forEach(cb => cb.checked = false);

    const pool = [
      { name: "貓眼", weight: 75 },
      { name: "暈染", weight: 30 },
      { name: "小飾品/貼紙", weight: 2 },
      { name: "格紋", weight: 1 },
      { name: "法式", weight: 1 },
      { name: "立體不規則造型", weight: 1 },
      { name: "漸層", weight: 0.5 },
      { name: "海莉款", weight: 0.5 },
      { name: "(全/造型)鏡面銀", weight: 0.5 }
    ];

    // 隨機決定要抽出 1 ~ 3 個項目
    const countToDraw = Math.floor(Math.random() * 3) + 1;
    let chosenList = [];

    for (let i = 0; i < countToDraw; i++) {
      // 排除已抽中的項目，避免重複
      const availablePool = pool.filter(item => !chosenList.includes(item.name));
      if (availablePool.length === 0) break;

      const totalWeight = availablePool.reduce((sum, item) => sum + item.weight, 0);
      let randomNum = Math.random() * totalWeight;

      for (let item of availablePool) {
        if (randomNum < item.weight) {
          chosenList.push(item.name);
          break;
        }
        randomNum -= item.weight;
      }
    }

    // 勾選抽中的項目
    checkboxes.forEach(cb => {
      if (chosenList.includes(cb.value)) {
        cb.checked = true;
        checkLimit(cb);
      }
    });

    alert(`🎲 恭喜抽中 ${chosenList.length} 個款式：\n【${chosenList.join('、')}】！`);
    calculateTotal();
  }

  function checkLimit(checkbox) {
    const checkboxes = document.querySelectorAll('input[name="style"]:checked');
    if (checkboxes.length > 4) {
      alert("款式類型最多只能勾選 4 個喔！");
      checkbox.checked = false;
    }
    
    // 貓眼細項顯示控制
    const catEyeCb = document.getElementById('catEyeCb');
    document.getElementById('catEyeDetailDiv').classList.toggle('hidden', !catEyeCb.checked);

    // 指定圖案備註顯示控制
    const customCb = document.getElementById('customStyleCb');
    document.getElementById('customInputDiv').classList.toggle('hidden', !customCb.checked);

    calculateTotal();
  }

  function calculateTotal() {
    let total = 0;

    // 1. 單色美甲
    const isMainColor = document.getElementById('enableMainColor').checked;
    if (isMainColor) {
      total += 700;
    }

    // 2. 卸甲
    const offValue = parseInt(document.querySelector('input[name="off"]:checked').value);
    total += offValue;

    // 3. 跳色 (+50)
    if (showJumpColor) {
      total += 50;
    }

    // 4. 款式加價
    if (showStyle) {
      const selectedStyles = document.querySelectorAll('input[name="style"]:checked');
      const count = selectedStyles.length;
      if (count === 1) {
        total += 150;
      } else if (count >= 2) {
        total += 200;
      }
    }

    document.getElementById('totalPrice').innerText = total;
  }

  function sendToLine() {
    const bookingDate = document.getElementById('bookingDate').value || '未選擇日期';
    const bookingTime = document.getElementById('bookingTime').value;
    const offText = document.querySelector('input[name="off"]:checked').parentElement.innerText.trim();
    const isMainColor = document.getElementById('enableMainColor').checked;
    
    let details = `【美甲服務預約單】\n`;
    details += `----------------------------\n`;
    details += `• 預約時間：${bookingDate} (${bookingTime})\n`;
    details += `• 卸甲服務：${offText}\n`;

    if (isMainColor) {
      const mainColor = document.getElementById('mainColor').value;
      const toneText = document.querySelector('input[name="tone"]:checked').value;
      details += `• 單色款式：${mainColor}\n`;
      details += `• 色調選擇：${toneText}\n`;
    } else {
      details += `• 單色美甲：不需要 (僅純卸甲/單做項目)\n`;
    }

    if (showJumpColor) {
      const jumpColor = document.getElementById('jumpColor').value;
      details += `• 加價跳色：${jumpColor}\n`;
    }

    if (showStyle) {
      const selectedStyles = Array.from(document.querySelectorAll('input[name="style"]:checked')).map(cb => cb.value);
      if (selectedStyles.length > 0) {
        // 貓眼細項格式化
        if (selectedStyles.includes('貓眼')) {
          const catType = document.getElementById('catEyeType').value;
          const idx = selectedStyles.indexOf('貓眼');
          selectedStyles[idx] = `貓眼(${catType})`;
        }
        // 指定圖案格式化
        if (selectedStyles.includes('指定圖案')) {
          const customText = document.getElementById('customPattern').value || '未填寫';
          const idx = selectedStyles.indexOf('指定圖案');
          selectedStyles[idx] = `指定圖案(${customText})`;
        }
        const stylePrice = selectedStyles.length === 1 ? '150元' : '200元';
        details += `• 款式造型：${selectedStyles.join('、')} (+${stylePrice})\n`;
      }
    }

    const finalPrice = document.getElementById('totalPrice').innerText;
    details += `----------------------------\n`;
    details += `💰 預計總金額：NT$ ${finalPrice} 元`;

    const lineShareUrl = `https://line.me/R/share?text=${encodeURIComponent(details)}`;
    window.location.href = lineShareUrl;
  }
</script>

</body>
</html>
