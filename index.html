<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <!-- 引入穩定可靠的 Flatpickr 視覺化月曆套件 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>

  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "NT$    $    NT$    $\n$    NT$    $    NT$\nNT$    $    NT$    $\n$NT$    $    NT$    $";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root {
      color-scheme: light;
    }

    input[type="checkbox"], 
    input[type="radio"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    #frontendReminder {
      display: none;
      background: #fffae6;
      border: 1px solid #ffe58f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      color: #d48806;
      font-size: 13.5px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .section.disabled-step {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(40%);
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-size: 15.5px;
      color: #524741;
      cursor: pointer;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus {
      border-color: #7a6b63;
      box-shadow: 0 0 4px rgba(122, 107, 99, 0.25);
    }

    .flatpickr-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff !important;
      color: #4a423d;
      cursor: pointer;
    }

    .flatpickr-calendar {
      background: #faf8f5 !important;
      border: 1px solid #e2dad1 !important;
      box-shadow: 0 10px 25px rgba(120, 108, 100, 0.15) !important;
      border-radius: 14px !important;
      font-family: inherit !important;
    }

    /* 🎯 月曆格子的圓形班別標記：日班=黃色 / 夜班=藍灰色 */
    .flatpickr-day.available-day-yellow {
      background-color: #fdf6e2 !important;
      color: #a37512 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #f2d896 !important;
    }
    .flatpickr-day.available-day-blue {
      background-color: #e5ece9 !important;
      color: #4c6b61 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #b8c9c4 !important;
    }
    .flatpickr-day.available-day-yellow.selected, .flatpickr-day.available-day-blue.selected {
      background-color: #7a6b63 !important;
      color: #ffffff !important;
      border-color: #5c5049 !important;
    }
    .flatpickr-day.flatpickr-disabled, .flatpickr-day.flatpickr-disabled:hover {
      color: #d1c7bd !important;
      background: transparent !important;
      text-decoration: line-through;
      opacity: 0.4;
    }

    @keyframes selectFlash {
      0% { border-color: #7a6b63; box-shadow: 0 0 0 3px rgba(122, 107, 99, 0.4); background-color: #ffffff; }
      50% { border-color: #a8988e; box-shadow: 0 0 0 5px rgba(122, 107, 99, 0.6); background-color: #eae1d7; }
      100% { border-color: #cfc5bb; box-shadow: none; background-color: #ffffff; }
    }

    .flash-highlight {
      animation: selectFlash 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 8px;
    }
    
    select option:disabled {
      color: #c0b5ac;
      background-color: #f5f2ed;
    }

    .datetime-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-picker-group select {
      flex: 1;
      text-align: center;
    }

    .tone-palette-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 6px 4px;
    }
    .tone-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 20px;
      transition: all 0.25s ease;
      user-select: none;
      white-space: nowrap;
    }
    .tone-option:hover {
      background-color: rgba(240, 236, 227, 0.6);
    }
    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      flex-shrink: 0;
      background-color: #e8e0d5; 
      border: 1.5px solid #d4c7b8;
    }
    .tone-label {
      font-size: 15px;
      color: #8c7c75;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.25s ease, font-weight 0.25s ease;
    }
    .tone-option.active .color-dot {
      background-color: #7a6b63;
      border-color: #5c5049;
      transform: scale(1.15);
      box-shadow: 0 0 0 2.5px #faf8f5, 0 0 0 4.5px #7a6b63;
    }
    .tone-option.active .tone-label {
      color: #3d3028;
      font-weight: 700;
    }

    .addon-item-box {
      border: 1.5px dashed #c2b5aa;
      background-color: #fcfaf7;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .addon-item-box:hover {
      border-color: #827167;
      background-color: #f5efe8;
    }
    .addon-item-box.active {
      border-style: solid;
      border-color: #7a6b63;
      background-color: #f2ebe4;
      box-shadow: 0 2px 8px rgba(122, 107, 99, 0.12);
    }
    .addon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: #5c5049;
    }
    .addon-badge {
      font-size: 13px;
      background-color: #e5ded7;
      color: #6e6057;
      padding: 3px 10px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .addon-item-box.active .addon-badge {
      background-color: #7a6b63;
      color: #ffffff;
    }

    .removal-card-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .removal-card {
      flex: 1;
      border: 1.5px dashed #c2b5aa;
      background-color: #fcfaf7;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .removal-card:hover {
      border-color: #827167;
      background-color: #f5efe8;
    }
    .removal-card.active {
      border-style: solid;
      border-color: #bdaca2;
      background-color: #f2ebe4;
      transform: scale(1.03);
      box-shadow: 0 4px 12px rgba(122, 107, 99, 0.15);
    }
    .removal-card-title {
      font-size: 16.5px;
      font-weight: bold;
      color: #4e423b;
      margin: 0;
    }

    .draw-btn {
      background-color: #e4dcd3;
      color: #4a423d;
      border: 1px solid #c9bebc;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .draw-btn:hover {
      background-color: #d7ccc3;
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 8px 10px;
      padding: 10px;
      background-color: #ffffff;
      border-radius: 12px;
      border: 1px solid #ebdcd3;
    }

    .chip-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      border-radius: 20px;
      background-color: transparent; 
      border: none;                 
      color: #524741;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      user-select: none;
      text-align: center;
      white-space: nowrap;
    }

    .chip-item input[type="checkbox"],
    .chip-item input[type="radio"] {
      display: none;
    }

    .chip-item::before {
      content: "";
      display: inline-block;
      width: 0;
      opacity: 0;
      transition: all 0.2s ease;
      margin-right: 0;
    }

    .chip-item:hover {
      background-color: #f5efe8; 
      border-radius: 20px;
    }

    .chip-item:has(input:checked) {
      background-color: #7a6b63;
      border-color: #5c5049;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(122, 107, 99, 0.25);
    }

    .chip-item:has(input:checked)::before {
      content: "✓";
      width: 14px;
      opacity: 1;
      margin-right: 4px;
      font-weight: bold;
    }
    
    .total-box {
      background-color: #ebdcd3;
      color: #4e423b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2);
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .submit-btn:hover {
      background-color: #5c5049;
    }
    .sub-input {
      margin-top: 8px;
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <div id="frontendReminder">
    ⚠️ 提醒：目前正值 15 號至 20 號期間，請留意下兩個月的最新班表與預約動態！
  </div>

  <!-- 預約暱稱 -->
  <div class="section">
    <div class="section-title">預約暱稱</div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="customerName" placeholder="請輸入您的預約暱稱" oninput="checkAdminMode(this.value)" style="flex: 1;">
      <button type="button" class="draw-btn" onclick="loginWithLine()" style="white-space: nowrap; background: #06c755; color: #fff; border: none;">連動 LINE 暱稱</button>
    </div>
    <div id="adminPanel" class="hidden" style="margin-top: 8px; padding: 8px; background: #fff3cd; border-radius: 8px; border: 1px solid #ffeeba; text-align: center;">
      <span style="font-size: 13px; font-weight: bold; color: #856404;">🔧 管理者模式：</span>
      <button type="button" onclick="enableAdminOverride()" style="padding: 4px 10px; font-size: 12px; background: #856404; color: #fff; border: none; border-radius: 6px; cursor: pointer;">手動解鎖所有日曆日期</button>
    </div>
  </div>

  <!-- Step 1. 預約日期與時間 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="text" id="bookingDate" placeholder="請選擇預約日期">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour" onchange="validateTime()">
            <option value="00">00 時</option><option value="01">01 時</option><option value="02">02 時</option>
            <option value="03">03 時</option><option value="04">04 時</option><option value="05">05 時</option>
            <option value="06">06 時</option><option value="07">07 時</option><option value="08">08 時</option>
            <option value="09">09 時</option><option value="10">10 時</option><option value="11">11 時</option>
            <option value="12">12 時</option><option value="13">13 時</option><option value="14">14 時</option>
            <option value="15">15 時</option><option value="16">16 時</option><option value="17">17 時</option>
            <option value="18">18 時</option><option value="19">19 時</option><option value="20">20 時</option>
            <option value="21">21 時</option><option value="22">22 時</option><option value="23">23 時</option>
          </select>
          <select id="bookingMinute" onchange="validateTime()">
            <option value="00">00 分</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="45">45 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2. 單色款式 -->
  <div class="section">
    <div class="section-title">
      Step 2. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🫯 幫我抽色系</button>
    </div>
    <select id="mainColor" onchange="onMainColorChange()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="紅色">紅色</option><option value="粉色">粉色</option><option value="橘色">橘色</option><option value="黃色">黃色</option>
      <option value="紅咖色">紅咖色</option><option value="深咖/可可色">深咖/可可色</option><option value="淺咖色">淺咖色</option>
      <option value="綠色">綠色</option><option value="藍色">藍色</option><option value="紫色">紫色</option><option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option><option value="灰色">灰色</option><option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- Step 3. 加購項目 -->
  <div class="section disabled-step" id="step3Section">
    <div style="font-weight: bold; color: #5c5049; margin-bottom: 12px; font-size: 16.5px;">Step 3. 加購項目</div>
    <div id="boxJumpColor" class="addon-item-box" onclick="toggleOption('jumpColorSection', event)">
      <div class="addon-header"><span>🎨 跳色</span><span id="badgeJumpColor" class="addon-badge">50 元 ➕</span></div>
      <div id="jumpColorSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div style="font-size: 13.5px; font-weight: bold; color: #5c5049;">選擇色系：</div>
          <button class="draw-btn" onclick="drawSmartJumpColor(event)">🫯 隨機配色</button>
        </div>
        <select id="jumpColor" onchange="onSelectionChange()">
          <option value="">--請選擇跳色色系--</option>
          <option value="紅色">紅色</option><option value="粉色">粉色</option><option value="橘色">橘色</option><option value="黃色">黃色</option>
          <option value="紅咖色">紅咖色</option><option value="深咖/可可色">深咖/可可色</option><option value="淺咖色">淺咖色</option>
          <option value="綠色">綠色</option><option value="藍色">藍色</option><option value="紫色">紫色</option><option value="黑色">黑色</option>
          <option value="銀色/白色">銀色/白色</option><option value="灰色">灰色</option><option value="金色/香檳色">金色/香檳色</option>
        </select>
      </div>
    </div>

    <div id="boxStyle" class="addon-item-box" onclick="toggleOption('styleSection', event)">
      <div class="addon-header"><span>✨ 款式造型</span><span id="badgeStyle" class="addon-badge">50元起 ➕</span></div>
      <div id="styleSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
          <button class="draw-btn" onclick="drawStyle(event)">🫯 幫我抽款式</button>
        </div>
        <div class="removal-card-group" style="margin-top: 0; margin-bottom: 12px; gap: 8px;">
          <div id="typePartialCard" class="removal-card" onclick="setStyleType('partial')" style="padding: 10px; font-size: 15px;"><div class="removal-card-title" style="font-size: 15px;">局部造型</div></div>
          <div id="typeFullCard" class="removal-card" onclick="setStyleType('full')" style="padding: 10px; font-size: 15px;"><div class="removal-card-title" style="font-size: 15px;">十指造型</div></div>
        </div>
        <input type="radio" name="styleType" value="partial" id="radioPartial" style="display:none;">
        <input type="radio" name="styleType" value="full" id="radioFull" style="display:none;">
        
        <div id="partialStyleGroup" class="hidden">
          <div style="font-size: 12px; color: #8c7c75; margin-bottom: 4px; font-weight: 500;">(至多5指造型+5指以上單色/跳色)</div>
          <div class="checkbox-grid" style="margin-bottom: 12px;">
            <label class="chip-item"><input type="checkbox" name="style" id="catEyeCb" value="貓眼" onchange="checkLimit(this)">貓眼</label>
            <label class="chip-item"><input type="checkbox" name="style" value="立體不規則造型" onchange="checkLimit(this)">立體不規則造型</label>
            <label class="chip-item"><input type="checkbox" name="style" value="法式" onchange="checkLimit(this)">法式</label>
            <label class="chip-item"><input type="checkbox" name="style" value="鏡面銀" onchange="checkLimit(this)">鏡面銀</label>
            <label class="chip-item"><input type="checkbox" name="style" value="漸層" onchange="checkLimit(this)">漸層</label>
            <label class="chip-item"><input type="checkbox" name="style" value="小飾品/貼紙" onchange="checkLimit(this)">小飾品/貼紙</label>
            <label class="chip-item"><input type="checkbox" name="style" value="格紋" onchange="checkLimit(this)">格紋</label>
            <label class="chip-item"><input type="checkbox" name="style" value="暈染" onchange="checkLimit(this)">暈染</label>
            <label class="chip-item"><input type="checkbox" name="style" value="海莉款" onchange="checkLimit(this)">海莉款</label>
            <label class="chip-item"><input type="checkbox" name="style" id="customStyleCb" value="指定圖案" onchange="checkLimit(this)">指定圖案</label>
          </div>
        </div>

        <div id="fullStyleGroup" class="hidden">
          <div style="font-size: 12px; color: transparent; margin-bottom: 4px; user-select: none; pointer-events: none;">(佔位)</div>
          <div class="checkbox-grid" style="margin-bottom: 12px;">
            <label class="chip-item"><input type="checkbox" name="fullStyle" id="fullCatEyeCb" value="貓眼" onchange="checkFullLimit(this)">貓眼</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="立體不規則造型" onchange="checkFullLimit(this)">立體不規則造型</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="法式" onchange="checkFullLimit(this)">法式</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="鏡面銀" onchange="checkFullLimit(this)">鏡面銀</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="漸層" onchange="checkFullLimit(this)">漸層</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="小飾品/貼紙" onchange="checkFullLimit(this)">小飾品/貼紙</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="格紋" onchange="checkFullLimit(this)">格紋</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="暈染" onchange="checkFullLimit(this)">暈染</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="海莉款" onchange="checkFullLimit(this)">海莉款</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" id="fullCustomStyleCb" value="指定圖案" onchange="checkFullLimit(this)">指定圖案</label>
          </div>
        </div>

        <div id="catEyeDetailDiv" class="sub-input hidden">
          <label style="font-size: 13px; font-weight: bold; color: #5c5049;">貓眼類型：</label>
          <select id="catEyeType" style="background-color: #ffffff; font-weight: bold;">
            <option value="指定單色貓眼">指定單色貓眼</option><option value="雙色貓眼">雙色貓眼</option>
          </select>
        </div>
        <div id="customInputDiv" class="sub-input hidden">
          <input type="text" id="customPattern" placeholder="請填寫指定圖案細節 (必填)">
        </div>
      </div>
    </div>
  </div>

  <!-- Step 4. 色調 -->
  <div class="section disabled-step" id="step4Section">
    <div class="section-title">Step 4. 色調</div>
    <div class="tone-palette-group">
      <div class="tone-option active" onclick="selectToneDot(this, '隨機')"><span class="color-dot"></span><span class="tone-label">隨機</span></div>
      <div class="tone-option" onclick="selectToneDot(this, '個性暗色調')"><span class="color-dot"></span><span class="tone-label">個性暗色調</span></div>
      <div class="tone-option" onclick="selectToneDot(this, '清透亮色調')"><span class="color-dot"></span><span class="tone-label">清透亮色調</span></div>
    </div>
    <input type="hidden" id="selectedTone" value="隨機">
  </div>

  <!-- Step 5. 卸甲服務 -->
  <div class="section">
    <div class="section-title">Step 5. 卸甲服務</div>
    <div class="removal-card-group">
      <div id="removalYesCard" class="removal-card" onclick="setRemoval(true)"><div class="removal-card-title">需要卸甲</div></div>
      <div id="removalNoCard" class="removal-card active" onclick="setRemoval(false)"><div class="removal-card-title">不需要</div></div>
    </div>
  </div>

  <div class="total-box">預計總金額：NT$ <span id="totalPrice">0</span> 元</div>
  <button class="submit-btn" onclick="sendBooking()">送出預約單 (開啟 LINE)</button>
</div>

<!-- 引入 LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LINE_OFFICIAL_ACCOUNT_ID = "@344gjuzg"; 
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";

  let adminOverride = false; 
  let backendShiftGroup = "B";
  let backendMonthlyShiftTypes = {}; 
  let backendSchedules = {};
  let pickerInstance = null;

  const ALL_COLORS = ["紅色", "粉色", "橘色", "黃色", "紅咖色", "深咖/可可色", "淺咖色", "綠色", "藍色", "紫色", "黑色", "銀色/白色", "灰色", "金色/香檳色"];
  let showJumpColor = false, showStyle = false, needRemoval = false;

  document.addEventListener('DOMContentLoaded', () => {
    checkFrontendReminder();
    initLiffLogin();
    
    // 確保網頁一開就先建立基本月曆
    initFlatpickr();

    // 非同步從後台抓取最新班表與營業微調
    fetchBackendConfigAndInit();
  });

  window.addEventListener('pageshow', () => {
    const submitBtn = document.querySelector('.submit-btn');
    if (submitBtn) { submitBtn.innerText = "送出預約單 (開啟 LINE)"; submitBtn.disabled = false; }
  });

  function checkFrontendReminder() {
    const todayDay = new Date().getDate();
    if (todayDay >= 15 && todayDay <= 20) {
      document.getElementById('frontendReminder').style.display = "block";
    }
  }

  async function fetchBackendConfigAndInit() {
    try {
      const res = await fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if (data.shiftGroup) backendShiftGroup = data.shiftGroup;
      if (data.monthlyShiftTypes) backendMonthlyShiftTypes = data.monthlyShiftTypes;
      if (data.schedules) backendSchedules = data.schedules;

      for (let ym in backendMonthlyShiftTypes) {
        if (typeof backendMonthlyShiftTypes[ym] === 'string') {
          backendMonthlyShiftTypes[ym] = { shiftGroup: backendShiftGroup, shiftType: backendMonthlyShiftTypes[ym] };
        }
      }
      // 資料抓取成功後重新刷新月曆以載入後台最新的顏色標記
      initFlatpickr();
    } catch (e) {
      console.warn("無法取得後端排班設定，已使用預設邏輯", e);
    }
  }

  function checkAdminMode(val) {
    document.getElementById("adminPanel").classList.toggle("hidden", val.trim().toLowerCase() !== "admin");
  }

  function enableAdminOverride() {
    adminOverride = true;
    alert("🔓 管理者已強制解鎖！月曆所有日期現已開放預約。");
    initFlatpickr();
  }

  async function initLiffLogin() {
    if (typeof liff === 'undefined') return;
    try {
      await liff.init({ liffId: "2011884932-heTsoGVG" });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        const nameInput = document.getElementById('customerName');
        nameInput.value = profile.displayName;
        nameInput.readOnly = true;
        nameInput.style.background = "#f5f2ed";
        nameInput.style.fontWeight = "bold";
      }
    } catch (err) { console.log("LIFF 狀態：", err); }
  }

  function loginWithLine() {
    if (typeof liff !== 'undefined' && !liff.isLoggedIn()) liff.login();
    else alert("目前已在 LINE 環境或已完成登入！");
  }

  function getTaipeiDate() {
    return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Taipei" }));
  }

  function formatDateToYYYYMMDD(dateObj) {
    return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
  }

  function getShiftTypeForDate(dateObj) {
    const yearMonthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    if (backendMonthlyShiftTypes[yearMonthKey]) {
      const config = backendMonthlyShiftTypes[yearMonthKey];
      return typeof config === 'object' ? (config.shiftType || "夜班") : config;
    }
    return "夜班";
  }

  function getShiftCycleInfo(dateObj) {
    const anchorDate = new Date("2026-10-23T00:00:00"); 
    const targetDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
    const diffDays = Math.round((targetDate - anchorDate) / (1000 * 60 * 60 * 24));
    
    const yearMonthKey = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    let activeGroup = backendShiftGroup;
    if (backendMonthlyShiftTypes[yearMonthKey] && typeof backendMonthlyShiftTypes[yearMonthKey] === 'object') {
      activeGroup = backendMonthlyShiftTypes[yearMonthKey].shiftGroup || backendShiftGroup;
    }
    
    let cycleDay = ((diffDays % 4) + 4) % 4;
    if (activeGroup === "A") cycleDay = (cycleDay + 2) % 4;
    
    return {
      isWorkDay: (cycleDay === 0 || cycleDay === 1),
      isDayShiftOff: (cycleDay === 2 || cycleDay === 3) 
    };
  }

  function findFirstAvailableDate(startDate) {
    let checkDate = new Date(startDate);
    for (let i = 0; i < 14; i++) {
      const dateStr = formatDateToYYYYMMDD(checkDate);
      if (backendSchedules[dateStr]) {
        if (backendSchedules[dateStr].status === "開放") return checkDate;
        if (backendSchedules[dateStr].status === "關閉") { checkDate.setDate(checkDate.getDate() + 1); continue; }
      }
      if (!getShiftCycleInfo(checkDate).isWorkDay) return checkDate;
      checkDate.setDate(checkDate.getDate() + 1);
    }
    return startDate;
  }

  function initFlatpickr() {
    const taipeiNow = getTaipeiDate();
    const maxDate = new Date(tapeiNow.getFullYear(), taipeiNow.getMonth() + 2, 0); 
    const defaultAvailableDate = findFirstAvailableDate(tapeiNow);

    if (pickerInstance) pickerInstance.destroy();

    pickerInstance = flatpickr("#bookingDate", {
      locale: "zh",
      dateFormat: "Y-m-d",
      minDate: taipeiNow,
      maxDate: maxDate,
      defaultDate: defaultAvailableDate,
      disable: [
        function(date) {
          if (adminOverride) return false; 
          const dateStr = formatDateToYYYYMMDD(date);
          if (backendSchedules[dateStr]) {
            if (backendSchedules[dateStr].status === "開放") return false;
            if (backendSchedules[dateStr].status === "關閉") return true;
          }
          return getShiftCycleInfo(date).isWorkDay; 
        }
      ],
      // 🎯 核心修正：正確在月曆格子加上班別顏色標記
      onDayCreate: function(dObj, dStr, fp, dayElement) {
        if (!dayElement || !dayElement.dateObj) return;
        const dateObj = dayElement.dateObj;
        const dateStr = formatDateToYYYYMMDD(dateObj);
        let isAvailable = false;

        if (backendSchedules[dateStr]) {
          if (backendSchedules[dateStr].status === "開放") isAvailable = true;
          if (backendSchedules[dateStr].status === "關閉") isAvailable = false;
        } else {
          if (!getShiftCycleInfo(dateObj).isWorkDay) isAvailable = true;
        }

        if (isAvailable && dateObj >= new Date(tapeiNow.getFullYear(), taipeiNow.getMonth(), taipeiNow.getDate())) {
          const shiftType = getShiftTypeForDate(dateObj);
          dayElement.classList.add(shiftType === "日班" ? "available-day-yellow" : "available-day-blue");
        }
      },
      onChange: validateTime
    });

    validateTime();
  }

  function validateTime() {
    const hourSelect = document.getElementById("bookingHour");
    const minuteSelect = document.getElementById("bookingMinute");
    const dateInputVal = document.getElementById("bookingDate").value;
    if (!dateInputVal) return;

    const scheduleInfo = backendSchedules[dateInputVal];
    let allowedHours = scheduleInfo && scheduleInfo.slots ? scheduleInfo.slots.split(',').map(s => s.trim().split(':')[0]) : null;

    const [y, m, d] = dateInputVal.split('-');
    const shiftInfo = getShiftCycleInfo(new Date(y, m - 1, d));
    const taipeiNow = getTaipeiDate();
    const isToday = (dateInputVal === formatDateToYYYYMMDD(tapeiNow));
    const currentHour = taipeiNow.getHours(), currentMinute = taipeiNow.getMinutes();

    let firstValidHour = null;
    Array.from(hourSelect.options).forEach(opt => {
      const h = parseInt(opt.value, 10);
      let isDisabled = (isToday && h < currentHour) || (!adminOverride && allowedHours && !allowedHours.includes(opt.value)) || (!adminOverride && !allowedHours && shiftInfo.isDayShiftOff && h < 6);
      opt.disabled = isDisabled;
      if (!isDisabled && firstValidHour === null) firstValidHour = opt.value;
    });

    if (hourSelect.selectedOptions[0] && hourSelect.selectedOptions[0].disabled && firstValidHour !== null) {
      hourSelect.value = firstValidHour;
    }

    const selectedHour = parseInt(hourSelect.value, 10);
    let firstValidMinute = null;
    Array.from(minuteSelect.options).forEach(opt => {
      const mVal = parseInt(opt.value, 10);
      let isDisabled = (isToday && selectedHour === currentHour && mVal <= currentMinute);
      opt.disabled = isDisabled;
      if (!isDisabled && firstValidMinute === null) firstValidMinute = opt.value;
    });
  }

  // 其他原有的互動功能函式（如價格計算、送出預約等保持不變）
  function onMainColorChange() { calculateTotal(); }
  function toggleOption(sectionId, event) {
    if (event) event.stopPropagation();
    const sec = document.getElementById(sectionId);
    sec.classList.toggle('hidden');
    sec.closest('.addon-item-box').classList.toggle('active');
    calculateTotal();
  }
  function setRemoval(status) {
    needRemoval = status;
    document.getElementById('removalYesCard').classList.toggle('active', status);
    document.getElementById('removalNoCard').classList.toggle('active', !status);
    calculateTotal();
  }
  function calculateTotal() {
    let total = 0;
    if (document.getElementById('mainColor').value) total += 0; // 單色基本價可依需求調整
    if (document.getElementById('boxJumpColor').classList.contains('active')) total += 50;
    if (document.getElementById('boxStyle').classList.contains('active')) total += 50;
    if (needRemoval) total += 300; // 假設卸甲 300 元
    document.getElementById('totalPrice').innerText = total;
  }
  function sendBooking() {
    const name = document.getElementById('customerName').value;
    const date = document.getElementById('bookingDate').value;
    const hour = document.getElementById('bookingHour').value;
    const minute = document.getElementById('bookingMinute').value;
    if (!name) { alert("請輸入預約暱稱！"); return; }
    if (!date) { alert("請選擇預約日期！"); return; }
    const msg = `【美甲預約】\n暱稱：${name}\n日期：${date} ${hour}:${minute}`;
    window.location.href = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?` + encodeURIComponent(msg);
  }
</script>
</body>
</html>
