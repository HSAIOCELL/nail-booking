<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    body {
      background-color: #efece6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
    }
    .card {
      background: #fdfbf7;
      max-width: 450px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(140, 124, 117, 0.15);
      padding: 24px;
      border: 1px solid #d8d0c5;
    }
    h2 {
      text-align: center;
      color: #5c504a;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
      border-bottom: 1px dashed #a3958d;
      padding-bottom: 10px;
      letter-spacing: 1px;
    }
    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e5decb;
    }
    .section-title {
      font-weight: bold;
      color: #6e6058;
      margin-bottom: 10px;
      font-size: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .radio-group {
      display: flex;
      gap: 15px;
    }
    label {
      font-size: 16px;
      color: #5c504a;
      cursor: pointer;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #c8beba;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #f7f4ee;
      color: #4a423d;
    }
    select:focus, input[type="text"]:focus {
      border-color: #8c7c75;
      box-shadow: 0 0 5px rgba(140, 124, 117, 0.3);
    }
    .add-btn {
      background-color: #a3958d;
      color: #ffffff;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      margin-left: 5px;
    }
    .add-btn:hover {
      background-color: #8c7c75;
    }
    .hidden {
      display: none;
    }
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .total-box {
      background-color: #e8d8ce;
      color: #5c504a;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .submit-btn {
      width: 100%;
      background-color: #8c7c75;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(140, 124, 117, 0.3);
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .submit-btn:hover {
      background-color: #6e6058;
    }
    .sub-input {
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>美甲服務預約選單</h2>

  <!-- 1. 卸甲選項 -->
  <div class="section">
    <div class="section-title">1. 卸甲服務</div>
    <div class="radio-group">
      <label><input type="radio" name="off" value="150" onchange="calculateTotal()"> 我要卸甲!</label>
      <label><input type="radio" name="off" value="0" checked onchange="calculateTotal()"> 不需要卸甲~</label>
    </div>
  </div>

  <!-- 2. 單色款式 -->
  <div class="section">
    <div class="section-title">2. 單色款式 (700元)</div>
    <select id="mainColor" onchange="calculateTotal()">
      <option value="紅色">紅色</option>
      <option value="粉色">粉色</option>
      <option value="橘色">橘色</option>
      <option value="黃色">黃色</option>
      <option value="咖色/可可色">咖色/可可色</option>
      <option value="綠色">綠色</option>
      <option value="藍色">藍色</option>
      <option value="紫色">紫色</option>
      <option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option>
      <option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- 3. 加購項目 -->
  <div class="section">
    <div class="section-title">
      3. 加購項目
      <div>
        <button class="add-btn" onclick="toggleOption('jumpColorSection')">+ 跳色 (+50)</button>
        <button class="add-btn" onclick="toggleOption('styleSection')">+ 款式造型</button>
      </div>
    </div>

    <!-- 跳色選單 -->
    <div id="jumpColorSection" class="hidden" style="margin-top: 10px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #6e6058;">跳色選擇 (+50元)：</div>
      <select id="jumpColor" onchange="calculateTotal()">
        <option value="交給琦選!">交給琦選!</option>
        <option value="紅色">紅色</option>
        <option value="粉色">粉色</option>
        <option value="橘色">橘色</option>
        <option value="黃色">黃色</option>
        <option value="咖色/可可色">咖色/可可色</option>
        <option value="綠色">綠色</option>
        <option value="藍色">藍色</option>
        <option value="紫色">紫色</option>
        <option value="黑色">黑色</option>
        <option value="銀色/白色">銀色/白色</option>
        <option value="金色/香檳色">金色/香檳色</option>
      </select>
    </div>

    <!-- 款式勾選區 -->
    <div id="styleSection" class="hidden" style="margin-top: 10px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
      <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px; color: #6e6058;">款式類型 (最多選4個)：</div>
      <div style="font-size: 12px; color: #8c7c75; margin-bottom: 8px;">(選1個 +150元 / 選2個以上 +200元)</div>
      
      <div class="checkbox-grid">
        <label><input type="checkbox" name="style" id="catEyeCb" value="貓眼(依單色)" onchange="checkLimit(this)"> 貓眼 (依單色)</label>
        <label><input type="checkbox" name="style" value="法式" onchange="checkLimit(this)"> 法式</label>
        <label><input type="checkbox" name="style" value="漸層" onchange="checkLimit(this)"> 漸層</label>
        <label><input type="checkbox" name="style" value="海莉款" onchange="checkLimit(this)"> 海莉款</label>
        <label><input type="checkbox" name="style" value="亮面銀" onchange="checkLimit(this)"> 亮面銀</label>
        <label><input type="checkbox" name="style" value="小飾品/貼紙" onchange="checkLimit(this)"> 小飾品/貼紙</label>
        <label><input type="checkbox" name="style" value="格紋" onchange="checkLimit(this)"> 格紋</label>
        <label><input type="checkbox" name="style" id="customStyleCb" value="指定圖案" onchange="checkLimit(this)"> 指定圖案</label>
      </div>
      <div id="customInputDiv" class="sub-input hidden">
        <input type="text" id="customPattern" placeholder="請填寫指定圖案細節">
      </div>
    </div>
  </div>

  <!-- 金額顯示 -->
  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">700</span> 元
  </div>

  <button class="submit-btn" onclick="sendToLine()">送出預預至 LINE</button>
</div>

<script>
  let showJumpColor = false;
  let showStyle = false;

  function toggleOption(id) {
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') {
      showJumpColor = !showJumpColor;
      el.classList.toggle('hidden', !showJumpColor);
    } else if (id === 'styleSection') {
      showStyle = !showStyle;
      el.classList.toggle('hidden', !showStyle);
    }
    calculateTotal();
  }

  function checkLimit(checkbox) {
    const checkboxes = document.querySelectorAll('input[name="style"]:checked');
    if (checkboxes.length > 4) {
      alert("款式類型最多只能勾選 4 個喔！");
      checkbox.checked = false;
    }
    
    const customCb = document.getElementById('customStyleCb');
    document.getElementById('customInputDiv').classList.toggle('hidden', !customCb.checked);

    calculateTotal();
  }

  function calculateTotal() {
    let total = 700;

    const offValue = parseInt(document.querySelector('input[name="off"]:checked').value);
    total += offValue;

    if (showJumpColor) {
      total += 50;
    }

    if (showStyle) {
      const selectedStyles = document.querySelectorAll('input[name="style"]:checked');
      const count = selectedStyles.length;
      if (count === 1) {
        total += 150;
      } else if (count >= 2) {
        total += 200;
      }
    }

    document.getElementById('totalPrice').innerText = total;
  }

  function sendToLine() {
    const offText = document.querySelector('input[name="off"]:checked').parentElement.innerText.trim();
    const mainColor = document.getElementById('mainColor').value;
    
    let details = `【美甲服務預約單】\n`;
    details += `----------------------------\n`;
    details += `• 卸甲服務：${offText}\n`;
    details += `• 單色款式：${mainColor} (700元)\n`;

    if (showJumpColor) {
      const jumpColor = document.getElementById('jumpColor').value;
      details += `• 加價跳色：${jumpColor} (+50元)\n`;
    }

    if (showStyle) {
      const selectedStyles = Array.from(document.querySelectorAll('input[name="style"]:checked')).map(cb => cb.value);
      if (selectedStyles.length > 0) {
        if (selectedStyles.includes('指定圖案')) {
          const customText = document.getElementById('customPattern').value || '未填寫';
          const idx = selectedStyles.indexOf('指定圖案');
          selectedStyles[idx] = `指定圖案(${customText})`;
        }
        const stylePrice = selectedStyles.length === 1 ? '150元' : '200元';
        details += `• 款式造型：${selectedStyles.join('、')} (+${stylePrice})\n`;
      }
    }

    const finalPrice = document.getElementById('totalPrice').innerText;
    details += `----------------------------\n`;
    details += `💰 預計總金額：NT$ ${finalPrice} 元`;

    const lineShareUrl = `https://line.me/R/share?text=${encodeURIComponent(details)}`;
    window.location.href = lineShareUrl;
  }
</script>

</body>
</html>
