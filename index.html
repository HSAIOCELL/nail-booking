<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>

  <style>
    body {
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
    }
    label {
      font-size: 15.5px;
      color: #524741;
      cursor: pointer;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
    }

    .flatpickr-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff !important;
      color: #4a423d;
      cursor: pointer;
    }

    .flatpickr-calendar {
      background: #faf8f5 !important;
      border: 1px solid #e2dad1 !important;
      border-radius: 14px !important;
    }

    .flatpickr-day.available-day-yellow {
      background-color: #fdf6e2 !important;
      color: #a37512 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #f2d896 !important;
    }
    .flatpickr-day.available-day-blue {
      background-color: #e5ece9 !important;
      color: #4c6b61 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #b8c9c4 !important;
    }

    .datetime-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-picker-group select {
      flex: 1;
      text-align: center;
    }

    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover { background-color: #5c5049; }
  </style>
</head>
<body>

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <div class="section">
    <div class="section-title">預約暱稱</div>
    <input type="text" id="customerName" placeholder="請輸入您的預約暱稱">
  </div>

  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="text" id="bookingDate" placeholder="請選擇預約日期">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour" onchange="validateTime()">
            <option value="00">00 時</option><option value="01">01 時</option><option value="02">02 時</option>
            <option value="03">03 時</option><option value="04">04 時</option><option value="05">05 時</option>
            <option value="06">06 時</option><option value="07">07 時</option><option value="08">08 時</option>
            <option value="09">09 時</option><option value="10">10 時</option><option value="11">11 時</option>
            <option value="12">12 時</option><option value="13">13 時</option><option value="14">14 時</option>
            <option value="15">15 時</option><option value="16">16 時</option><option value="17">17 時</option>
            <option value="18">18 時</option><option value="19">19 時</option><option value="20">20 時</option>
            <option value="21">21 時</option><option value="22">22 時</option><option value="23">23 時</option>
          </select>
          <select id="bookingMinute" onchange="validateTime()">
            <option value="00">00 分</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="45">45 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">預約項目與金額</div>
    <input type="text" id="bookingItems" placeholder="輸入項目 (例: 單色光療 或 卸甲)" style="margin-bottom: 8px;">
    <input type="number" id="bookingPrice" placeholder="金額 (NT$)" value="700">
  </div>

  <button class="submit-btn" onclick="sendBooking()">送出預約單 (開啟 LINE)</button>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LINE_OFFICIAL_ACCOUNT_ID = "@344gjuzg"; 
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec?action=api";

  let backendShiftGroup = "B";
  let backendShiftType = "夜班"; 
  let backendMonthlyShiftTypes = {}; 
  let backendSchedules = {};
  let globalBookings = [];

  document.addEventListener('DOMContentLoaded', () => {
    fetchBackendConfigAndInit();
  });

  async function fetchBackendConfigAndInit() {
    try {
      const res = await fetch(SCRIPT_URL, { method: 'GET', mode: 'cors' });
      const data = await res.json();
      if (data.shiftGroup) backendShiftGroup = data.shiftGroup;
      if (data.shiftType) backendShiftType = data.shiftType;
      if (data.schedules) backendSchedules = data.schedules;
      if (data.monthlyShiftTypes) backendMonthlyShiftTypes = data.monthlyShiftTypes; 
      if (data.bookings) globalBookings = data.bookings;
    } catch (e) {
      console.error("無法取得後端資料", e);
    }
    initFlatpickr();
  }

  function getShiftCycleInfo(dateObj) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const yearMonth = `${year}-${month}`;
    const monthConfig = backendMonthlyShiftTypes[yearMonth];
    const currentGroup = monthConfig ? monthConfig.shiftGroup : backendShiftGroup;
    const currentType = monthConfig ? monthConfig.shiftType : backendShiftType;

    const anchorDate = new Date("2026-10-23T00:00:00"); 
    const targetDate = new Date(year, dateObj.getMonth(), dateObj.getDate());
    const diffDays = Math.round((targetDate - anchorDate) / (1000 * 60 * 60 * 24));
    
    let cycleDay = ((diffDays % 4) + 4) % 4;
    if (currentGroup === "A") cycleDay = (cycleDay + 2) % 4;
    
    return {
      isWorkDay: (cycleDay === 0 || cycleDay === 1),
      shiftType: currentType 
    };
  }

  function getTaipeiDate() {
    const now = new Date();
    const taipeiStr = now.toLocaleString("en-US", { timeZone: "Asia/Taipei" });
    return new Date(taipeiStr);
  }

  function formatDateToYYYYMMDD(dateObj) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function initFlatpickr() {
    const taipeiNow = getTaipeiDate();
    const maxDate = new Date(taipeiNow.getFullYear(), taipeiNow.getMonth() + 2, 0);

    flatpickr("#bookingDate", {
      locale: "zh",
      dateFormat: "Y-m-d",
      minDate: taipeiNow,
      maxDate: maxDate,
      disable: [
        function(date) {
          const dateStr = formatDateToYYYYMMDD(date);
          if (backendSchedules[dateStr]) {
            if (backendSchedules[dateStr].status === "開放") return false;
            if (backendSchedules[dateStr].status === "關閉") return true;
          }
          const shiftInfo = getShiftCycleInfo(date);
          return shiftInfo.isWorkDay;
        }
      ],
      onDayCreate: function(dObj, dStr, fp, dayElement) {
        const dateStr = formatDateToYYYYMMDD(dayElement.dateObj);
        let isAvailable = false;
        if (backendSchedules[dateStr]) {
          if (backendSchedules[dateStr].status === "開放") isAvailable = true;
        } else {
          const shiftInfo = getShiftCycleInfo(dayElement.dateObj);
          if (!shiftInfo.isWorkDay) isAvailable = true;
        }
        if (isAvailable && dayElement.dateObj >= taipeiNow) {
          const shiftInfo = getShiftCycleInfo(dayElement.dateObj);
          const availableClassName = (shiftInfo.shiftType === "白班") ? "available-day-yellow" : "available-day-blue";
          dayElement.classList.add(availableClassName);
        }
      },
      onChange: function() {
        validateTime();
      }
    });
    validateTime();
  }

  // 智慧時間鎖定：若是卸甲服務鎖定2小時，其餘鎖定5小時
  function isTimeBlocked(dateStr, hour, minute) {
    let candidateMinutes = hour * 60 + minute;
    for (let b of globalBookings) {
      if (b.date === dateStr && b.status !== "已取消") {
        let [bh, bm] = b.time.split(':').map(Number);
        let bStart = bh * 60 + bm;
        
        let lockHours = (b.items && b.items.includes("卸甲")) ? 2 : 5;
        let bEnd = bStart + lockHours * 60; 

        if (candidateMinutes >= bStart && candidateMinutes < bEnd) {
          return true;
        }
      }
    }
    return false;
  }

  function validateTime() {
    const hourSelect = document.getElementById("bookingHour");
    const minuteSelect = document.getElementById("bookingMinute");
    const dateInputVal = document.getElementById("bookingDate").value;

    if (!dateInputVal) return;

    const taipeiNow = getTaipeiDate();
    const todayStr = formatDateToYYYYMMDD(taipeiNow);
    const currentHour = taipeiNow.getHours();
    const currentMinute = taipeiNow.getMinutes();
    const isToday = (dateInputVal === todayStr);

    let firstValidHour = null;
    Array.from(hourSelect.options).forEach(opt => {
      const h = parseInt(opt.value, 10);
      let isDisabled = false;

      if (isToday && h < currentHour) {
        isDisabled = true;
      }

      let availableMinCount = 0;
      Array.from(minuteSelect.options).forEach(mOpt => {
        const m = parseInt(mOpt.value, 10);
        if (!(isToday && h === currentHour && m <= currentMinute) && !isTimeBlocked(dateInputVal, h, m)) {
          availableMinCount++;
        }
      });

      if (availableMinCount === 0) {
        isDisabled = true;
        opt.style.display = "none"; 
      } else {
        opt.style.display = "block";
      }

      opt.disabled = isDisabled;
      if (!isDisabled && firstValidHour === null) firstValidHour = opt.value;
    });

    if (hourSelect.selectedOptions[0] && hourSelect.selectedOptions[0].disabled) {
      if (firstValidHour !== null) hourSelect.value = firstValidHour;
    }

    const selectedHour = parseInt(hourSelect.value, 10);
    let firstValidMinute = null;
    Array.from(minuteSelect.options).forEach(opt => {
      const m = parseInt(opt.value, 10);
      let isBlocked = (isToday && selectedHour === currentHour && m <= currentMinute) || isTimeBlocked(dateInputVal, selectedHour, m);
      
      opt.disabled = isBlocked;
      if (isBlocked) {
        opt.style.display = "none"; 
      } else {
        opt.style.display = "block";
        if (firstValidMinute === null) firstValidMinute = opt.value;
      }
    });

    if (minuteSelect.selectedOptions[0] && minuteSelect.selectedOptions[0].disabled) {
      if (firstValidMinute !== null) minuteSelect.value = firstValidMinute;
    }
  }

  function sendBooking() {
    const customerName = document.getElementById('customerName').value.trim();
    const bookingDate = document.getElementById('bookingDate').value;
    const hour = document.getElementById('bookingHour').value;
    const minute = document.getElementById('bookingMinute').value;
    const items = document.getElementById('bookingItems').value.trim();
    const price = document.getElementById('bookingPrice').value;

    if (!customerName || !bookingDate || !items) {
      alert("請填寫完整預約資訊！");
      return;
    }

    const bookingTime = `${hour}:${minute}`;
    const bookingData = {
      bookingId: 'M' + Date.now().toString().slice(-6),
      customerName: customerName,
      date: bookingDate,
      time: bookingTime,
      items: items,
      totalPrice: parseInt(price, 10) || 700
    };

    fetch(SCRIPT_URL.replace('?action=api', ''), {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(bookingData)
    })
    .then(() => {
      let details = `【美甲服務預約單】\n• 預約暱稱：${customerName}\n• 預約時間：${bookingDate} ${bookingTime}\n• 項目：${items}\n• 金額：NT$ ${price}`;
      const lineUrl = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?${encodeURIComponent(details)}`;
      window.location.href = lineUrl;
    });
  }
</script>
</body>
</html>
