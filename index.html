<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <!-- 引入 Flatpickr 視覺化月曆套件 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>

  <style>
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "NT$    $    NT$    $\n$    NT$    $    NT$\nNT$    $    NT$    $\n$NT$    $    NT$    $";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root {
      color-scheme: light;
    }

    input[type="checkbox"], 
    input[type="radio"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    /* 15號提醒橫幅 */
    #frontendReminder {
      display: none;
      background: #fffae6;
      border: 1px solid #ffe58f;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      text-align: center;
      color: #d48806;
      font-size: 14px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }

    .section.disabled-step {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(40%);
    }

    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-size: 15.5px;
      color: #524741;
      cursor: pointer;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff;
      color: #4a423d;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus {
      border-color: #7a6b63;
      box-shadow: 0 0 4px rgba(122, 107, 99, 0.25);
    }

    .flatpickr-input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #ffffff !important;
      color: #4a423d;
      cursor: pointer;
    }

    .flatpickr-calendar {
      background: #faf8f5 !important;
      border: 1px solid #e2dad1 !important;
      box-shadow: 0 10px 25px rgba(120, 108, 100, 0.15) !important;
      border-radius: 14px !important;
      font-family: inherit !important;
    }
    .flatpickr-day.available-day {
      background-color: #fdf6e2 !important;
      color: #a37512 !important;
      font-weight: bold !important;
      border-radius: 50% !important;
      border: 1px solid #f2d896 !important;
    }
    .flatpickr-day.available-day.selected {
      background-color: #7a6b63 !important;
      color: #ffffff !important;
      border-color: #5c5049 !important;
    }
    .flatpickr-day.flatpickr-disabled, .flatpickr-day.flatpickr-disabled:hover {
      color: #d1c7bd !important;
      background: transparent !important;
      text-decoration: line-through;
      opacity: 0.4;
    }

    @keyframes selectFlash {
      0% { border-color: #7a6b63; box-shadow: 0 0 0 3px rgba(122, 107, 99, 0.4); background-color: #ffffff; }
      50% { border-color: #a8988e; box-shadow: 0 0 0 5px rgba(122, 107, 99, 0.6); background-color: #eae1d7; }
      100% { border-color: #cfc5bb; box-shadow: none; background-color: #ffffff; }
    }
    .flash-highlight {
      animation: selectFlash 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 8px;
    }

    .datetime-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-picker-group select {
      flex: 1;
      text-align: center;
    }

    .tone-palette-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 6px 4px;
    }
    .tone-option {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 20px;
      transition: all 0.25s ease;
      user-select: none;
      white-space: nowrap;
    }
    .tone-option:hover {
      background-color: rgba(240, 236, 227, 0.6);
    }
    .color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      box-sizing: border-box;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      flex-shrink: 0;
      background-color: #e8e0d5; 
      border: 1.5px solid #d4c7b8;
    }
    .tone-label {
      font-size: 15px;
      color: #8c7c75;
      font-weight: 500;
      white-space: nowrap;
      transition: color 0.25s ease, font-weight 0.25s ease;
    }
    .tone-option.active .color-dot {
      background-color: #7a6b63;
      border-color: #5c5049;
      transform: scale(1.15);
      box-shadow: 0 0 0 2.5px #faf8f5, 0 0 0 4.5px #7a6b63;
    }
    .tone-option.active .tone-label {
      color: #3d3028;
      font-weight: 700;
    }

    .addon-item-box {
      border: 1.5px dashed #c2b5aa;
      background-color: #fcfaf7;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .addon-item-box:hover {
      border-color: #827167;
      background-color: #f5efe8;
    }
    .addon-item-box.active {
      border-style: solid;
      border-color: #7a6b63;
      background-color: #f2ebe4;
      box-shadow: 0 2px 8px rgba(122, 107, 99, 0.12);
    }
    .addon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      color: #5c5049;
    }
    .addon-badge {
      font-size: 13px;
      background-color: #e5ded7;
      color: #6e6057;
      padding: 3px 10px;
      border-radius: 20px;
      transition: all 0.2s ease;
    }
    .addon-item-box.active .addon-badge {
      background-color: #7a6b63;
      color: #ffffff;
    }

    .removal-card-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .removal-card {
      flex: 1;
      border: 1.5px dashed #c2b5aa;
      background-color: #fcfaf7;
      border-radius: 12px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .removal-card:hover {
      border-color: #827167;
      background-color: #f5efe8;
    }
    .removal-card.active {
      border-style: solid;
      border-color: #bdaca2;
      background-color: #f2ebe4;
      transform: scale(1.03);
      box-shadow: 0 4px 12px rgba(122, 107, 99, 0.15);
    }
    .removal-card-title {
      font-size: 16.5px;
      font-weight: bold;
      color: #4e423b;
      margin: 0;
    }

    .draw-btn {
      background-color: #e4dcd3;
      color: #4a423d;
      border: 1px solid #c9bebc;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .draw-btn:hover {
      background-color: #d7ccc3;
      transform: translateY(-1px);
    }

    .hidden {
      display: none !important;
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 8px 10px;
      padding: 10px;
      background-color: #ffffff;
      border-radius: 12px;
      border: 1px solid #ebdcd3;
    }

    .chip-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      border-radius: 20px;
      background-color: transparent; 
      border: none;                 
      color: #524741;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      user-select: none;
      text-align: center;
      white-space: nowrap;
    }

    .chip-item input[type="checkbox"],
    .chip-item input[type="radio"] {
      display: none;
    }

    .chip-item::before {
      content: "";
      display: inline-block;
      width: 0;
      opacity: 0;
      transition: all 0.2s ease;
      margin-right: 0;
    }

    .chip-item:hover {
      background-color: #f5efe8; 
      border-radius: 20px;
    }

    .chip-item:has(input:checked) {
      background-color: #7a6b63;
      border-color: #5c5049;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(122, 107, 99, 0.25);
    }

    .chip-item:has(input:checked)::before {
      content: "✓";
      width: 14px;
      opacity: 1;
      margin-right: 4px;
      font-weight: bold;
    }
    
    .total-box {
      background-color: #ebdcd3;
      color: #4e423b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2);
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .submit-btn:hover {
      background-color: #5c5049;
    }
    .sub-input {
      margin-top: 8px;
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <!-- 15號提醒橫幅 -->
  <div id="frontendReminder">
    ⚠️ 貼心提醒：目前正值 15 號至 20 號期間，請留意下兩個月的最新班表與預約動態！
  </div>

  <!-- 貴賓稱呼 -->
  <div class="section">
    <div class="section-title">您的稱呼</div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="customerName" placeholder="請輸入您的稱呼" style="flex: 1;">
      <button type="button" class="draw-btn" onclick="loginWithLine()" style="white-space: nowrap; background: #06c755; color: #fff; border: none;">連動 LINE 暱稱</button>
    </div>
  </div>

  <!-- Step 1. 預約日期與時間 -->
  <div class="section">
    <div class="section-title">Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="text" id="bookingDate" placeholder="請選擇預約日期">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour" onchange="validateTime()">
            <option value="10">10 時</option><option value="12">12 時</option>
            <option value="14">14 時</option><option value="16">16 時</option>
            <option value="18">18 時</option><option value="20">20 時</option>
          </select>
          <select id="bookingMinute" onchange="validateTime()">
            <option value="00">00 分</option>
            <option value="30">30 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Step 2. 單色款式 -->
  <div class="section">
    <div class="section-title">
      Step 2. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🫯 幫我抽色系</button>
    </div>
    <select id="mainColor" onchange="onMainColorChange()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="紅色">紅色</option>
      <option value="粉色">粉色</option>
      <option value="橘色">橘色</option>
      <option value="黃色">黃色</option>
      <option value="紅咖色">紅咖色</option>
      <option value="深咖/可可色">深咖/可可色</option>
      <option value="淺咖色">淺咖色</option>
      <option value="綠色">綠色</option>
      <option value="藍色">藍色</option>
      <option value="紫色">紫色</option>
      <option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option>
      <option value="灰色">灰色</option>
      <option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- Step 3. 加購項目 -->
  <div class="section disabled-step" id="step3Section">
    <div style="font-weight: bold; color: #5c5049; margin-bottom: 12px; font-size: 16.5px;">
      Step 3. 加購項目
    </div>

    <!-- 跳色 -->
    <div id="boxJumpColor" class="addon-item-box" onclick="toggleOption('jumpColorSection', event)">
      <div class="addon-header">
        <span>🎨 跳色</span>
        <span id="badgeJumpColor" class="addon-badge">50 元 ➕</span>
      </div>
      <div id="jumpColorSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div style="font-size: 13.5px; font-weight: bold; color: #5c5049;">選擇色系：</div>
          <button class="draw-btn" onclick="drawSmartJumpColor(event)">🫯 隨機配色</button>
        </div>
        <div>
          <select id="jumpColor" onchange="onSelectionChange()">
            <option value="">--請選擇跳色色系--</option>
            <option value="紅色">紅色</option>
            <option value="粉色">粉色</option>
            <option value="橘色">橘色</option>
            <option value="黃色">黃色</option>
            <option value="紅咖色">紅咖色</option>
            <option value="深咖/可可色">深咖/可可色</option>
            <option value="淺咖色">淺咖色</option>
            <option value="綠色">綠色</option>
            <option value="藍色">藍色</option>
            <option value="紫色">紫色</option>
            <option value="黑色">黑色</option>
            <option value="銀色/白色">銀色/白色</option>
            <option value="灰色">灰色</option>
            <option value="金色/香檳色">金色/香檳色</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 款式造型 -->
    <div id="boxStyle" class="addon-item-box" onclick="toggleOption('styleSection', event)">
      <div class="addon-header">
        <span>✨ 款式造型</span>
        <span id="badgeStyle" class="addon-badge">50元起 ➕</span>
      </div>
      <div id="styleSection" class="hidden" style="margin-top: 10px;" onclick="event.stopPropagation()">
        <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
          <button class="draw-btn" onclick="drawStyle(event)">🫯 幫我抽款式</button>
        </div>

        <div class="removal-card-group" style="margin-top: 0; margin-bottom: 12px; gap: 8px;">
          <div id="typePartialCard" class="removal-card" onclick="setStyleType('partial')" style="padding: 10px; font-size: 15px;">
            <div class="removal-card-title" style="font-size: 15px;">局部造型</div>
          </div>
          <div id="typeFullCard" class="removal-card" onclick="setStyleType('full')" style="padding: 10px; font-size: 15px;">
            <div class="removal-card-title" style="font-size: 15px;">十指造型</div>
          </div>
        </div>
        <input type="radio" name="styleType" value="partial" id="radioPartial" style="display:none;">
        <input type="radio" name="styleType" value="full" id="radioFull" style="display:none;">
        
        <div id="partialStyleGroup" class="hidden">
          <div style="font-size: 12px; color: #8c7c75; margin-bottom: 4px; font-weight: 500;">(至多5指造型+5指以上單色/跳色)</div>
          <div class="checkbox-grid" style="margin-bottom: 12px;">
            <label class="chip-item"><input type="checkbox" name="style" id="catEyeCb" value="貓眼" onchange="checkLimit(this)">貓眼</label>
            <label class="chip-item"><input type="checkbox" name="style" value="立體不規則造型" onchange="checkLimit(this)">立體不規則造型</label>
            <label class="chip-item"><input type="checkbox" name="style" value="法式" onchange="checkLimit(this)">法式</label>
            <label class="chip-item"><input type="checkbox" name="style" value="鏡面銀" onchange="checkLimit(this)">鏡面銀</label>
            <label class="chip-item"><input type="checkbox" name="style" value="漸層" onchange="checkLimit(this)">漸層</label>
            <label class="chip-item"><input type="checkbox" name="style" value="小飾品/貼紙" onchange="checkLimit(this)">小飾品/貼紙</label>
            <label class="chip-item"><input type="checkbox" name="style" value="格紋" onchange="checkLimit(this)">格紋</label>
            <label class="chip-item"><input type="checkbox" name="style" value="暈染" onchange="checkLimit(this)">暈染</label>
            <label class="chip-item"><input type="checkbox" name="style" value="海莉款" onchange="checkLimit(this)">海莉款</label>
            <label class="chip-item"><input type="checkbox" name="style" id="customStyleCb" value="指定圖案" onchange="checkLimit(this)">指定圖案</label>
          </div>
        </div>

        <div id="fullStyleGroup" class="hidden">
          <div style="font-size: 12px; color: transparent; margin-bottom: 4px; user-select: none; pointer-events: none;">(佔位)</div>
          <div class="checkbox-grid" style="margin-bottom: 12px;">
            <label class="chip-item"><input type="checkbox" name="fullStyle" id="fullCatEyeCb" value="貓眼" onchange="checkFullLimit(this)">貓眼</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="立體不規則造型" onchange="checkFullLimit(this)">立體不規則造型</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="法式" onchange="checkFullLimit(this)">法式</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="鏡面銀" onchange="checkFullLimit(this)">鏡面銀</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="漸層" onchange="checkFullLimit(this)">漸層</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="小飾品/貼紙" onchange="checkFullLimit(this)">小飾品/貼紙</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="格紋" onchange="checkFullLimit(this)">格紋</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="暈染" onchange="checkFullLimit(this)">暈染</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" value="海莉款" onchange="checkFullLimit(this)">海莉款</label>
            <label class="chip-item"><input type="checkbox" name="fullStyle" id="fullCustomStyleCb" value="指定圖案" onchange="checkFullLimit(this)">指定圖案</label>
          </div>
        </div>

        <div id="catEyeDetailDiv" class="sub-input hidden">
          <label style="font-size: 13px; font-weight: bold; color: #5c5049;">貓眼類型：</label>
          <select id="catEyeType" style="background-color: #ffffff; font-weight: bold;">
            <option value="指定單色貓眼">指定單色貓眼</option>
            <option value="雙色貓眼">雙色貓眼</option>
          </select>
        </div>

        <div id="customInputDiv" class="sub-input hidden">
          <input type="text" id="customPattern" placeholder="請填寫指定圖案細節 (必填)">
        </div>
      </div>
    </div>
  </div>

  <!-- Step 4. 色調 -->
  <div class="section disabled-step" id="step4Section">
    <div class="section-title">Step 4. 色調</div>
    <div class="tone-palette-group">
      <div class="tone-option active" onclick="selectToneDot(this, '隨機')">
        <span class="color-dot"></span>
        <span class="tone-label">隨機</span>
      </div>
      <div class="tone-option" onclick="selectToneDot(this, '個性暗色調')">
        <span class="color-dot"></span>
        <span class="tone-label">個性暗色調</span>
      </div>
      <div class="tone-option" onclick="selectToneDot(this, '清透亮色調')">
        <span class="color-dot"></span>
        <span class="tone-label">清透亮色調</span>
      </div>
    </div>
    <input type="hidden" id="selectedTone" value="隨機">
  </div>

  <!-- Step 5. 卸甲服務 -->
  <div class="section">
    <div class="section-title">Step 5. 卸甲服務</div>
    <div class="removal-card-group">
      <div id="removalYesCard" class="removal-card" onclick="setRemoval(true)">
        <div class="removal-card-title">需要卸甲</div>
      </div>
      <div id="removalNoCard" class="removal-card active" onclick="setRemoval(false)">
        <div class="removal-card-title">不需要</div>
      </div>
    </div>
  </div>

  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">0</span> 元
  </div>

  <button class="submit-btn" onclick="sendBooking()">送出預約單 (開啟 LINE)</button>
</div>

<!-- 引入 LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
  const LINE_OFFICIAL_ACCOUNT_ID = "@344gjuzg"; 
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";

  let backendAnchorDate = "2026-10-23";
  let backendSchedules = {}; // 儲存後台傳來的排班覆寫與時段

  document.addEventListener('DOMContentLoaded', () => {
    checkFrontendReminder();
    initLiffLogin();
    fetchBackendConfigAndInit();
  });

  function checkFrontendReminder() {
    const todayDay = new Date().getDate();
    if (todayDay >= 15 && todayDay <= 20) {
      document.getElementById('frontendReminder').style.display = "block";
    }
  }

  // 讀取後端設定與排班狀態
  async function fetchBackendConfigAndInit() {
    try {
      const res = await fetch(SCRIPT_URL);
      const data = await res.json();
      if (data.anchorDate) backendAnchorDate = data.anchorDate;
      if (data.schedules) backendSchedules = data.schedules;
    } catch (e) {
      console.error("無法取得後端排班設定，使用預設值", e);
    }
    initFlatpickr();
  }

  // 檢查是否為 20 號後自動進入下兩個月循環
  function getAdjustedAnchor() {
    let anchor = new Date(backendAnchorDate + "T000000");
    const now = new Date();
    // 如果今天大於或等於每個月 20 號，自動把基準日往後推一個月
    if (now.getDate() >= 20) {
      anchor.setMonth(anchor.getMonth() + 1);
    }
    return anchor;
  }

  // 判斷某一天是否為上班日或休假日
  function getShiftCycleInfo(dateObj) {
    const anchorDate = getAdjustedAnchor();
    const targetDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
    const diffDays = Math.round((targetDate - anchorDate) / (1000 * 60 * 60 * 24));
    const cycleDay = ((diffDays % 4) + 4) % 4;
    
    return {
      isWorkDay: (cycleDay === 0 || cycleDay === 1)
    };
  }

  function formatDateToYYYYMMDD(dateObj) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function getTaipeiDate() {
    const now = new Date();
    const taipeiStr = now.toLocaleString("en-US", { timeZone: "Asia/Taipei" });
    return new Date(taipeiStr);
  }

  // 初始化日曆 (限制為當月與下個月共兩個月)
  function initFlatpickr() {
    const taipeiNow = getTaipeiDate();
    const maxDate = new Date(taipeiNow.getFullYear(), taipeiNow.getMonth() + 2, 0); // 下個月月底

    flatpickr("#bookingDate", {
      locale: "zh",
      dateFormat: "Y-m-d",
      minDate: taipeiNow,
      maxDate: maxDate, // 嚴格限制只能選當月與下個月
      disable: [
        function(date) {
          const dateStr = formatDateToYYYYMMDD(date);
          
          // 1. 優先檢查後台手動排班覆寫
          if (backendSchedules[dateStr]) {
            const status = backendSchedules[dateStr].status;
            if (status === "開放") return false; // 強制開放（可選）
            if (status === "關閉") return true;  // 強制關閉（反灰）
          }

          // 2. 預設做二休二循環邏輯
          const shiftInfo = getShiftCycleInfo(date);
          return shiftInfo.isWorkDay; // 上班日反灰
        }
      ],
      onDayCreate: function(dObj, dStr, fp, dayElement) {
        const dateStr = formatDateToYYYYMMDD(dayElement.dateObj);
        let isAvailable = false;

        if (backendSchedules[dateStr]) {
          if (backendSchedules[dateStr].status === "開放") isAvailable = true;
        } else {
          const shiftInfo = getShiftCycleInfo(dayElement.dateObj);
          if (!shiftInfo.isWorkDay) isAvailable = true;
        }

        if (isAvailable && dayElement.dateObj >= taipeiNow) {
          dayElement.classList.add("available-day"); // 可預約日反黃圈圈
        }
      },
      onChange: function() {
        validateTime();
      }
    });

    validateTime();
  }

  // 根據後台設定動態過濾時段
  function validateTime() {
    const dateInputVal = document.getElementById("bookingDate").value;
    const hourSelect = document.getElementById("bookingHour");
    if (!dateInputVal) return;

    // 檢查該日期是否有後台設定的指定時段
    const scheduleInfo = backendSchedules[dateInputVal];
    let allowedHours = null;
    if (scheduleInfo && scheduleInfo.slots) {
      allowedHours = scheduleInfo.slots.split(',').map(s => s.trim().split(':')[0]);
    }

    Array.from(hourSelect.options).forEach(opt => {
      if (allowedHours) {
        // 如果後台指定了特定時段，只開啟指定的鐘點
        opt.disabled = !allowedHours.includes(opt.value);
      } else {
        opt.disabled = false;
      }
    });
  }

  // LINE LIFF 自動授權登入
  async function initLiffLogin() {
    const nameInput = document.getElementById('customerName');
    if (typeof liff === 'undefined') return;

    try {
      await liff.init({ liffId: "2011884932-heTsoGVG" });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();
        nameInput.value = profile.displayName;
        nameInput.readOnly = true;
        nameInput.style.background = "#f5f2ed";
        nameInput.style.fontWeight = "bold";
      }
    } catch (err) {
      console.log("LIFF 載入狀態：", err);
    }
  }

  function loginWithLine() {
    if (typeof liff !== 'undefined' && !liff.isLoggedIn()) {
      liff.login();
    } else {
      alert("目前已在 LINE 環境或已完成登入！");
    }
  }

  let showJumpColor = false, showStyle = false;
  let needRemoval = false;
  const ALL_COLORS = ["紅色", "粉色", "橘色", "黃色", "紅咖色", "深咖/可可色", "淺咖色", "綠色", "藍色", "紫色", "黑色", "銀色/白色", "灰色", "金色/香檳色"];

  function onMainColorChange() {
    const mainColorVal = document.getElementById('mainColor').value;
    const step3 = document.getElementById('step3Section');
    const step4 = document.getElementById('step4Section');

    if (mainColorVal !== "") {
      step3.classList.remove('disabled-step');
      step4.classList.remove('disabled-step');
    } else {
      step3.classList.add('disabled-step');
      step4.classList.add('disabled-step');
      showJumpColor = false;
      showStyle = false;
      document.getElementById('jumpColorSection').classList.add('hidden');
      document.getElementById('styleSection').classList.add('hidden');
      document.getElementById('boxJumpColor').classList.remove('active');
      document.getElementById('boxStyle').classList.remove('active');
      document.getElementById('badgeJumpColor').innerText = '50 元 ➕';
      document.getElementById('badgeStyle').innerText = '50元起 ➕';
      document.getElementById('jumpColor').value = "";
    }
    onSelectionChange();
  }

  function selectToneDot(element, value) {
    document.querySelectorAll('.tone-option').forEach(opt => opt.classList.remove('active'));
    element.classList.add('active');
    document.getElementById('selectedTone').value = value;
  }

  function setRemoval(status) {
    needRemoval = status;
    document.getElementById('removalYesCard').classList.toggle('active', needRemoval);
    document.getElementById('removalNoCard').classList.toggle('active', !needRemoval);
    onSelectionChange();
  }

  function toggleOption(id, event) {
    if (event) event.stopPropagation();
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') { 
      showJumpColor = !showJumpColor; 
      el.classList.toggle('hidden', !showJumpColor); 
      document.getElementById('boxJumpColor').classList.toggle('active', showJumpColor);
      document.getElementById('badgeJumpColor').innerText = showJumpColor ? '已加購 ✔' : '50 元 ➕';
    } else if (id === 'styleSection') { 
      showStyle = !showStyle; 
      el.classList.toggle('hidden', !showStyle); 
      document.getElementById('boxStyle').classList.toggle('active', showStyle);
      document.getElementById('badgeStyle').innerText = showStyle ? '已加購 ✔' : '50元起 ➕';
    }
    onSelectionChange();
  }

  function setStyleType(type) {
    document.getElementById('radioPartial').checked = (type === 'partial');
    document.getElementById('radioFull').checked = (type === 'full');
    document.getElementById('typePartialCard').classList.toggle('active', type === 'partial');
    document.getElementById('typeFullCard').classList.toggle('active', type === 'full');
    document.getElementById('partialStyleGroup').classList.toggle('hidden', type !== 'partial');
    document.getElementById('fullStyleGroup').classList.toggle('hidden', type !== 'full');
    onSelectionChange();
  }

  function drawMainColor() {
    const select = document.getElementById('mainColor');
    select.selectedIndex = Math.floor(Math.random() * (select.options.length - 1)) + 1;
    onMainColorChange();
  }

  function drawSmartJumpColor(event) {
    if (event) event.stopPropagation();
    const jumpSelect = document.getElementById('jumpColor');
    jumpSelect.value = ALL_COLORS[Math.floor(Math.random() * ALL_COLORS.length)];
    onSelectionChange();
  }

  function drawStyle(event) {
    if (event) event.stopPropagation();
    if (!showStyle) toggleOption('styleSection');
    setStyleType(Math.random() < 0.5 ? 'partial' : 'full');
    onSelectionChange();
  }

  function checkLimit(cb) { onSelectionChange(); }
  function checkFullLimit(cb) { onSelectionChange(); }
  function onSelectionChange() { calculateTotal(); }

  function calculateTotal() {
    let total = 0;
    const mainColorVal = document.getElementById('mainColor').value;
    if (mainColorVal !== "") total += 700;
    if (showJumpColor && document.getElementById('jumpColor').value !== "") total += 50;
    if (needRemoval) total += (mainColorVal !== "" || showJumpColor || showStyle) ? 150 : 200;
    if (showStyle) {
      const type = document.querySelector('input[name="styleType"]:checked');
      if (type) {
        total += 50;
        const count = document.querySelectorAll(`input[name="${type.value === 'full' ? 'fullStyle' : 'style'}"]:checked`).length;
        total += count * 50;
      }
    }
    document.getElementById('totalPrice').innerText = total;
  }

  function sendBooking() {
    const customerName = document.getElementById('customerName').value.trim();
    const bookingDate = document.getElementById('bookingDate').value;
    if (!customerName || !bookingDate) {
      alert("請填寫您的稱呼並選擇預約日期！");
      return;
    }

    const bookingTime = `${document.getElementById('bookingHour').value}:${document.getElementById('bookingMinute').value}`;
    const totalPrice = document.getElementById('totalPrice').innerText;
    
    let itemsArr = [];
    if (needRemoval) itemsArr.push("需要卸甲");
    const mainColorVal = document.getElementById('mainColor').value;
    if (mainColorVal) itemsArr.push(`單色款式: ${mainColorVal}`);
    if (showJumpColor) itemsArr.push(`跳色: ${document.getElementById('jumpColor').value}`);
    itemsArr.push(`色調風格: ${document.getElementById('selectedTone').value}`);

    const bookingData = {
      bookingId: 'M' + Date.now().toString().slice(-6),
      customerName: customerName,
      date: bookingDate,
      time: bookingTime,
      items: itemsArr.join(' / '),
      totalPrice: parseInt(totalPrice, 10),
      cost: 0
    };

    const submitBtn = document.querySelector('.submit-btn');
    submitBtn.innerText = "預約送出中...";
    submitBtn.disabled = true;

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify(bookingData)
    })
    .then(() => {
      let details = `【美甲服務預約單】\n• 貴賓稱呼：${customerName}\n• 預約時間：${bookingDate} ${bookingTime}\n• 預計總金額：NT$ ${totalPrice} 元`;
      window.location.href = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?${encodeURIComponent(details)}`;
    })
    .catch(error => {
      console.error('Error:', error);
      alert("送出失敗，請再試一次。");
      submitBtn.innerText = "送出預約單 (開啟 LINE)";
      submitBtn.disabled = false;
    });
  }
</script>
</body>
</html>
