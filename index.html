<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美甲服務預約選單</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ChenYuluoyan&family=Cinzel:wght@600&display=swap" rel="stylesheet">
  
  <style>
    /* 防選取與防複製保護 */
    body {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      background-color: #f4f1ea;
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #4a423d;
      position: relative;
      overflow-x: hidden;
    }

    /* ✨ 隱藏金錢靈氣背景裝飾 (NT$ & $) */
    body::before {
      content: "NT$   $   NT$   $\n$   NT$   $   NT$\nNT$   $   NT$   $\n$NT$   $   NT$";
      white-space: pre-line;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      font-family: 'Cinzel', serif;
      font-size: 38px;
      font-weight: 600;
      letter-spacing: 50px;
      line-height: 2.2;
      color: #c5a059;
      opacity: 0.055;
      pointer-events: none;
      z-index: 0;
      width: 140vw;
      text-align: center;
    }

    * {
      box-sizing: border-box;
      font-family: 'ChenYuluoyan', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    :root {
      color-scheme: light;
    }

    input[type="checkbox"], 
    input[type="radio"],
    input[type="date"] {
      accent-color: #7a6b63;
      cursor: pointer;
    }

    input[type="checkbox"], 
    input[type="radio"] {
      width: 16px;
      height: 16px;
      vertical-align: middle;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      cursor: pointer;
      filter: opacity(0.6) sepia(100%) hue-rotate(330deg);
    }

    .card {
      background: #faf8f5;
      max-width: 440px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(120, 108, 100, 0.08);
      padding: 28px 22px;
      border: 1px solid #e2dad1;
      position: relative;
      z-index: 1;
    }
    
    .title-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 3px solid #ebdcd3;
    }
    .title-header h2 {
      margin: 0;
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #5c5049;
    }

    .section {
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eae3d9;
    }
    .section-title {
      font-weight: bold;
      color: #5c5049;
      margin-bottom: 10px;
      font-size: 16.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .radio-group {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    label {
      font-size: 15.5px;
      color: #524741;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #cfc5bb;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background-color: #fefdfc;
      color: #4a423d;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    select:focus, input[type="text"]:focus, input[type="date"]:focus {
      border-color: #7a6b63;
      box-shadow: 0 0 4px rgba(122, 107, 99, 0.25);
    }
    
    .datetime-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .time-picker-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .time-picker-group select {
      flex: 1;
      text-align: center;
    }

    /* 醒目的加購項目按鈕樣式 */
    .add-btn {
      background-color: #827167;
      color: #ffffff;
      border: none;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(122, 107, 99, 0.2);
    }
    .add-btn:hover {
      background-color: #5c5049;
      transform: translateY(-1px);
    }
    .draw-btn {
      background-color: #e4dcd3;
      color: #4a423d;
      border: 1px solid #c9bebc;
      padding: 3px 8px;
      border-radius: 12.5px;
      font-size: 12.5px;
      cursor: pointer;
      transition: 0.2s;
    }
    .draw-btn:hover {
      background-color: #d7ccc3;
    }
    .hidden {
      display: none;
    }
    
    .total-box {
      background-color: #ebdcd3;
      color: #4e423b;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }
    .submit-btn {
      width: 100%;
      background-color: #7a6b63;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 17.5px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(122, 107, 99, 0.2);
      transition: background 0.2s;
      letter-spacing: 1px;
    }
    .submit-btn:hover {
      background-color: #5c5049;
    }
  </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="card">
  <div class="title-header">
    <h2>美甲服務預約選單</h2>
  </div>

  <!-- 💡 Step 1. 預約日期與時間 -->
  <div class="section">
    <div class="section-title">💡 Step 1. 預約日期與時間</div>
    <div class="datetime-container">
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約日期：</label>
        <input type="date" id="bookingDate">
      </div>
      <div>
        <label style="font-size: 13.5px; font-weight: bold; display: block; margin-bottom: 4px; color: #5c5049;">預約時間：</label>
        <div class="time-picker-group">
          <select id="bookingHour">
            <option value="00">00 時</option><option value="01">01 時</option><option value="02">02 時</option>
            <option value="03">03 時</option><option value="04">04 時</option><option value="05">05 時</option>
            <option value="06">06 時</option><option value="07">07 時</option><option value="08">08 時</option>
            <option value="09">09 時</option><option value="10">10 時</option><option value="11">11 時</option>
            <option value="12">12 時</option><option value="13">13 時</option><option value="14" selected>14 時</option>
            <option value="15">15 時</option><option value="16">16 時</option><option value="17">17 時</option>
            <option value="18">18 時</option><option value="19">19 時</option><option value="20">20 時</option>
            <option value="21">21 時</option><option value="22">22 時</option><option value="23">23 時</option>
          </select>
          <select id="bookingMinute">
            <option value="00" selected>00 分</option>
            <option value="15">15 分</option>
            <option value="30">30 分</option>
            <option value="45">45 分</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- 💡 Step 2. 單色款式 -->
  <div class="section">
    <div class="section-title">
      💡 Step 2. 單色款式
      <button class="draw-btn" onclick="drawMainColor()">🎲 幫我抽色系</button>
    </div>
    <select id="mainColor" onchange="onSelectionChange()">
      <option value="">-- 請選擇色系 (無則留空) --</option>
      <option value="紅色">紅色</option>
      <option value="粉色">粉色</option>
      <option value="橘色">橘色</option>
      <option value="黃色">黃色</option>
      <option value="深咖/可可色">深咖/可可色</option>
      <option value="淺咖色">淺咖色</option>
      <option value="綠色">綠色</option>
      <option value="藍色">藍色</option>
      <option value="紫色">紫色</option>
      <option value="黑色">黑色</option>
      <option value="銀色/白色">銀色/白色</option>
      <option value="灰色">灰色</option>
      <option value="金色/香檳色">金色/香檳色</option>
    </select>
  </div>

  <!-- 💡 Step 3. 加購項目 -->
  <div class="section">
    <div style="font-weight: bold; color: #5c5049; margin-bottom: 10px; font-size: 16.5px;">
      💡 Step 3. 加購項目
    </div>

    <!-- 按鈕與展開選單 1：跳色 -->
    <div style="margin-bottom: 12px;">
      <button class="add-btn" onclick="toggleOption('jumpColorSection')">+ 跳色</button>
      <div id="jumpColorSection" class="hidden" style="margin-top: 8px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
        <div style="font-size: 13.5px; font-weight: bold; margin-bottom: 5px; color: #5c5049;">跳色選擇：</div>
        <select id="jumpColor" onchange="onSelectionChange()">
          <option value="">-- 請選擇跳色色系 --</option>
          <option value="隨機發揮">隨機發揮</option>
          <option value="紅色">紅色</option>
          <option value="粉色">粉色</option>
          <option value="橘色">橘色</option>
          <option value="黃色">黃色</option>
          <option value="深咖/可可色">深咖/可可色</option>
          <option value="淺咖色">淺咖色</option>
          <option value="綠色">綠色</option>
          <option value="藍色">藍色</option>
          <option value="紫色">紫色</option>
          <option value="黑色">黑色</option>
          <option value="銀色/白色">銀色/白色</option>
          <option value="灰色">灰色</option>
          <option value="金色/香檳色">金色/香檳色</option>
        </select>
      </div>
    </div>

    <!-- 按鈕與展開選單 2：造型 -->
    <div>
      <button class="add-btn" onclick="toggleOption('styleSection')">+ 造型</button>
      <div id="styleSection" class="hidden" style="margin-top: 8px; padding: 10px; background: #f2ebe5; border-radius: 8px;">
        <div style="font-size: 13.5px; font-weight: bold; margin-bottom: 5px; color: #5c5049;">造型說明：</div>
        <input type="text" id="styleNote" placeholder="請填寫您想做的造型需求或備註" oninput="onSelectionChange()">
      </div>
    </div>
  </div>

  <!-- 💡 Step 4. 色調 -->
  <div class="section" id="toneSection">
    <div class="section-title">💡 Step 4. 色調</div>
    <div class="radio-group">
      <label><input type="radio" name="tone" value="不挑選" checked> 不挑選</label>
      <label><input type="radio" name="tone" value="個性暗色調"> 個性暗色調</label>
      <label><input type="radio" name="tone" value="清透亮色調"> 清透亮色調</label>
    </div>
  </div>

  <!-- 💡 Step 5. 卸甲服務 -->
  <div class="section">
    <div class="section-title">💡 Step 5. 卸甲服務</div>
    <div class="radio-group">
      <label><input type="radio" name="off" value="yes" onchange="onSelectionChange()"> 我要卸甲</label>
      <label><input type="radio" name="off" value="no" checked onchange="onSelectionChange()"> 不需要卸甲</label>
    </div>
  </div>

  <div class="total-box">
    預計總金額：NT$ <span id="totalPrice">0</span> 元
  </div>

  <button class="submit-btn" onclick="sendBooking()">送出預約單 (開啟 LINE)</button>
</div>

<script>
  // 🎯 請將此處替換為您的 LINE 官方帳號 Basic ID (記得要保留 @ 符號)
  const LINE_OFFICIAL_ACCOUNT_ID = "@344gjuzg"; 

  // 防同行偷看/側錄防護牆
  document.addEventListener('keydown', function(e) {
    if (
      e.keyCode === 123 || 
      (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 67)) ||
      (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74))
    ) {
      e.preventDefault();
      return false;
    }
  });

  let showJumpColor = false, showStyle = false;
  document.getElementById('bookingDate').valueAsDate = new Date();

  function toggleOption(id) {
    const el = document.getElementById(id);
    if (id === 'jumpColorSection') { showJumpColor = !showJumpColor; el.classList.toggle('hidden', !showJumpColor); }
    else if (id === 'styleSection') { showStyle = !showStyle; el.classList.toggle('hidden', !showStyle); }
    onSelectionChange();
  }

  function onSelectionChange() {
    calculateTotal();
  }

  function drawMainColor() {
    const select = document.getElementById('mainColor');
    const options = select.options;
    const randomIndex = Math.floor(Math.random() * (options.length - 1)) + 1;
    select.selectedIndex = randomIndex;
    alert(`🎲 恭喜抽中色系：【${options[randomIndex].value}】！`);
    onSelectionChange();
  }

  function calculateTotal() {
    let total = 0;
    const mainColorVal = document.getElementById('mainColor').value;
    const isMainColorSelected = mainColorVal !== "";
    const isJumpColorSelected = showJumpColor && document.getElementById('jumpColor').value !== "";
    const isStyleSelected = showStyle;
    const hasNailService = isMainColorSelected || isJumpColorSelected || isStyleSelected;

    const needOff = document.querySelector('input[name="off"]:checked').value === "yes";
    if (needOff) {
      total += hasNailService ? 150 : 200;
    }
    if (isMainColorSelected) total += 650;
    if (isJumpColorSelected) total += 50;
    if (isStyleSelected) total += 200; // 造型預設金額

    document.getElementById('totalPrice').innerText = total;
  }

  // 自動生成文字並開啟 LINE 官方帳號發送
  function sendBooking() {
    const bookingDate = document.getElementById('bookingDate').value || '未選擇日期';
    const hour = document.getElementById('bookingHour').value;
    const minute = document.getElementById('bookingMinute').value;
    const bookingTime = `${hour}:${minute}`;

    const needOff = document.querySelector('input[name="off"]:checked').value === "yes";
    const mainColorVal = document.getElementById('mainColor').value;
    const isMainColorSelected = mainColorVal !== "";
    
    let details = `你好！我想預約美甲：\n`;
    details += `----------------------------\n`;
    details += `• 預約時間：${bookingDate} ${bookingTime}\n`;

    if (isMainColorSelected) {
      details += `• 單色款式：${mainColorVal}\n`;
    } else {
      details += `• 單色美甲：無 (單純卸甲/加購項目)\n`;
    }

    if (showJumpColor) {
      const jumpColor = document.getElementById('jumpColor').value || '尚未選擇';
      details += `• 加購跳色：${jumpColor}\n`;
    }

    if (showStyle) {
      const styleNote = document.getElementById('styleNote').value || '無額外備註';
      details += `• 加購造型：${styleNote}\n`;
    }

    if (isMainColorSelected) {
      const toneText = document.querySelector('input[name="tone"]:checked').value;
      details += `• 色調：${toneText}\n`;
    }

    details += `• 卸甲服務：${needOff ? '我要卸甲' : '不需要卸甲'}\n`;

    const finalPrice = document.getElementById('totalPrice').innerText;
    details += `----------------------------\n`;
    details += `💰 預計總金額：NT$ ${finalPrice} 元`;

    // 開啟 LINE 官方帳號聊天室並帶入文字
    const encodedMessage = encodeURIComponent(details);
    const lineUrl = `https://line.me/R/oaMessage/${LINE_OFFICIAL_ACCOUNT_ID}/?${encodedMessage}`;

    alert("✨ 即將為您開啟 LINE，請在聊天室按「傳送」送出預約單！");
    window.location.href = lineUrl;
  }

  calculateTotal();
</script>

</body>
</html>
