<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>美甲預約系統 - 後台管理</title>
  <!-- 引入 Chart.js 用來畫營收折線圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1050px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #d4a373; }
    
    /* 15號提醒橫幅 */
    #reminderBanner { display: none; background: #fffae6; border: 1px solid #ffe58f; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; color: #d48806; font-weight: bold; }

    /* 統計卡片樣式 */
    .stats-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: #faedcd; padding: 15px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-3px); background: #f5e3be; }
    .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
    .stat-card p { margin: 0; font-size: 20px; font-weight: bold; color: #bc6c25; }

    /* 區塊通用樣式 */
    .add-section { background: #fefae0; border: 1px solid #faedcd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .add-section h3 { margin-top: 0; color: #bc6c25; font-size: 16px; margin-bottom: 10px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .form-row input, .form-row select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; flex: 1; min-width: 120px; }
    .btn-add { background: #606c38; color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .btn-add:hover { background: #283618; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #fefae0; color: #555; }
    tr:nth-child(even) { background: #f9f9f9; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-refresh { background: #d4a373; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 15px; }
    .btn-refresh:hover { background: #bc6c25; }
    
    select, input[type="number"] { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; text-align: center; }
    .btn-save { background: #606c38; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-save:hover { background: #283618; }

    /* 彈跳視窗 (Modal) 樣式 */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #888; }
    .close-btn:hover { color: #333; }
  </style>
</head>
<body>

<div class="container">
  <h2>美甲預約管理後台</h2>

  <!-- 15號提醒通知區塊 -->
  <div id="reminderBanner">
    ⚠️ 貼心提醒：目前正值 15 號至 20 號期間，請記得檢查並準備規劃與更新下兩個月的班表喔！
  </div>
  
  <!-- 財務統計看板 (點擊卡片可查看年度營收折線圖與明細) -->
  <div class="stats-container">
    <div class="stat-card" onclick="openYearlyModal()">
      <h3>當月預估營收 (點擊看年度趨勢)</h3>
      <p id="currentMonthRevenue">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>總累計營收</h3>
      <p id="totalRevenue">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>總材料成本</h3>
      <p id="totalCost">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>淨利 (利潤)</h3>
      <p id="netProfit">NT$ 0</p>
    </div>
  </div>

  <!-- 手動排班與時段微調區塊 (已改為下拉選單) -->
  <div class="add-section" style="background: #eef2ed; border-color: #d8e2dc;">
    <h3 style="color: #3a5a40;">📅 手動排班與時段微調 (加班 / 臨時休假)</h3>
    <div class="form-row">
      <input type="date" id="scheduleDate" required>
      <select id="scheduleStatus">
        <option value="開放">強制開放預約 (加班)</option>
        <option value="關閉">強制關閉預約 (休假)</option>
      </select>
    </div>
    <div class="form-row">
      <select id="scheduleSlots" style="flex: 3;">
        <option value="">-- 全天開放 (或照常) --</option>
        <option value="10:00">10:00 時段</option>
        <option value="12:00">12:00 時段</option>
        <option value="14:00">14:00 時段</option>
        <option value="16:00">16:00 時段</option>
        <option value="18:00">18:00 時段</option>
        <option value="20:00">20:00 時段</option>
      </select>
      <button class="btn-add" style="background: #3a5a40; flex: 1;" onclick="updateScheduleOverride()">儲存排班設定</button>
    </div>
  </div>

  <!-- 手動新增預約/記帳區塊 -->
  <div class="add-section">
    <h3>➕ 手動新增預約 / 記帳</h3>
    <div class="form-row">
      <input type="text" id="newName" placeholder="客戶名稱" required>
      <input type="date" id="newDate" required>
      <input type="text" id="newTime" placeholder="時間 (例: 14:00)" required>
      <input type="text" id="newItems" placeholder="項目 (例: 單色光療)" required>
      <input type="number" id="newPrice" placeholder="金額 (NT$)" required min="0">
      <input type="number" id="newCost" placeholder="成本 (NT$)" required min="0" value="0">
      <button class="btn-add" onclick="manualAddBooking()">新增紀錄</button>
    </div>
  </div>

  <button class="btn-refresh" onclick="fetchBookings()">重新整理資料</button>

  <table>
    <thead>
      <tr>
        <th>預約編號</th>
        <th>客戶名稱</th>
        <th>日期</th>
        <th>時間</th>
        <th>項目</th>
        <th>預估金額</th>
        <th>狀態 (可修改)</th>
        <th>成本 (可修改)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>
    </tbody>
  </table>
</div>

<!-- 年度營收折線圖彈跳視窗 -->
<div id="yearlyModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeYearlyModal()">&times;</span>
    <h3 style="color: #d4a373; text-align: center; margin-top: 0;">📈 年度每月營收折線圖趨勢</h3>
    <div style="margin-bottom: 15px; text-align: center;">
      <select id="selectYear" onchange="renderChart()" style="padding: 6px; border-radius: 6px; font-size: 14px;">
        <!-- 動態帶入年份 -->
      </select>
    </div>
    <div style="position: relative; height: 300px; width: 100%;">
      <canvas id="revenueChart"></canvas>
    </div>
  </div>
</div>

<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
  let globalBookings = []; 
  let revenueChartInstance = null;

  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('newDate').value = today;
    document.getElementById('scheduleDate').value = today;
    checkReminder();
    fetchBookings();
  });

  function checkReminder() {
    const todayDay = new Date().getDate();
    if (todayDay >= 15 && todayDay <= 20) {
      document.getElementById('reminderBanner').style.display = "block";
    }
  }

  function fetchBookings() {
    const tableBody = document.getElementById('bookingTableBody');
    tableBody.innerHTML = `<tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>`;

    fetch(scriptUrl)
      .then(response => response.json())
      .then(resData => {
        tableBody.innerHTML = "";
        globalBookings = resData.bookings || [];
        
        if (globalBookings.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="9" class="loading">目前沒有預約資料</td></tr>`;
          updateFinance([]);
          return;
        }

        let totalRev = 0;
        let totalCost = 0;
        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        let currentMonthRev = 0;

        globalBookings.forEach(row => {
          const bookingId = row.bookingId || "";
          const customerName = row.customerName || "";
          const date = row.date || "";
          const time = row.time || "";
          const items = row.items || "";
          const price = Number(row.totalPrice) || 0;
          const status = row.status || "預約中";
          const cost = Number(row.cost) || 0;

          if (status !== "已取消") {
            totalRev += price;
            totalCost += cost;
            if (date.startsWith(currentYearMonth)) {
              currentMonthRev += price;
            }
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${bookingId}</td>
            <td>${customerName}</td>
            <td>${date}</td>
            <td>${time}</td>
            <td>${items}</td>
            <td>NT$ ${price}</td>
            <td>
              <select id="status_${bookingId}">
                <option value="有效" ${status === '有效' ? 'selected' : ''}>有效</option>
                <option value="預約中" ${status === '預約中' ? 'selected' : ''}>預約中</option>
                <option value="已完成" ${status === '已完成' ? 'selected' : ''}>已完成</option>
                <option value="已取消" ${status === '已取消' ? 'selected' : ''}>已取消</option>
              </select>
            </td>
            <td>
              <input type="number" id="cost_${bookingId}" value="${cost}" style="width: 80px;" min="0">
            </td>
            <td>
              <button class="btn-save" onclick="updateBooking('${bookingId}')">儲存</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        updateFinance(totalRev, totalCost, currentMonthRev);
      })
      .catch(err => {
        console.error("讀取失敗", err);
        tableBody.innerHTML = `<tr><td colspan="9" class="loading" style="color: red;">讀取失敗，請確認 Apps Script 權限或網址是否正確！</td></tr>`;
      });
  }

  function updateFinance(rev, cost, monthRev = 0) {
    const profit = rev - cost;
    document.getElementById('currentMonthRevenue').innerText = `NT$ ${monthRev}`;
    document.getElementById('totalRevenue').innerText = `NT$ ${rev}`;
    document.getElementById('totalCost').innerText = `NT$ ${cost}`;
    document.getElementById('netProfit').innerText = `NT$ ${profit}`;
  }

  function openYearlyModal() {
    const modal = document.getElementById('yearlyModal');
    modal.style.display = 'flex';
    setYearDropdown();
    renderChart();
  }

  function closeYearlyModal() {
    document.getElementById('yearlyModal').style.display = 'none';
  }

  function setYearDropdown() {
    const yearSelect = document.getElementById('selectYear');
    let years = new Set();
    const currentYear = new Date().getFullYear();
    years.add(currentYear);

    globalBookings.forEach(row => {
      if (row.date) {
        const y = row.date.split('-')[0];
        if (y) years.add(y);
      }
    });

    yearSelect.innerHTML = "";
    Array.from(years).sort().reverse().forEach(y => {
      const opt = document.createElement('option');
      opt.value = y;
      opt.innerText = `${y} 年`;
      yearSelect.appendChild(opt);
    });
  }

  function renderChart() {
    const selectedYear = document.getElementById('selectYear').value || new Date().getFullYear();
    let monthlyRevenue = new Array(12).fill(0);

    globalBookings.forEach(row => {
      if (row.date && row.status !== "已取消") {
        const parts = row.date.split('-');
        if (parts.length === 3 && parts[0] === String(selectedYear)) {
          const monthIdx = parseInt(parts[1], 10) - 1;
          if (monthIdx >= 0 && monthIdx < 12) {
            monthlyRevenue[monthIdx] += Number(row.totalPrice) || 0;
          }
        }
      }
    });

    const ctx = document.getElementById('revenueChart').getContext('2d');
    if (revenueChartInstance) {
      revenueChartInstance.destroy();
    }

    revenueChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
        datasets: [{
          label: `${selectedYear} 年每月營收 (NT$)`,
          data: monthlyRevenue,
          borderColor: '#bc6c25',
          backgroundColor: 'rgba(188, 108, 37, 0.1)',
          borderWidth: 3,
          fill: true,
          tension: 0.3,
          pointBackgroundColor: '#d4a373',
          pointRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: function(value) { return 'NT$ ' + value; }
            }
          }
        }
      }
    });
  }

  function updateScheduleOverride() {
    const targetDate = document.getElementById('scheduleDate').value;
    const status = document.getElementById('scheduleStatus').value;
    const slots = document.getElementById('scheduleSlots').value;

    if (!targetDate) {
      alert("請選擇要調整的日期！");
      return;
    }

    const payload = {
      action: "updateSchedule",
      targetDate: targetDate,
      status: status,
      slots: slots
    };

    fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.result === "success") {
        alert(`日期 ${targetDate} 已成功更新排班狀態為「${status}」！`);
      } else {
        alert("更新失敗：" + (res.error || "未知錯誤"));
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線發生錯誤！");
    });
  }

  function manualAddBooking() {
    const customerName = document.getElementById('newName').value;
    const date = document.getElementById('newDate').value;
    const time = document.getElementById('newTime').value;
    const items = document.getElementById('newItems').value;
    const totalPrice = document.getElementById('newPrice').value;
    const cost = document.getElementById('newCost').value;

    if (!customerName || !date || !time || !items || !totalPrice) {
      alert("請將必填欄位（名稱、日期、時間、項目、金額）填寫完整！");
      return;
    }

    const payload = {
      customerName: customerName,
      date: date,
      time: time,
      items: items,
      totalPrice: Number(totalPrice),
      cost: Number(cost)
    };

    fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.result === "success") {
        alert("手動新增紀錄成功！");
        document.getElementById('newName').value = "";
        document.getElementById('newTime').value = "";
        document.getElementById('newItems').value = "";
        document.getElementById('newPrice').value = "";
        document.getElementById('newCost').value = "0";
        fetchBookings();
      } else {
        alert("新增失敗：" + (res.error || "未知錯誤"));
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線發生錯誤！");
    });
  }

  function updateBooking(bookingId) {
    const newStatus = document.getElementById(`status_${bookingId}`).value;
    const newCost = document.getElementById(`cost_${bookingId}`).value;

    const payload = {
      action: "update",
      bookingId: bookingId,
      status: newStatus,
      cost: Number(newCost)
    };

    const btn = event.target;
    btn.innerText = "儲存中...";
    btn.disabled = true;

    fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.result === "success") {
        alert(`預約 #${bookingId} 更新成功！`);
        fetchBookings();
      } else {
        alert("更新失敗：" + (res.error || "未知錯誤"));
        btn.innerText = "儲存";
        btn.disabled = false;
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線發生錯誤！");
      btn.innerText = "儲存";
      btn.disabled = false;
    });
  }
</script>

</body>
</html>
