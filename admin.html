<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>美甲預約系統 - 後台管理</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f4f2ee;
      --card-bg: #ffffff;
      --primary: #8a7968;
      --primary-dark: #6e5f50;
      --accent-green: #738276;
      --accent-sand: #d4c5b9;
      --text-main: #4a4541;
      --text-muted: #8c827a;
      --border-color: #e6e0d8;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: var(--bg-color); margin: 0; padding: 25px; color: var(--text-main); }
    .container { max-width: 1100px; margin: 0 auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(138, 121, 104, 0.06); border: 1px solid var(--border-color); }
    h2 { text-align: center; color: var(--primary-dark); font-weight: 600; letter-spacing: 1px; margin-bottom: 25px; }
    
    #reminderBanner { display: none; background: #fdf6ec; border: 1px solid #f2e3d1; padding: 14px; border-radius: 10px; margin-bottom: 25px; text-align: center; color: #b88654; font-size: 14.5px; font-weight: 500; }

    /* 統計卡片莫蘭迪色系 */
    .stats-container { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-card { background: #f7f5f0; padding: 20px 15px; border-radius: 12px; flex: 1; min-width: 210px; text-align: center; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.25s ease; }
    .stat-card:hover { transform: translateY(-3px); background: #f0ece5; border-color: var(--accent-sand); }
    .stat-card h3 { margin: 0 0 8px 0; font-size: 13.5px; color: var(--text-muted); font-weight: normal; }
    .stat-card p { margin: 0; font-size: 22px; font-weight: bold; color: var(--primary-dark); }

    /* 區塊樣式 */
    .add-section { background: #faf8f5; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .add-section h3 { margin-top: 0; color: var(--primary-dark); font-size: 15px; margin-bottom: 15px; font-weight: 600; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .form-row:last-child { margin-bottom: 0; }
    .form-row input, .form-row select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 14px; flex: 1; min-width: 140px; background: #fff; color: var(--text-main); outline: none; }
    .form-row input:focus, .form-row select:focus { border-color: var(--primary); }
    
    .btn-action { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; }
    .btn-action:hover { background: var(--primary-dark); }

    /* 小月曆預覽排班格 */
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .calendar-day { background: #ffffff; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 4px; text-align: center; min-height: 50px; display: flex; flex-direction: column; justify-content: space-between; }
    .calendar-day .day-num { font-size: 12px; color: var(--text-muted); font-weight: bold; }
    .calendar-day .day-status { font-size: 11px; padding: 2px 4px; border-radius: 4px; font-weight: 500; }
    
    /* 排班狀態標籤顏色 */
    .status-work { background: #f2e9e4; color: #9a7b70; } /* 上班 */
    .status-off { background: #e8ede9; color: var(--accent-green); } /* 休假 */
    .status-overtime { background: #faedcd; color: #bc6c25; } /* 加班 */
    .status-closed { background: #f5f5f5; color: #aaa; text-decoration: line-through; } /* 閉店 */

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid var(--border-color); padding: 12px 10px; text-align: center; font-size: 14px; }
    th { background: #f7f5f0; color: var(--text-muted); font-weight: 500; }
    tr:nth-child(even) { background: #faf9f6; }
    .loading { text-align: center; padding: 25px; color: var(--text-muted); }
    
    .btn-refresh { background: var(--accent-sand); color: var(--primary-dark); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; margin-bottom: 15px; transition: background 0.2s; }
    .btn-refresh:hover { background: #c5b4a4; }
    
    select, input[type="number"] { padding: 6px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 13px; text-align: center; }
    .btn-save { background: var(--accent-green); color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-save:hover { background: #5c6b5f; }

    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(74, 69, 65, 0.4); justify-content: center; align-items: center; }
    .modal-content { background: var(--card-bg); padding: 30px; border-radius: 16px; width: 90%; max-width: 700px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
    .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
    .close-btn:hover { color: var(--text-main); }
  </style>
</head>
<body>

<div class="container">
  <h2>美甲預約管理後台</h2>

  <div id="reminderBanner">
    ⚠️ 提醒：目前正值 15 號至 20 號期間，請記得檢查並規劃下兩個月的班表！
  </div>
  
  <div class="stats-container">
    <div class="stat-card" onclick="openModal('revenue')">
      <h3>當月預估營收 (點擊看年度趨勢)</h3>
      <p id="currentMonthRevenue">NT$ 0</p>
    </div>
    <div class="stat-card" onclick="openModal('revenue')">
      <h3>總累計營收</h3>
      <p id="totalRevenue">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>總材料成本</h3>
      <p id="totalCost">NT$ 0</p>
    </div>
    <div class="stat-card" onclick="openModal('profit')">
      <h3>淨利 (利潤) (點擊看年度趨勢)</h3>
      <p id="netProfit">NT$ 0</p>
    </div>
  </div>

  <!-- 班別與月份設定 -->
  <div class="add-section">
    <h3>🔄 班別與月份設定</h3>
    <div class="form-row">
      <input type="month" id="targetMonth" onchange="renderSchedulePreview()">
      <select id="shiftGroup" onchange="renderSchedulePreview()">
        <option value="B">B 班</option>
        <option value="A">A 班</option>
      </select>
      <select id="shiftType" onchange="renderSchedulePreview()">
        <option value="夜班">夜班</option>
        <option value="日班">日班</option>
      </select>
      <button class="btn-action" onclick="updateBaseShift()">儲存班別設定</button>
    </div>
  </div>

  <!-- 班表小預覽區塊 -->
  <div class="add-section" style="background: #f4f2ee;">
    <div class="preview-header">
      <h3 style="margin: 0;">📅 當月排班狀態小預覽</h3>
      <span id="previewMonthTitle" style="font-size: 13.5px; color: var(--text-muted); font-weight: bold;"></span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-weight: bold;">
      <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
    </div>
    <div id="calendarPreviewGrid" class="calendar-grid">
      <!-- 動態產生月曆格子 -->
    </div>
  </div>

  <!-- 手動排班與時段微調 -->
  <div class="add-section">
    <h3>✨ 手動排班與時段微調 (加班 / 臨時休假)</h3>
    <div class="form-row">
      <input type="date" id="scheduleDate" required>
      <select id="scheduleStatus">
        <option value="開放">強制開放預約 (加班)</option>
        <option value="關閉">強制關閉預約 (休假)</option>
      </select>
      <select id="scheduleSlots">
        <option value="">-- 全天開放 (或照常) --</option>
        <option value="10:00">10:00 時段</option>
        <option value="12:00">12:00 時段</option>
        <option value="14:00">14:00 時段</option>
        <option value="16:00">16:00 時段</option>
        <option value="18:00">18:00 時段</option>
        <option value="20:00">20:00 時段</option>
      </select>
      <button class="btn-action" style="background: var(--accent-green);" onclick="updateScheduleOverride()">儲存微調</button>
    </div>
  </div>

  <!-- 手動新增預約 -->
  <div class="add-section">
    <h3>➕ 手動新增預約 / 記帳</h3>
    <div class="form-row">
      <input type="text" id="newName" placeholder="客戶名稱" required>
      <input type="date" id="newDate" required>
      <input type="text" id="newTime" placeholder="時間 (例: 14:00)" required>
      <input type="text" id="newItems" placeholder="項目 (例: 單色光療)" required>
      <input type="number" id="newPrice" placeholder="金額 (NT$)" required min="0">
      <input type="number" id="newCost" placeholder="成本 (NT$)" required min="0" value="0">
      <button class="btn-action" onclick="manualAddBooking()">新增紀錄</button>
    </div>
  </div>

  <button class="btn-refresh" onclick="fetchBookings()">重新整理資料</button>

  <table>
    <thead>
      <tr>
        <th>預約編號</th>
        <th>客戶名稱</th>
        <th>日期</th>
        <th>時間</th>
        <th>項目</th>
        <th>預估金額</th>
        <th>狀態 (可修改)</th>
        <th>成本 (可修改)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>
    </tbody>
  </table>
</div>

<!-- 年度趨勢圖彈窗 -->
<div id="chartModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle" style="color: var(--primary-dark); text-align: center; margin-top: 0;">📈 年度趨勢折線圖</h3>
    <div style="margin-bottom: 15px; text-align: center;">
      <select id="selectYear" onchange="renderChart()" style="padding: 6px; border-radius: 6px; font-size: 14px;"></select>
    </div>
    <div style="position: relative; height: 300px; width: 100%;">
      <canvas id="trendChart"></canvas>
    </div>
  </div>
</div>

<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
  let globalBookings = []; 
  let globalSchedules = {};
  let trendChartInstance = null;
  let currentChartType = 'revenue';
  const anchorBaseDate = "2026-10-23"; // 基準日

  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const currentYearMonth = today.toISOString().slice(0, 7);
    
    document.getElementById('newDate').value = todayStr;
    document.getElementById('scheduleDate').value = todayStr;
    document.getElementById('targetMonth').value = currentYearMonth;
    
    checkReminder();
    fetchBookings();
  });

  function checkReminder() {
    const todayDay = new Date().getDate();
    if (todayDay >= 15 && todayDay <= 20) {
      document.getElementById('reminderBanner').style.display = "block";
    }
  }

  function fetchBookings() {
    const tableBody = document.getElementById('bookingTableBody');
    tableBody.innerHTML = `<tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>`;

    fetch(scriptUrl, { method: 'GET', mode: 'cors' })
      .then(response => {
        if (!response.ok) throw new Error("網路回應失敗");
        return response.json();
      })
      .then(resData => {
        tableBody.innerHTML = "";
        globalBookings = resData.bookings || [];
        globalSchedules = resData.schedules || {};
        
        if (resData.shiftGroup) document.getElementById('shiftGroup').value = resData.shiftGroup;
        if (resData.shiftType) document.getElementById('shiftType').value = resData.shiftType;

        renderSchedulePreview(); // 渲染小月曆

        if (globalBookings.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="9" class="loading">目前沒有預約資料</td></tr>`;
          updateFinance(0, 0, 0);
          return;
        }

        let totalRev = 0, totalCost = 0;
        const now = new Date();
        const currentYearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        let currentMonthRev = 0;

        globalBookings.forEach(row => {
          const bookingId = row.bookingId || "";
          const customerName = row.customerName || "";
          const date = row.date || "";
          const time = row.time || "";
          const items = row.items || "";
          const price = Number(row.totalPrice) || 0;
          const status = row.status || "預約中";
          const cost = Number(row.cost) || 0;

          if (status !== "已取消") {
            totalRev += price;
            totalCost += cost;
            if (date.startsWith(currentYearMonth)) currentMonthRev += price;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${bookingId}</td>
            <td>${customerName}</td>
            <td>${date}</td>
            <td>${time}</td>
            <td>${items}</td>
            <td>NT$ ${price}</td>
            <td>
              <select id="status_${bookingId}">
                <option value="有效" ${status === '有效' ? 'selected' : ''}>有效</option>
                <option value="預約中" ${status === '預約中' ? 'selected' : ''}>預約中</option>
                <option value="已完成" ${status === '已完成' ? 'selected' : ''}>已完成</option>
                <option value="已取消" ${status === '已取消' ? 'selected' : ''}>已取消</option>
              </select>
            </td>
            <td><input type="number" id="cost_${bookingId}" value="${cost}" style="width: 80px;" min="0"></td>
            <td><button class="btn-save" onclick="updateBooking('${bookingId}')">儲存</button></td>
          `;
          tableBody.appendChild(tr);
        });

        updateFinance(totalRev, totalCost, currentMonthRev);
      })
      .catch(err => {
        console.error("讀取失敗", err);
        tableBody.innerHTML = `<tr><td colspan="9" class="loading" style="color: red;">讀取失敗：無法連線至後端！</td></tr>`;
      });
  }

  // 渲染當月班表小預覽邏輯
  function renderSchedulePreview() {
    const targetMonthVal = document.getElementById('targetMonth').value; // "YYYY-MM"
    if (!targetMonthVal) return;

    const [year, month] = targetMonthVal.split('-').map(Number);
    document.getElementById('previewMonthTitle').innerText = `${year} 年 ${month} 月排班預覽`;

    const grid = document.getElementById('calendarPreviewGrid');
    grid.innerHTML = "";

    const firstDayIndex = new Date(year, month - 1, 1).getDay(); // 當月第一天星期幾
    const totalDays = new Date(year, month, 0).getDate(); // 當月總天數

    const anchorDate = new Date(anchorBaseDate + "T00:00:00");
    const shiftGroup = document.getElementById('shiftGroup').value;

    // 補齊前面空白格
    for (let i = 0; i < firstDayIndex; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'calendar-day';
      emptyCell.style.background = 'transparent';
      emptyCell.style.border = 'none';
      grid.appendChild(emptyCell);
    }

    for (let day = 1; day <= totalDays; day++) {
      const dateObj = new Date(year, month - 1, day);
      const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      
      const cell = document.createElement('div');
      cell.className = 'calendar-day';

      let statusText = "";
      let statusClass = "";

      // 1. 檢查後台覆寫
      if (globalSchedules[dateStr]) {
        const s = globalSchedules[dateStr];
        if (s.status === "開放") {
          statusText = s.slots ? `加班(${s.slots})` : "加班";
          statusClass = "status-overtime";
        } else if (s.status === "關閉") {
          statusText = "休假";
          statusClass = "status-closed";
        }
      } else {
        // 2. 依二休二與 A/B 班計算
        const diffDays = Math.round((dateObj - anchorDate) / (1000 * 60 * 60 * 24));
        let cycleDay = ((diffDays % 4) + 4) % 4;
        if (shiftGroup === "A") cycleDay = (cycleDay + 2) % 4; // A班錯開兩天

        const isWorkDay = (cycleDay === 0 || cycleDay === 1);
        if (isWorkDay) {
          statusText = "上班";
          statusClass = "status-work";
        } else {
          statusText = "休假";
          statusClass = "status-off";
        }
      }

      cell.innerHTML = `
        <span class="day-num">${day}</span>
        <span class="day-status ${statusClass}">${statusText}</span>
      `;
      grid.appendChild(cell);
    }
  }

  function updateBaseShift() {
    const targetMonth = document.getElementById('targetMonth').value;
    const shiftGroup = document.getElementById('shiftGroup').value;
    const shiftType = document.getElementById('shiftType').value;

    if (!targetMonth) return alert("請選擇要設定的月份！");

    fetch(scriptUrl, { 
      method: "POST", 
      body: JSON.stringify({ action: "updateBaseShift", targetMonth, shiftGroup, shiftType }) 
    })
      .then(res => res.json())
      .then(res => {
        if (res.result === "success") {
          alert(`【${targetMonth}】班別已成功更新！`);
          renderSchedulePreview();
        } else alert("更新失敗");
      })
      .catch(err => alert("連線發生錯誤！"));
  }

  function updateScheduleOverride() {
    const targetDate = document.getElementById('scheduleDate').value;
    const status = document.getElementById('scheduleStatus').value;
    const slots = document.getElementById('scheduleSlots').value;

    if (!targetDate) return alert("請選擇要調整的日期！");

    fetch(scriptUrl, { method: "POST", body: JSON.stringify({ action: "updateSchedule", targetDate, status, slots }) })
      .then(res => res.json())
      .then(res => {
        if (res.result === "success") { 
          alert(`日期 ${targetDate} 已成功更新微調！`); 
          fetchBookings(); 
        } else alert("更新失敗");
      })
      .catch(err => alert("連線發生錯誤！"));
  }

  function updateFinance(rev, cost, monthRev = 0) {
    document.getElementById('currentMonthRevenue').innerText = `NT$ ${monthRev}`;
    document.getElementById('totalRevenue').innerText = `NT$ ${rev}`;
    document.getElementById('totalCost').innerText = `NT$ ${cost}`;
    document.getElementById('netProfit').innerText = `NT$ ${rev - cost}`;
  }

  function openModal(type) {
    currentChartType = type;
    document.getElementById('modalTitle').innerText = (type === 'revenue') ? "📈 年度每月營收折線圖趨勢" : "📈 年度每月淨利（利潤）折線圖趨勢";
    document.getElementById('chartModal').style.display = 'flex';
    setYearDropdown();
    renderChart();
  }

  function closeModal() { document.getElementById('chartModal').style.display = 'none'; }

  function setYearDropdown() {
    const yearSelect = document.getElementById('selectYear');
    let years = new Set([new Date().getFullYear()]);
    globalBookings.forEach(row => { if (row.date) years.add(row.date.split('-')[0]); });
    yearSelect.innerHTML = "";
    Array.from(years).sort().reverse().forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.innerText = `${y} 年`;
      yearSelect.appendChild(opt);
    });
  }

  function renderChart() {
    const selectedYear = document.getElementById('selectYear').value || new Date().getFullYear();
    let monthlyData = new Array(12).fill(0);

    globalBookings.forEach(row => {
      if (row.date && row.status !== "已取消") {
        const parts = row.date.split('-');
        if (parts.length === 3 && parts[0] === String(selectedYear)) {
          const monthIdx = parseInt(parts[1], 10) - 1;
          if (monthIdx >= 0 && monthIdx < 12) {
            const price = Number(row.totalPrice) || 0;
            const cost = Number(row.cost) || 0;
            monthlyData[monthIdx] += (currentChartType === 'revenue') ? price : (price - cost);
          }
        }
      }
    });

    const ctx = document.getElementById('trendChart').getContext('2d');
    if (trendChartInstance) trendChartInstance.destroy();

    const chartColor = currentChartType === 'revenue' ? '#8a7968' : '#738276';
    trendChartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
        datasets: [{
          label: `${selectedYear} 年每月${currentChartType === 'revenue' ? '營收' : '淨利'} (NT$)`,
          data: monthlyData,
          borderColor: chartColor,
          backgroundColor: currentChartType === 'revenue' ? 'rgba(138, 121, 104, 0.08)' : 'rgba(115, 130, 118, 0.08)',
          borderWidth: 3, fill: true, tension: 0.3, pointBackgroundColor: chartColor, pointRadius: 5
        }]
      },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { callback: v => 'NT$ ' + v } } } }
    });
  }

  function manualAddBooking() {
    const customerName = document.getElementById('newName').value;
    const date = document.getElementById('newDate').value;
    const time = document.getElementById('newTime').value;
    const items = document.getElementById('newItems').value;
    const totalPrice = document.getElementById('newPrice').value;
    const cost = document.getElementById('newCost').value;

    if (!customerName || !date || !time || !items || !totalPrice) return alert("請將必填欄位填寫完整！");

    fetch(scriptUrl, { method: "POST", body: JSON.stringify({ customerName, date, time, items, totalPrice: Number(totalPrice), cost: Number(cost) }) })
      .then(res => res.json())
      .then(res => {
        if (res.result === "success") {
          alert("手動新增紀錄成功！");
          fetchBookings();
        } else alert("新增失敗");
      }).catch(err => alert("連線錯誤！"));
  }

  function updateBooking(bookingId) {
    const newStatus = document.getElementById(`status_${bookingId}`).value;
    const newCost = document.getElementById(`cost_${bookingId}`).value;

    fetch(scriptUrl, { method: "POST", body: JSON.stringify({ action: "update", bookingId, status: newStatus, cost: Number(newCost) }) })
      .then(res => res.json())
      .then(res => {
        if (res.result === "success") { alert(`預約 #${bookingId} 更新成功！`); fetchBookings(); }
        else alert("更新失敗");
      }).catch(err => alert("連線錯誤！"));
  }
</script>
