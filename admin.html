<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>美甲預約系統 - 後台管理</title>
  <!-- 引入 Chart.js 用來畫折線圖 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1050px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #d4a373; }
    
    /* 15號提醒橫幅 */
    #reminderBanner { display: none; background: #fffae6; border: 1px solid #ffe58f; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; color: #d48806; font-weight: bold; }

    /* 統計卡片樣式 */
    .stats-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: #faedcd; padding: 15px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.2s; }
    .stat-card:hover { transform: translateY(-3px); background: #f5e3be; }
    .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
    .stat-card p { margin: 0; font-size: 20px; font-weight: bold; color: #bc6c25; }

    /* 區塊通用樣式 */
    .add-section { background: #fefae0; border: 1px solid #faedcd; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .add-section h3 { margin-top: 0; color: #bc6c25; font-size: 16px; margin-bottom: 10px; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .form-row input, .form-row select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; flex: 1; min-width: 120px; }
    .btn-add { background: #606c38; color: white; border: none; padding: 9px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
    .btn-add:hover { background: #283618; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #fefae0; color: #555; }
    tr:nth-child(even) { background: #f9f9f9; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-refresh { background: #d4a373; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 15px; }
    .btn-refresh:hover { background: #bc6c25; }
    
    select, input[type="number"] { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; text-align: center; }
    .btn-save { background: #606c38; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-save:hover { background: #283618; }

    /* 彈跳視窗 (Modal) 樣式 */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: relative; }
    .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #888; }
    .close-btn:hover { color: #333; }
  </style>
</head>
<body>

<div class="container">
  <h2>美甲預約管理後台</h2>

  <!-- 15號提醒通知區塊 -->
  <div id="reminderBanner">
    ⚠️ 貼心提醒：目前正值 15 號至 20 號期間，請記得檢查並準備規劃與更新下兩個月的班表喔！
  </div>
  
  <!-- 財務統計看板 (點擊營收或淨利卡片可看年度趨勢) -->
  <div class="stats-container">
    <div class="stat-card" onclick="openModal('revenue')">
      <h3>當月預估營收 (點擊看年度趨勢)</h3>
      <p id="currentMonthRevenue">NT$ 0</p>
    </div>
    <div class="stat-card" onclick="openModal('revenue')">
      <h3>總累計營收</h3>
      <p id="totalRevenue">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>總材料成本</h3>
      <p id="totalCost">NT$ 0</p>
    </div>
    <div class="stat-card" onclick="openModal('profit')">
      <h3>淨利 (利潤) (點擊看年度趨勢)</h3>
      <p id="netProfit">NT$ 0</p>
    </div>
  </div>

  <!-- 手動排班與時段微調區塊 -->
  <div class="add-section" style="background: #eef2ed; border-color: #d8e2dc;">
    <h3 style="color: #3a5a40;">📅 手動排班與時段微調 (加班 / 臨時休假)</h3>
    <div class="form-row">
      <input type="date" id="scheduleDate" required>
      <select id="scheduleStatus">
        <option value="開放">強制開放預約 (加班)</option>
        <option value="關閉">強制關閉預約 (休假)</option>
      </select>
    </div>
    <div class="form-row">
      <select id="scheduleSlots" style="flex: 3;">
        <option value="">-- 全天開放 (或照常) --</option>
        <option value="10:00">10:00 時段</option>
        <option value="12:00">12:00 時段</option>
        <option value="14:00">14:00 時段</option>
        <option value="16:00">16:00 時段</option>
        <option value="18:00">18:00 時段</option>
        <option value="20:00">20:00 時段</option>
      </select>
      <button class="btn-add" style="background: #3a5a40; flex: 1;" onclick="updateScheduleOverride()">儲存排班設定</button>
    </div>
  </div>

  <!-- 手動新增預約/記帳區塊 -->
  <div class="add-section">
    <h3>➕ 手動新增預約 / 記帳</h3>
    <div class="form-row">
      <input type="text" id="newName" placeholder="客戶名稱" required>
      <input type="date" id="newDate" required>
      <input type="text" id="newTime" placeholder="時間 (例: 14:00)" required>
      <input type="text" id="newItems" placeholder="項目 (例: 單色光療)" required>
      <input type="number" id="newPrice" placeholder="金額 (NT$)" required min="0">
      <input type="number" id="newCost" placeholder="成本 (NT$)" required min="0" value="0">
      <button class="btn-add" onclick="manualAddBooking()">新增紀錄</button>
    </div>
  </div>

  <button class="btn-refresh" onclick="fetchBookings()">重新整理資料</button>

  <table>
    <thead>
      <tr>
        <th>預約編號</th>
        <th>客戶名稱</th>
        <th>日期</th>
        <th>時間</th>
        <th>項目</th>
        <th>預估金額</th>
        <th>狀態 (可修改)</th>
        <th>成本 (可修改)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>
    </tbody>
  </table>
</div>

<!-- 年度趨勢折線圖彈跳視窗 -->
<div id="chartModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle" style="color: #d4a373; text-align: center; margin-top: 0;">📈 年度趨勢折線圖</h3>
    <div style="margin-bottom: 15px; text-align: center;">
      <select id="selectYear" onchange="renderChart()" style="padding: 6px; border-radius: 6px; font-size: 14px;">
        <!-- 動態帶入年份 -->
      </select>
    </div>
    <div style="position: relative; height: 300px; width: 100%;">
      <canvas id="trendChart"></canvas>
    </div>
  </div>
</div>

<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";
  let globalBookings = []; 
  let trendChartInstance = null;
  let currentChartType = 'revenue'; // 'revenue' 或 'profit'

  document.addEventListener('DOMContentLoaded', () => {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('newDate').value = today;
    document.getElementById('scheduleDate').value = today;
    checkReminder();
    fetchBookings();
  });

  function checkReminder() {
    const todayDay = new Date().getDate();
    if (todayDay >= 15 && todayDay <= 20) {
      document.getElementById('reminderBanner').style.display = "block";
    }
  }

  function fetchBookings() {
    const tableBody = document.getElementById('bookingTableBody');
    tableBody.innerHTML
