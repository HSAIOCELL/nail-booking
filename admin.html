<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>美甲預約系統 - 後台管理</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1050px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #d4a373; }
    
    /* 統計卡片樣式 */
    .stats-container { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #faedcd; padding: 15px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
    .stat-card p { margin: 0; font-size: 20px; font-weight: bold; color: #bc6c25; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: center; font-size: 14px; }
    th { background: #fefae0; color: #555; }
    tr:nth-child(even) { background: #f9f9f9; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-refresh { background: #d4a373; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 15px; }
    .btn-refresh:hover { background: #bc6c25; }
    
    /* 互動表單樣式 */
    select, input[type="number"] { padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; text-align: center; }
    .btn-save { background: #606c38; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-save:hover { background: #283618; }
  </style>
</head>
<body>

<div class="container">
  <h2>美甲預約管理後台</h2>
  <!-- 15號提醒通知區塊 -->
<div id="reminderBanner" style="display: none; background: #fffae6; border: 1px solid #ffe58f; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; color: #d48806; font-weight: bold;">
  ⚠️ 貼心提醒：今天是 15 號！請記得檢查並準備於 20 號上傳下個月的預約班表喔！
</div>
  <!-- 財務統計看板 -->
  <div class="stats-container">
    <div class="stat-card">
      <h3>總預估營收</h3>
      <p id="totalRevenue">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>總材料成本</h3>
      <p id="totalCost">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>淨利 (利潤)</h3>
      <p id="netProfit">NT$ 0</p>
    </div>
  </div>

  <button class="btn-refresh" onclick="fetchBookings()">重新整理資料</button>

  <table>
    <thead>
      <tr>
        <th>預約編號</th>
        <th>客戶名稱</th>
        <th>日期</th>
        <th>時間</th>
        <th>項目</th>
        <th>預估金額</th>
        <th>狀態 (可修改)</th>
        <th>成本 (可修改)</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>
    </tbody>
  </table>
</div>

<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";

  function fetchBookings() {
    const tableBody = document.getElementById('bookingTableBody');
    tableBody.innerHTML = `<tr><td colspan="9" class="loading">正在讀取最新資料...</td></tr>`;

    fetch(scriptUrl)
      .then(response => response.json())
      .then(data => {
        tableBody.innerHTML = "";
        
        if (!data || data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="9" class="loading">目前沒有預約資料</td></tr>`;
          updateFinance(0, 0);
          return;
        }

        let totalRev = 0;
        let totalCost = 0;

        data.forEach(row => {
          const bookingId = row[0] || "";
          const customerName = row[1] || "";
          const date = row[2] || "";
          const time = row[3] || "";
          const items = row[4] || "";
          const price = parseInt(row[5], 10) || 0;
          const status = row[6] || "預約中";
          const cost = parseInt(row[7], 10) || 0;

          if (status !== "已取消") {
            totalRev += price;
            totalCost += cost;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${bookingId}</td>
            <td>${customerName}</td>
            <td>${date}</td>
            <td>${time}</td>
            <td>${items}</td>
            <td>NT$ ${price}</td>
            <td>
              <select id="status_${bookingId}">
                <option value="預約中" ${status === '預約中' ? 'selected' : ''}>預約中</option>
                <option value="已完成" ${status === '已完成' ? 'selected' : ''}>已完成</option>
                <option value="已取消" ${status === '已取消' ? 'selected' : ''}>已取消</option>
              </select>
            </td>
            <td>
              <input type="number" id="cost_${bookingId}" value="${cost}" style="width: 80px;" min="0">
            </td>
            <td>
              <button class="btn-save" onclick="updateBooking('${bookingId}')">儲存</button>
            </td>
          `;
          tableBody.appendChild(tr);
        });

        updateFinance(totalRev, totalCost);
      })
      .catch(err => {
        console.error("讀取失敗", err);
        tableBody.innerHTML = `<tr><td colspan="9" class="loading" style="color: red;">讀取失敗，請確認 Apps Script 權限或網址是否正確！</td></tr>`;
      });
  }

  function updateBooking(bookingId) {
    const newStatus = document.getElementById(`status_${bookingId}`).value;
    const newCost = document.getElementById(`cost_${bookingId}`).value;

    const payload = {
      action: "update",
      bookingId: bookingId,
      status: newStatus,
      cost: Number(newCost)
    };

    const btn = event.target;
    btn.innerText = "儲存中...";
    btn.disabled = true;

    fetch(scriptUrl, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "success") {
        alert(`預約 #${bookingId} 更新成功！`);
        fetchBookings(); // 重新整理表格與財務統計
      } else {
        alert("更新失敗：" + res.message);
        btn.innerText = "儲存";
        btn.disabled = false;
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線發生錯誤！");
      btn.innerText = "儲存";
      btn.disabled = false;
    });
  }

  function updateFinance(rev, cost) {
    const profit = rev - cost;
    document.getElementById('totalRevenue').innerText = `NT$ ${rev}`;
    document.getElementById('totalCost').innerText = `NT$ ${cost}`;
    document.getElementById('netProfit').innerText = `NT$ ${profit}`;
  }

  window.onload = function() {
    fetchBookings();
  };
</script>

</body>
</html>
