<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美甲工作室後台管理</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fcf6f9; margin: 0; padding: 20px; color: #4a4a4a; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { font-size: 24px; color: #d56062; margin-bottom: 20px; }
        .revenue-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3); }
        .revenue-title { font-size: 16px; opacity: 0.9; margin-bottom: 8px; }
        .revenue-amount { font-size: 36px; font-weight: bold; }
        .btn { background-color: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.3s; margin-bottom: 20px; }
        .btn:hover { background-color: #5a6fd6; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background-color: #fcfcfc; }
        .loading { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💅 美甲工作室後台管理</h1>
        
        <!-- 營收卡片 -->
        <div class="revenue-card">
            <div class="revenue-title">本月總營收</div>
            <div class="revenue-amount" id="totalRevenue">NT$ 0</div>
        </div>

        <button class="btn" onclick="fetchBookings()">重新整理資料</button>

        <!-- 預約清單表格 -->
        <h2>預約清單</h2>
        <table>
            <thead>
                <tr>
                    <th>預約編號</th>
                    <th>客人</th>
                    <th>日期</th>
                    <th>時間</th>
                    <th>項目</th>
                    <th>金額</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="bookingTableBody">
                <tr><td colspan="7" class="loading">正在載入資料...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ⚠️ 請確保這裡貼上的是你 Google Apps Script 部署後的「網頁應用程式網址」
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";

        function fetchBookings() {
            const tableBody = document.getElementById('bookingTableBody');
            tableBody.innerHTML = `<tr><td colspan="7" class="loading">正在讀取最新資料...</td></tr>`;

            fetch(scriptUrl)
                .then(response => response.json())
                .then(data => {
                    tableBody.innerHTML = "";
                    let totalRev = 0;

                    if (data.length === 0) {
                        tableBody.innerHTML = `<tr><td colspan="7" class="loading">目前沒有預約資料</td></tr>`;
                        document.getElementById('totalRevenue').innerText = "NT$ 0";
                        return;
                    }

                    data.forEach(row => {
                        const bookingId = row[0] || '';
                        const customerName = row[1] || '';
                        const date = row[2] || '';
                        const time = row[3] || '';
                        const items = row[4] || '';
                        const price = Number(row[5]) || 0;
                        const status = row[6] || '預約中';

                        // 加總金額
                        totalRev += price;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${bookingId}</td>
                            <td>${customerName}</td>
                            <td>${date}</td>
                            <td>${time}</td>
                            <td>${items}</td>
                            <td>NT$ ${price.toLocaleString()}</td>
                            <td>${status}</td>
                        `;
                        tableBody.appendChild(tr);
                    });

                    document.getElementById('totalRevenue').innerText = `NT$ ${totalRev.toLocaleString()}`;
                })
                .catch(error => {
                    console.error('Error:', error);
                    tableBody.innerHTML = `<tr><td colspan="7" class="loading" style="color: red;">讀取失敗，請確認網路或指令碼權限。</td></tr>`;
                });
        }

        // 頁面打開時自動載入一次
        window.onload = function() {
            fetchBookings();
        };
    </script>
</body>
</html>
