<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>美甲預約系統 - 後台管理</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fdfbf7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; color: #d4a373; }
    
    /* 統計卡片樣式 */
    .stats-container { display: flex; gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #faedcd; padding: 15px; border-radius: 8px; flex: 1; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #666; }
    .stat-card p { margin: 0; font-size: 20px; font-weight: bold; color: #bc6c25; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: center; font-size: 14px; }
    th { background: #fefae0; color: #555; }
    tr:nth-child(even) { background: #f9f9f9; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-refresh { background: #d4a373; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-bottom: 15px; }
    .btn-refresh:hover { background: #bc6c25; }
  </style>
</head>
<body>

<div class="container">
  <h2>美甲預約管理後台</h2>
  
  <!-- 財務統計看板 -->
  <div class="stats-container">
    <div class="stat-card">
      <h3>總預估營收</h3>
      <p id="totalRevenue">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>總材料成本 (手動填寫)</h3>
      <p id="totalCost">NT$ 0</p>
    </div>
    <div class="stat-card">
      <h3>淨利 (利潤)</h3>
      <p id="netProfit">NT$ 0</p>
    </div>
  </div>

  <button class="btn-refresh" onclick="fetchBookings()">重新整理資料</button>

  <table>
    <thead>
      <tr>
        <th>預約編號</th>
        <th>客戶名稱</th>
        <th>日期</th>
        <th>時間</th>
        <th>項目</th>
        <th>預估金額</th>
        <th>狀態</th>
        <th>成本</th>
      </tr>
    </thead>
    <tbody id="bookingTableBody">
      <tr><td colspan="8" class="loading">正在讀取最新資料...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // 🔗 你的最新 Google Apps Script 部署網址
  const scriptUrl = "https://script.google.com/macros/s/AKfycbzu25rQUBTULTCgpqFnSfx21oVWyb1LoFnqQtGLGGUhJ6UFCHzu7po873wKRphQEQEkIg/exec";

  function fetchBookings() {
    const tableBody = document.getElementById('bookingTableBody');
    tableBody.innerHTML = `<tr><td colspan="8" class="loading">正在讀取最新資料...</td></tr>`;

    fetch(scriptUrl)
      .then(response => response.json())
      .then(data => {
        tableBody.innerHTML = "";
        
        if (!data || data.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="8" class="loading">目前沒有預約資料</td></tr>`;
          updateFinance(0, 0);
          return;
        }

        let totalRev = 0;
        let totalCost = 0;

        data.forEach(row => {
          // 確保欄位依序對應：
          // row[0]: 預約編號, row[1]: 客戶名稱, row[2]: 日期, row[3]: 時間, 
          // row[4]: 項目, row[5]: 預估金額, row[6]: 狀態, row[7]: 成本
          const bookingId = row[0] || "";
          const customerName = row[1] || "";
          const date = row[2] || "";
          const time = row[3] || "";
          const items = row[4] || "";
          const price = parseInt(row[5], 10) || 0;
          const status = row[6] || "預約中";
          const cost = parseInt(row[7], 10) || 0;

          // 若非「已取消」，則計入營收與成本計算
          if (status !== "已取消") {
            totalRev += price;
            totalCost += cost;
          }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>#${bookingId}</td>
            <td>${customerName}</td>
            <td>${date}</td>
            <td>${time}</td>
            <td>${items}</td>
            <td>NT$ ${price}</td>
            <td style="color: ${status === '已取消' ? 'red' : 'green'}; font-weight: bold;">${status}</td>
            <td>NT$ ${cost}</td>
          `;
          tableBody.appendChild(tr);
        });

        updateFinance(totalRev, totalCost);
      })
      .catch(err => {
        console.error("讀取失敗", err);
        tableBody.innerHTML = `<tr><td colspan="8" class="loading" style="color: red;">讀取失敗，請確認 Apps Script 權限或網址是否正確！</td></tr>`;
      });
  }

  function updateFinance(rev, cost) {
    const profit = rev - cost;
    document.getElementById('totalRevenue').innerText = `NT$ ${rev}`;
    document.getElementById('totalCost').innerText = `NT$ ${cost}`;
    document.getElementById('netProfit').innerText = `NT$ ${profit}`;
  }

  // 頁面載入時自動抓取一次資料
  window.onload = function() {
    fetchBookings();
  };
</script>

</body>
</html>
